        }

        function setAnalogVal(id, val) {
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n.analogVal = Number(val);
            if (n.type === 'TX_LEVEL_420' || n.type === 'HCSR04') tankLevel = n.analogVal;
            renderAllNodes(); saveToLocalStorage();
            if (selectedNodeId === id) selectNode(id);
            if (isRunning) evaluateCircuitStep();
        }

        function toggleSimulation() {
            if (isRunning) { stopSimulation(); return; }
            if (!nodes.length) { alert('أضف عناصر إلى اللوحة أو اختر دائرة جاهزة من الذكاء الاصطناعي أولاً.'); return; }
            isRunning = true;
            document.getElementById('btnRunSim').classList.add('run-active');
            document.getElementById('simStatusText').innerHTML = '<span style="color:#10b981;font-weight:bold;">● المحاكاة قيد التشغيل (Live 2.5D)</span>';
            simInterval = setInterval(evaluateCircuitStep, 300);
            evaluateCircuitStep();
        }

        function stopSimulation() {
            isRunning = false;
            clearInterval(simInterval);
            document.getElementById('btnRunSim').classList.remove('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: متوقف (جاهز للتعديل والتوصيل)';
            nodes.forEach(n => {
                n.energized = false; n.running = false; n.q0 = false; n.q1 = false;
                n.d7 = false; n.servoOn = false; n.damaged = false; n.faultLit = false;
                if (n.type === 'TIMER_RELAY') { n.timerSec = n.timerMax || 5.0; n.timerDone = false; }
                if (n.type === 'VOLTMETER') n.voltVal = '0 V';
                if (n.type === 'FREQ_METER') n.freqVal = '0.0Hz';
                if (n.type === 'AMMETER') n.ampVal = '0.0 A';
                if (n.type === 'MULTIMETER') n.reading = '0.00 A';
            });
            wires.forEach(w => { w.live = false; w.shorted = false; w.overheated = false; });
            renderAllNodes();
            if (document.getElementById('hmiModal').classList.contains('open')) renderHmiGrid();
        }

        function evaluateCircuitStep() {
            if (!isRunning) return;

            // 1. Short Circuit Detection (Direct Phase-to-Neutral or Phase-to-Phase fault)
            let shortFound = false;
            wires.forEach(w => {
                const n1 = nodes.find(n => n.id === w.fromNode), n2 = nodes.find(n => n.id === w.toNode);
                if (!n1 || !n2) return;
                const isSupply = n => ['SUPPLY_3P', 'MCB_3P', 'ATS_GRID', 'ATS_GEN', 'CAT_GENSET'].includes(n.type);
                const isPhase = p => ['L1', 'L2', 'L3', '1', '3', '5', '2', '4', '6', 'L'].includes(p);
                const isNeutral = p => ['N', 'N1', 'N2', 'PE'].includes(p);
                if (isSupply(n1) && isSupply(n2)) {
                    if ((isPhase(w.fromPort) && isNeutral(w.toPort)) || (isNeutral(w.fromPort) && isPhase(w.toPort)) ||
                        (n1.id === n2.id && isPhase(w.fromPort) && isPhase(w.toPort) && w.fromPort !== w.toPort)) {
                        w.shorted = true; shortFound = true;
                    }
                }
            });

            if (shortFound) {
                playSoundEffect('trip');
                nodes.forEach(b => { if (b.type === 'MCB_3P' || b.type === 'MCB_1P' || b.type === 'MPCB') b.tripped = true; });
                showFault('🔥 قصر كهربائي مباشر (Short Circuit)! فصل القاطع الرئيسي فوراً لحماية اللوحة.');
                renderAllNodes();
                return;
            }

            // 2. Check Upstream Breakers & Power Sources
            const breakers = nodes.filter(n => ['MCB_3P', 'MCB_1P', 'MPCB'].includes(n.type));
            const anyBreakerTripped = breakers.some(b => b.tripped);

            const hasSupply = !anyBreakerTripped && nodes.some(n =>
                n.type === 'SUPPLY_3P' ||
                (n.type === 'ATS_GRID' && n.swState !== false) ||
                (n.type === 'ATS_GEN' && n.swState) ||
                (n.type === 'CAT_GENSET' && n.swState) ||
                n.type === 'ARDUINO_UNO' || n.type === 'ARDUINO_MEGA' || n.type === 'ESP32_BOARD' ||
                n.type.startsWith('PLC_') || n.type === 'S7_1200_PLC'
            );

            // 3. Evaluate Stop / E-Stop / Overload / Dual NC / Safety Interlocks
            const eStop = nodes.find(n => n.type === 'E_STOP' && n.swState);
            const stopBtn = nodes.find(n => n.type === 'BTN_STOP' && n.pressed);
            const dualNcPressed = nodes.find(n => n.type === 'BTN_DUAL' && n.pressed);
            const olNode = nodes.find(n => n.type === 'OVERLOAD');
            const olTripped = olNode && olNode.swState;
            const safetyCut = Boolean(eStop || stopBtn || olTripped || anyBreakerTripped);

            // Update Safety / Phase / PTC relays
            nodes.forEach(n => {
                if (n.type === 'SAFETY_RELAY') n.energized = hasSupply && !eStop;
                if (n.type === 'PHASE_RELAY') n.energized = hasSupply;
                if (n.type === 'PTC_RELAY') n.energized = hasSupply && !olTripped;
                if (n.type === 'SOCKET_16A') n.energized = hasSupply;
            });

            // 4. Evaluate Contactors & Relays (with True Latching Logic)
            const startBtns = nodes.filter(n => n.type === 'BTN_START' || n.type === 'BTN_DUAL');
            const switches = nodes.filter(n => ['SW_0_1', 'LIMIT_SW', 'FLOAT_SW', 'THERMOSTAT', 'PROX_PNP', 'PROX_NPN'].includes(n.type));
            const sel102 = nodes.find(n => n.type === 'SEL_1_0_2');
            const sel123 = nodes.find(n => n.type === 'SEL_1_2_3');
            const atsEoq = nodes.find(n => n.type === 'ATS_EOQ3');
            const contactors = nodes.filter(n => n.type.startsWith('KM_') || n.type.startsWith('RELAY_'));
            const prevStates = contactors.map(c => c.energized);

            if (!hasSupply || safetyCut) {
                contactors.forEach(c => c.energized = false);
            } else {
                const gridNode = nodes.find(n => n.type === 'ATS_GRID');
                const genNode = nodes.find(n => n.type === 'ATS_GEN' || n.type === 'CAT_GENSET');

                // ATS Mode (2-Line or 3-Line)
                if ((gridNode || genNode || atsEoq) && contactors.length >= 2) {
                    const gridOk = gridNode ? (gridNode.swState !== false) : (atsEoq ? !atsEoq.swState : true);
                    const genOk = genNode ? Boolean(genNode.swState) : (atsEoq ? Boolean(atsEoq.swState) : false);
                    contactors[0].energized = gridOk;
                    contactors[1].energized = !gridOk && genOk;
                    if (contactors[2]) contactors[2].energized = !gridOk && !genOk;
                } else {
                    contactors.forEach((km, idx) => {
                        // Check if contactor has a holding/latching wire on 13/14 or AUX 53/54
                        const hasLatch = wires.some(w =>
                            (w.fromNode === km.id && ['13', '14', '53', '54'].includes(w.fromPort)) ||
                            (w.toNode === km.id && ['13', '14', '53', '54'].includes(w.toPort))
                        );

                        // Check dedicated start button wired to this contactor or general start button
                        const wiredStart = startBtns.find(b => wires.some(w =>
                            (w.fromNode === b.id && w.toNode === km.id) || (w.toNode === b.id && w.fromNode === km.id)
                        ));
                        const btnPressed = wiredStart ? wiredStart.pressed : (startBtns[idx] ? startBtns[idx].pressed : (startBtns[0] && startBtns[0].pressed));
                        const swActive = switches.some(s => s.swState);

                        // Selector switch override
                        let selTrigger = false;
                        if (sel102) {
                            if (idx === 0 && sel102.selPos === 1) selTrigger = true;
                            if (idx === 1 && sel102.selPos === 2) selTrigger = true;
                            if (sel102.selPos === 0 && !btnPressed && !swActive) km.energized = false;
                        }
                        if (sel123) {
                            if (sel123.selPos === idx) selTrigger = true;
                        }

                        const triggerActive = Boolean(btnPressed || swActive || selTrigger);

                        // Interlock check for Forward/Reverse (KM1 & KM2)
                        const isFwdRevPair = contactors.length === 2 && nodes.some(m => m.type === 'MOTOR_SD');
                        if (triggerActive) {
                            if (isFwdRevPair && idx === 0 && contactors[1].energized) return;
                            if (isFwdRevPair && idx === 1 && contactors[0].energized) return;
                            if (dualNcPressed && isFwdRevPair && idx === 0 && wiredStart !== dualNcPressed) {
                                km.energized = false;
                                return;
                            }
                            km.energized = true;
                        } else if (!hasLatch) {
                            km.energized = false;
                        }
                    });
                }
            }

            // Update Auxiliary Contact Blocks attached/present with main contactors
            nodes.forEach(n => {
                if (['AUX_2', 'AUX_4', 'KM_TIMER'].includes(n.type)) {
                    n.energized = contactors.some(c => c.energized);
                }
            });

            if (contactors.some((c, i) => c.energized !== prevStates[i])) playSoundEffect('clack');

            // 5. Timer Relay & Star-Delta Transition
            const timerNode = nodes.find(n => n.type === 'TIMER_RELAY');
            const mainKmOn = contactors.some(c => c.energized);
            if (timerNode && hasSupply && !safetyCut && mainKmOn) {
                if (timerNode.timerSec > 0) {
                    timerNode.timerSec = Math.max(0, +(timerNode.timerSec - 0.3).toFixed(1));
                    timerNode.timerDone = false;
                } else {
                    if (!timerNode.timerDone) playSoundEffect('clack');
                    timerNode.timerDone = true;
                }
            } else if (timerNode) {
                timerNode.timerSec = timerNode.timerMax || 5.0;
                timerNode.timerDone = false;
            }

            // 6. PLC Logic & Ladder Rungs Evaluation
            const plcNode = nodes.find(n => n.type.startsWith('PLC_') || n.type === 'S7_1200_PLC');
            const lvlTx = nodes.find(n => n.type === 'TX_LEVEL_420');
            if (lvlTx) tankLevel = lvlTx.analogVal !== undefined ? lvlTx.analogVal : tankLevel;

            if (plcNode) {
                const i00 = startBtns.some(b => b.pressed) || switches.some(s => s.swState);
                const i01 = Boolean(stopBtn || eStop);
                if (i01) plcAutoLatch = false;
                else if (i00) plcAutoLatch = true;

                customLadderRungs.forEach(r => {
                    const evalContact = (addr, type) => {
                        let state = false;
                        if (addr === 'I0.0') state = i00;
                        else if (addr === 'I0.1') state = i01;
                        else if (addr === 'M0.0') state = plcAutoLatch;
                        else if (addr.startsWith('IW64<')) state = tankLevel < parseFloat(addr.split('<')[1]);
                        else if (addr.startsWith('IW64>')) state = tankLevel > parseFloat(addr.split('>')[1]);
                        return type === 'NC' ? !state : state;
                    };
                    r.live = evalContact(r.in1, r.type1) && evalContact(r.in2, r.type2);
                    if (r.coil === 'M0.0') plcAutoLatch = r.live;
                    if (r.coil === 'Q0.0') plcNode.q0 = r.live;
                    if (r.coil === 'Q0.1') plcNode.q1 = r.live;
                });
            }

            // 7. Arduino / ESP32 Live Logic
            const ardNode = nodes.find(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type));
            const servoNode = nodes.find(n => n.type === 'SERVO_MOTOR');
            const relay5v = nodes.find(n => n.type === 'RELAY_5V');
            const lcdNode = nodes.find(n => n.type === 'LCD_I2C');
            const anySensor = nodes.find(n => ['TX_TEMP', 'TX_LEVEL_420', 'POT_CTRL', 'HCSR04', 'DHT22'].includes(n.type));

            if (ardNode) {
                const sVal = anySensor && anySensor.analogVal !== undefined ? anySensor.analogVal : 50;
                const ltMatch = arduinoCode.match(/val\s*<\s*(\d+)/);
                const gtMatch = arduinoCode.match(/val\s*>\s*(\d+)/);
                let active = sVal < 85;
                if (ltMatch) active = sVal < parseInt(ltMatch[1], 10);
                else if (gtMatch) active = sVal > parseInt(gtMatch[1], 10);
                if (startBtns.some(b => b.pressed)) active = true;

                ardNode.d7 = active;
                if (relay5v) relay5v.energized = active;
                if (servoNode) servoNode.servoOn = active;
                if (lcdNode) lcdNode.lcdText = `V:${sVal} ${active ? 'ACT:ON' : 'IDLE'}`;
            }

            // 8. Motors, Pumps, Terminal Box & Thermal Current Physics
            const vfdNode = nodes.find(n => n.type === 'VFD_400V');
            const softNode = nodes.find(n => n.type === 'SOFT_STARTER');
            const termBox = nodes.find(n => n.type === 'MOTOR_TERMINAL_BOX');
            const linkMode = termBox ? (termBox.linkMode || 'STAR') : 'STAR';

            if (vfdNode) vfdNode.running = hasSupply && !safetyCut && (mainKmOn || startBtns.some(b => b.pressed) || switches.some(s => s.swState));
            if (softNode) softNode.running = hasSupply && !safetyCut && (mainKmOn || startBtns.some(b => b.pressed));

            const powerActive = hasSupply && !safetyCut && (mainKmOn || (plcNode && plcNode.q0) || (relay5v && relay5v.energized) || (vfdNode && vfdNode.running) || (softNode && softNode.running));
            const openCircuitFault = termBox && linkMode === 'OPEN' && powerActive;

            nodes.forEach(n => {
                if (['MOTOR_SD', 'MOTOR_PTC', 'MOTOR_DC24', 'VALVE_PUMP_UNIT', 'PUMP_1P'].includes(n.type)) {
                    n.running = powerActive && !openCircuitFault;
                    if (n.type === 'MOTOR_SD') {
                        if (contactors.length >= 3 && timerNode) {
                            n.sdMode = timerNode.timerDone ? 'DELTA Δ' : 'STAR Y';
                        } else if (contactors.length === 2) {
                            n.sdMode = contactors[1].energized ? 'REV' : 'FWD';
                        } else {
                            n.sdMode = linkMode === 'DELTA' ? 'DELTA Δ' : 'STAR Y';
                        }
                    }
                }
                if (['LAMP_GREEN', 'LED_220', 'HEATER_FAN'].includes(n.type)) n.energized = powerActive;
                if (n.type === 'TOWER_2' || n.type === 'TOWER_3') {
                    n.energized = powerActive;
                    n.faultLit = safetyCut || openCircuitFault;
                }
                if (n.type === 'LAMP_RED' || n.type === 'BUZZER' || n.type === 'SIREN') {
                    n.energized = safetyCut || (!powerActive && hasSupply && n.type === 'LAMP_RED');
                }
            });

            if (nodes.some(n => (n.type === 'BUZZER' || n.type === 'SIREN') && n.energized)) {
                buzzerTick++;
                if (buzzerTick % 3 === 0) playSoundEffect('buzzer');
            }

            // Calculate Current (A), Energy (kWh), Running Hours & Wire Overheating
            const deltaFactor = (linkMode === 'DELTA' || (timerNode && timerNode.timerDone)) ? 1.45 : 1.0;
            const currentAmps = (powerActive && !openCircuitFault) ? +((14.2 + (tankLevel * 0.11)) * deltaFactor).toFixed(1) : 0.0;

            if (powerActive && !openCircuitFault) {
                totalRunningHours += 0.3 / 3600;
                const kw = (1.732 * 400 * currentAmps * 0.85) / 1000;
                totalEnergyKwh += kw * (0.3 / 3600);
            }

            let wireOverheatDetected = false;
            wires.forEach(w => {
                const n1 = nodes.find(n => n.id === w.fromNode);
                const isSupplyWire = n1 && ['SUPPLY_3P', 'ATS_GRID', 'ATS_GEN', 'CAT_GENSET', 'MCB_3P', 'MCB_1P'].includes(n1.type) && hasSupply;
                w.live = powerActive || isSupplyWire;
                w.overheated = powerActive && currentAmps > (w.ampLimit || 16);
                if (w.overheated) wireOverheatDetected = true;
            });

            if (wireOverheatDetected) {
                showFault(`🔥 تحذير حراري: التيار (${currentAmps}A) يتجاوز قدرة تحمل مقطع السلك! اختر مقطعاً أكبر (mm²).`);
            }

            // Thermal Overload Auto-Trip Protection
            if (olNode && !olNode.swState && powerActive && currentAmps > (olNode.tripAmp || 25)) {
                olNode.swState = true;
                playSoundEffect('trip');
                showFault(`⚡ فصل الأوفرلود الحراري (${olNode.tag})! التيار (${currentAmps}A) تجاوز الحد (${olNode.tripAmp || 25}A).`);
            }

            // Update All Live Meters
            const selVa = nodes.find(n => n.type === 'SEL_VA');
            const hzVal = vfdNode && vfdNode.running ? (vfdNode.vfdHz || 50).toFixed(1) + 'Hz' : (hasSupply ? '50.0Hz' : '0.0Hz');
            nodes.forEach(n => {
                if (n.type === 'VOLTMETER') {
                    if (!hasSupply || (selVa && selVa.selPos === 3)) n.voltVal = '0 V';
                    else n.voltVal = (397 + Math.floor(Math.random() * 4)) + ' V';
                }
                if (n.type === 'AMMETER') n.ampVal = currentAmps.toFixed(1) + ' A';
                if (n.type === 'MULTIMETER') n.reading = currentAmps.toFixed(2) + ' A';
                if (n.type === 'FREQ_METER') n.freqVal = hzVal;
                if (n.type === 'HOUR_METER') n.hoursVal = totalRunningHours.toFixed(1).padStart(7, '0') + 'h';
                if (n.type === 'KWH_METER') n.kwhVal = totalEnergyKwh.toFixed(2) + ' kWh';
            });

            // 9. Process Tank & Sewage Station Update
            const pumpRunning = nodes.some(n => (n.type === 'PUMP_1P' || n.type === 'VALVE_PUMP_UNIT') && n.running);
            if (pumpRunning) tankLevel = Math.min(100, tankLevel + 1.8);
            if (outletOpen) tankLevel = Math.max(0, tankLevel - 0.7);
            if (lvlTx) lvlTx.analogVal = Math.round(tankLevel);

            sewageLevel = Math.min(100, sewageLevel + 1.1);
            activeSewagePumps = sewageLevel >= 88 ? 4 : (sewageLevel >= 76 ? 3 : (sewageLevel >= 62 ? 2 : (sewageLevel >= 45 ? 1 : 0)));
            if (activeSewagePumps > 0) sewageLevel = Math.max(20, sewageLevel - activeSewagePumps * 0.65);

            // 10. Scope History
            scopeHistory.push(currentAmps);
            if (scopeHistory.length > 40) scopeHistory.shift();
            scopePhaseTick += 0.45;

            renderAllNodes();
            if (document.getElementById('hmiModal').classList.contains('open')) renderHmiGrid();
            if (document.getElementById('bottomDock').classList.contains('open')) {
                const title = document.getElementById('dockTitle').textContent;
                if (title.includes('راسم')) renderOscilloscope();
                if (title.includes('الخزان')) renderProcessTank();
                if (title.includes('PLC')) renderPlcLadder();
                if (title.includes('الأردوينو')) renderArduinoIde();
            }
        }

        function showFault(msg) {
            const t = document.getElementById('faultToast');
            t.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start;gap:8px;"><div>${msg}</div><button onclick="document.getElementById('faultToast').style.display='none'" style="background:none;border:none;color:#fca5a5;font-weight:bold;cursor:pointer;">✕</button></div>`;

        function runFaultDiagnostics() {
            if (!nodes.length) { showFault('⚠️ اللوحة فارغة! أضف عناصر كهربائية أو اختر دائرة جاهزة من الذكاء الاصطناعي.'); return; }
            const issues = [];
            if (!nodes.some(n => ['SUPPLY_3P', 'ATS_GRID', 'CAT_GENSET', 'ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD', 'S7_1200_PLC'].includes(n.type) || n.type.startsWith('PLC_'))) {
                issues.push('• لا يوجد مصدر تغذية رئيسي (3~ 400V / 24V DC أو مولدة CAT) في الدائرة.');
            }
            if (nodes.some(n => n.type.startsWith('MOTOR_')) && !nodes.some(n => ['OVERLOAD', 'MPCB'].includes(n.type))) {
                issues.push('• تحذير هندسي: يوجد محرك كهربائي بدون حماية حرارية (Thermal Overload أو MPCB).');
            }
            if (nodes.some(n => ['MCB_3P', 'MCB_1P', 'MPCB'].includes(n.type) && n.tripped)) {
                issues.push('• يوجد قاطع كهربائي في حالة فصل (TRIPPED). انقر على القاطع لإعادة توصيله.');
            }
            const tBox = nodes.find(n => n.type === 'MOTOR_TERMINAL_BOX');
            if (tBox && tBox.linkMode === 'OPEN') {
                issues.push('• روزتة المحرك (Motor Terminal Box) في وضع OPEN بدون جسور نحاسية Star أو Delta!');
            }
            if (!wires.length) issues.push('• لم يتم توصيل أي أسلاك! اضغط "توصيل تلقائي" أو انقر على البراغي النحاسية للتوصيل.');

            if (issues.length) showFault(`<strong>تقرير الفحص الهندسي:</strong><br>${issues.join('<br>')}`);
            else {
                const t = document.getElementById('faultToast');
                t.style.background = 'rgba(6, 78, 59, 0.97)'; t.style.borderColor = '#10b981'; t.style.color = '#d1fae5';
                t.innerHTML = '✅ <strong>الدائرة سليمة ومطابقة للمواصفات القياسية IEC!</strong> جميع الحمايات والأسلاك جاهزة للتشغيل.';
                t.style.display = 'block';
                setTimeout(() => { t.style.display = 'none'; t.style.background = ''; t.style.borderColor = ''; t.style.color = ''; }, 4000);
            }
        }

                const uno = addComponent('ARDUINO_UNO', 40, 180, '-ARD1');
                const temp = addComponent('TX_TEMP', 210, 40, '-TT1');
                const rel = addComponent('RELAY_5V', 215, 185, '-K1');
                const srv = addComponent('SERVO_MOTOR', 40, 320, '-M1');
                const lcd = addComponent('LCD_I2C', 175, 320, '-LCD1');
                addW(temp, 'OUT', uno, 'A0', '#eab308', '1.5');
                addW(uno, 'D7', rel, 'IN', '#ef4444', '1.5');
                addW(uno, 'D9', srv, 'PWM', '#38bdf8', '1.5');
                addW(uno, '5V', lcd, 'VCC', '#10b981', '1.5');
            }
            renderAllNodes(); saveToLocalStorage();
            setTimeout(() => { fitToScreen(); toggleSimulation(); }, 80);
        }

        function runAiCircuitBuilder() {
            const q = document.getElementById('aiPromptInput').value.trim().toLowerCase();
            if (q.includes('3') || q.includes('ثلاث') || q.includes('cat')) buildPresetCircuit('ats3');
            else if (q.includes('ats') || q.includes('مولد')) buildPresetCircuit('ats');
            else if (q.includes('ستار') || q.includes('star') || q.includes('روزت')) buildPresetCircuit('stardelta');
            else if (q.includes('عكس') || q.includes('rev')) buildPresetCircuit('rev');
            else if (q.includes('vfd') || q.includes('سرع')) buildPresetCircuit('vfd');
            else if (q.includes('plc') || q.includes('خزان') || q.includes('s7')) buildPresetCircuit('plc');
            else if (q.includes('اردوينو') || q.includes('أردوينو') || q.includes('سيرفو')) buildPresetCircuit('arduino');
            else buildPresetCircuit('dol');
        }

        function startChallenge(type, goalText, presetKind) {
            activeChallengeGoal = goalText;
            buildPresetCircuit(presetKind);
            setTimeout(() => {
                if (type === 'overload') {
                    const ol = nodes.find(n => n.type === 'OVERLOAD');
                    if (ol) { ol.swState = true; renderAllNodes(); }
                } else if (type === 'estop') {
                    const es = addComponent('E_STOP', 410, 55, '-ES1');
                    es.swState = true; renderAllNodes();
                } else if (type === 'openbox') {
                    const tb = nodes.find(n => n.type === 'MOTOR_TERMINAL_BOX');
                    if (tb) { tb.linkMode = 'OPEN'; renderAllNodes(); }
                }
                openDock('challenges');
            }, 350);
        }

        function injectRandomFault() {
            if (!nodes.length) buildPresetCircuit('dol');
            setTimeout(() => {
                const modes = ['OVERLOAD', 'E_STOP', 'OPEN_BOX', 'MCB_TRIP'];
                const pick = modes[Math.floor(Math.random() * modes.length)];
                if (pick === 'OVERLOAD') {
                    const ol = nodes.find(n => n.type === 'OVERLOAD') || addComponent('OVERLOAD', 280, 320, '-F1');
                    ol.swState = true;
                    activeChallengeGoal = 'عطل عشوائي: الأوفرلود الحراري مفصول (TRIPPED). انقر عليه لإعادة الضبط وتشغيل المحرك!';
                } else if (pick === 'E_STOP') {
                    const es = nodes.find(n => n.type === 'E_STOP') || addComponent('E_STOP', 410, 55, '-ES1');
                    es.swState = true;
                    activeChallengeGoal = 'عطل عشوائي: مفتاح الطوارئ E-STOP مضغوط ومقفول. حرره لاستعادة التغذية!';
                } else if (pick === 'MCB_TRIP') {
                    const mcb = nodes.find(n => n.type === 'MCB_3P') || addComponent('MCB_3P', 165, 55, '-Q1');
                    mcb.tripped = true;
                    activeChallengeGoal = 'عطل عشوائي: القاطع الرئيسي MCB مفصول (TRIPPED). انقر على القاطع لإعادة توصيله!';
                } else {
                    const tb = nodes.find(n => n.type === 'MOTOR_TERMINAL_BOX') || addComponent('MOTOR_TERMINAL_BOX', 240, 330, '-X1');
                    tb.linkMode = 'OPEN';
                    activeChallengeGoal = 'عطل عشوائي: جسور النحاس في روزتة المحرك مفقودة (OPEN). انقر على الروزتة لتوصيل Star أو Delta!';
                }
                renderAllNodes();
                openDock('challenges');
            }, 250);
        }

        function renderOscilloscope() {
            const body = document.getElementById('dockBody');
            const maxA = Math.max(30, ...scopeHistory);
            const pts = scopeHistory.map((v, i) => `${(i / 39) * 580},${95 - (v / maxA) * 80}`).join(' ');
            const cur = scopeHistory[scopeHistory.length - 1] || 0;
            const amp = cur > 0 ? 28 : 0;
            const wave = (shift) => Array.from({ length: 60 }, (_, i) => {
                const x = (i / 59) * 580;
                const y = 50 - Math.sin(i * 0.25 + scopePhaseTick + shift) * amp;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');

            body.innerHTML = `
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.75rem;">
                    <span>التيار اللحظي: <strong style="color:#facc15;">${cur.toFixed(1)} A</strong></span>
                    <span>الجهد: <strong style="color:#38bdf8;">${cur > 0 ? '400 V (L1/L2/L3)' : '0 V'}</strong></span>
                    <span>معامل القدرة: <strong style="color:#10b981;">${cur > 0 ? '0.85 cosφ' : '--'}</strong></span>
                </div>
                <svg width="100%" height="105" viewBox="0 0 580 105" style="background:#05080f;border:1px solid #1e293b;border-radius:8px;margin-bottom:6px;">
                    <line x1="0" y1="50" x2="580" y2="50" stroke="#1e293b" stroke-dasharray="4 4"/>
                    <polyline fill="none" stroke="#ef4444" stroke-width="2" points="${wave(0)}"/>
                    <polyline fill="none" stroke="#eab308" stroke-width="2" points="${wave(2.094)}"/>
                    <polyline fill="none" stroke="#3b82f6" stroke-width="2" points="${wave(4.188)}"/>
                    <polyline fill="none" stroke="#10b981" stroke-width="2.4" points="${pts}"/>
                </svg>
                <div style="font-size:0.7rem;color:#94a3b8;display:flex;gap:12px;">
                    <span style="color:#ef4444;">— L1 (0°)</span>
                    <span style="color:#eab308;">— L2 (120°)</span>
                    <span style="color:#3b82f6;">— L3 (240°)</span>
                    <span style="color:#10b981;">— تيار الحمل (Amps)</span>
                </div>`;
        }

        function addLadderRung() {
            customLadderRungs.push({ id: 'r_' + Date.now(), title: 'Network ' + (customLadderRungs.length + 1), in1: 'I0.0', type1: 'NO', in2: 'M0.0', type2: 'NO', coil: 'Q0.1', live: false });

        function toggleLadderContact(id, field) {
            const r = customLadderRungs.find(x => x.id === id);

            r[field] = r[field] === 'NO' ? 'NC' : 'NO';
            saveToLocalStorage(); renderPlcLadder();
        }
        function updateLadderAddr(id, field, val) {
            const r = customLadderRungs.find(x => x.id === id);
            if (!r) return;
            r[field] = val.trim();
            saveToLocalStorage(); renderPlcLadder();
        }

        function renderBomReport() {
            const body = document.getElementById('dockBody');
            const counts = {};

            nodes.forEach(n => {
                const def = getCompDef(n.type);

                counts[lbl].qty++;

                counts[lbl].cost += price;
            });
            const wireCost = Math.round(wires.length * 1.5 * 0.8);

                    <button class="t-btn" onclick="openPrintableReport()">تقرير هندسي + طباعة PDF</button>
                </div>
                <table class="bom-table"><thead><tr><th>اسم العنصر</th><th>الكمية</th><th>الرموز</th><th>التكلفة (USD)</th></tr></thead><tbody>${rows}</tbody></table>`;
        }

        /* =========================================================
           8. KEYBOARD SHORTCUTS & INITIALIZATION
           ========================================================= */
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undoAction();
            } else if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedNodeId) { e.preventDefault(); deleteSelectedNode(); }
                else if (selectedWireId) { e.preventDefault(); deleteSelectedWire(); }
            } else if (e.key.toLowerCase() === 'r') {
                if (selectedNodeId) { e.preventDefault(); rotateSelectedNode(); }
            } else if (e.key === 'Escape') {
                handleCanvasBgClick();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            buildPalette();
            setupCanvasPanAndPinch();
            if (window.innerWidth <= 768) document.getElementById('compSidebar').classList.add('collapsed');
            if (!loadFromUrlOrStorage()) {
                buildPresetCircuit('dol');
                stopSimulation();
            }
            setTimeout(fitToScreen, 100);
        });
    </script>
</body>
</html>
