<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltAI Studio Pro | محاكي الكلاسيك كنترول والـ PLC والأردوينو</title>
    <style>
        :root {
            --bg-canvas: #0c0e12;
            --grid-dot: #262c36;
            --panel-bg: #131720;
            --panel-border: #252c38;
            --accent: #10b981;
            --accent-blue: #3b82f6;
            --danger: #ef4444;
            --text-main: #f3f4f6;
        }
        body.light-blueprint {
            --bg-canvas: #d8dee6;
            --grid-dot: #b8c2ce;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-canvas); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .svg-ic { width: 15px; height: 15px; flex-shrink: 0; display: inline-block; vertical-align: middle; }

        .top-bar { min-height: 48px; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 5px 8px; gap: 5px; z-index: 100; }
        .brand-group, .sim-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        .back-voltai-btn { background: rgba(59,130,246,0.14); border: 1px solid rgba(59,130,246,0.45); color: #60a5fa; height: 33px; padding: 0 9px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .t-btn { background: #1a202c; border: 1px solid #2d3748; color: var(--text-main); height: 33px; padding: 0 9px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .t-btn:hover { border-color: var(--accent-blue); }
        .t-btn.run-active { background: var(--accent); color: #042f2e; border-color: var(--accent); }
        .t-btn.lock-active { background: #f59e0b; color: #1c1917; border-color: #f59e0b; }
        .t-btn.ai-magic { background: linear-gradient(135deg, #2563eb, #7c3aed); border: none; color: #fff; box-shadow: 0 0 14px rgba(124,58,237,0.4); }

        .studio-body { flex: 1; display: flex; position: relative; overflow: hidden; }
        .comp-sidebar { width: 295px; background: rgba(19,23,32,0.99); border-left: 1px solid var(--panel-border); display: flex; flex-direction: column; z-index: 80; flex-shrink: 0; }
        .comp-sidebar.collapsed { display: none !important; }
        @media (max-width: 768px) { .comp-sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 84%; max-width: 310px; box-shadow: -12px 0 30px rgba(0,0,0,0.85); } }

        .search-wrap { padding: 8px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; gap: 6px; }
        .search-input-box { flex: 1; display: flex; align-items: center; background: #0c0e12; border: 1px solid #2d3748; border-radius: 8px; padding: 0 8px; color: #9ca3af; }
        .search-input-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 8px 6px; font-size: 0.79rem; outline: none; }
        .close-sidebar-btn { background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.45); color: #f87171; width: 33px; height: 33px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cat-scroll { flex: 1; overflow-y: auto; padding: 6px; }
        .cat-group { margin-bottom: 6px; }
        .cat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #171c26; border-radius: 8px; font-size: 0.79rem; font-weight: 800; color: #e5e7eb; cursor: pointer; user-select: none; }
        .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 7px; }
        .cat-items { display: flex; flex-direction: column; gap: 4px; padding: 5px 2px; }
        .cat-items.closed { display: none; }
        .palette-item { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid transparent; cursor: pointer; font-size: 0.77rem; color: #d1d5db; }
        .palette-item:hover { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.45); color: #fff; }
        .palette-thumb { width: 42px; height: 38px; background: #0c0e12; border: 1px solid #262f3d; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 2px; }
        .palette-thumb svg { width: 100%; height: 100%; object-fit: contain; }

        .canvas-area { flex: 1; position: relative; background-color: var(--bg-canvas); background-image: radial-gradient(var(--grid-dot) 1.4px, transparent 1.4px); background-size: 22px 22px; overflow: hidden; touch-action: none; cursor: grab; }
        .canvas-area:active { cursor: grabbing; }
        body.light-blueprint .canvas-area { background-image: linear-gradient(to right, rgba(100,116,139,0.16) 1px, transparent 1px), linear-gradient(to bottom, rgba(100,116,139,0.16) 1px, transparent 1px); background-size: 20px 20px; }
        #workspaceStage { position: absolute; top: 0; left: 0; width: 2400px; height: 2400px; transform-origin: 0 0; will-change: transform; }
        #wiresSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        .wire-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; cursor: pointer; }
        .wire-stroke:hover { stroke-width: 6.5 !important; }
        @keyframes currentFlow { to { stroke-dashoffset: -20; } }
        .wire-energized { stroke-dasharray: 7 3; animation: currentFlow 0.45s linear infinite; filter: drop-shadow(0 0 4px currentColor); }
        @keyframes faultBlink { 0%, 100% { stroke: #ef4444; stroke-width: 5; } 50% { stroke: #fde047; stroke-width: 7; } }
        .wire-shorted { animation: faultBlink 0.35s infinite; }

        .sim-node { position: absolute; z-index: 20; user-select: none; touch-action: none; }
        .sim-node.selected-node .hw-wrap { filter: drop-shadow(0 0 8px rgba(59,130,246,0.9)); }
        .hw-wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.72)); }
        .hw-card-fallback { background: linear-gradient(180deg, #272b33 0%, #1b1e24 100%); border: 1.5px solid #3f4654; border-radius: 6px; padding: 12px 10px 10px; min-width: 104px; display: flex; flex-direction: column; align-items: center; }
        .yellow-tag { background: #facc15; color: #18181b; font-size: 0.6rem; font-weight: 900; padding: 1px 6px; border-radius: 2px; border: 1px solid #ca8a04; letter-spacing: 0.3px; margin-bottom: 2px; }

        .term-port { position: absolute; width: 13px; height: 13px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f1f5f9, #64748b 65%, #1e293b 100%); border: 1.5px solid #090b0f; box-shadow: 0 0 0 1.5px #475569; cursor: crosshair; z-index: 40; display: flex; align-items: center; justify-content: center; }
        .term-port::after { content: ''; width: 7px; height: 1.6px; background: #0f172a; transform: rotate(-30deg); }
        .term-port:hover, .term-port.active-pin { background: #f59e0b; box-shadow: 0 0 9px #f59e0b; transform: translate(-50%, -50%) scale(1.42); }
        .term-lbl { position: absolute; font-size: 0.52rem; font-weight: 800; color: #cbd5e1; background: rgba(12,14,18,0.85); padding: 0 2px; border-radius: 2px; pointer-events: none; white-space: nowrap; }

        .bezel-ring { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(145deg, #e2e8f0, #475569); padding: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.65); margin: 2px 0; }
        .push-actuator { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #0f172a; cursor: pointer; }
        .push-actuator:active { transform: scale(0.88); }
        .toggle-pill { background: linear-gradient(180deg, #272b33, #14171d); border: 1px solid #4b5563; color: #38bdf8; font-size: 0.64rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; cursor: pointer; margin-top: 3px; }
        @keyframes spinRotor { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .rotor-spinning { transform-origin: 44px 36px; animation: spinRotor 0.5s linear infinite; }

        .floating-wire-bar { position: absolute; top: 8px; left: 8px; background: rgba(19,23,32,0.94); border: 1px solid var(--panel-border); padding: 5px 9px; border-radius: 10px; display: flex; align-items: center; gap: 6px; z-index: 70; }
        .w-color-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .w-color-dot.active { border-color: #fff; transform: scale(1.16); }

        .zoom-controls { position: absolute; bottom: 54px; left: 10px; background: rgba(19,23,32,0.95); border: 1px solid var(--panel-border); border-radius: 10px; padding: 4px; display: flex; align-items: center; gap: 4px; z-index: 72; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
        .z-btn { background: #1e2532; border: 1px solid #334155; color: #f8fafc; width: 30px; height: 30px; border-radius: 7px; font-size: 0.85rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .z-pct { font-size: 0.72rem; font-weight: 800; color: #38bdf8; padding: 0 6px; min-width: 44px; text-align: center; cursor: pointer; }

        .prop-bar { position: absolute; bottom: 96px; left: 10px; right: 10px; max-width: 480px; background: rgba(24,29,40,0.97); border: 1px solid #3b82f6; border-radius: 12px; padding: 8px 12px; display: none; align-items: center; justify-content: space-between; gap: 8px; z-index: 75; box-shadow: 0 10px 25px rgba(0,0,0,0.75); }
        .prop-bar.open { display: flex; flex-wrap: wrap; }

        .fault-toast { position: absolute; top: 48px; left: 8px; max-width: 380px; background: rgba(127,29,29,0.96); border: 1px solid #ef4444; color: #fecaca; padding: 10px 14px; border-radius: 10px; font-size: 0.78rem; line-height: 1.55; z-index: 90; display: none; }
        .bottom-dock { position: absolute; bottom: 46px; left: 10px; right: 10px; max-width: 780px; height: 270px; background: rgba(19,23,32,0.98); border: 1px solid var(--panel-border); border-radius: 14px; z-index: 85; display: none; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.75); overflow: hidden; }
        .bottom-dock.open { display: flex; }
        .dock-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #171c26; border-bottom: 1px solid var(--panel-border); font-size: 0.81rem; font-weight: 800; }
        .dock-content { flex: 1; padding: 12px; overflow-y: auto; font-size: 0.81rem; }

        .bottom-bar { height: 44px; background: var(--panel-bg); border-top: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; gap: 6px; overflow-x: auto; z-index: 95; }
        .dock-trigger { background: #1a202c; border: 1px solid #2d3748; color: #d1d5db; padding: 5px 10px; border-radius: 7px; font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .dock-trigger.active { background: rgba(16,185,129,0.16); border-color: var(--accent); color: var(--accent); }
        .ladder-rung { background: #0c0e12; border: 1px solid #252c38; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-family: monospace; direction: ltr; text-align: left; font-size: 0.78rem; }
        .rung-live { border-color: #10b981; box-shadow: inset 3px 0 0 #10b981; }
        .rung-title { color: #9ca3af; font-size: 0.71rem; margin-bottom: 4px; }
        .rung-wire { color: #64748b; font-weight: bold; }
        .rung-live .rung-wire { color: #10b981; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-group">
            <button class="t-btn" id="btnToggleSidebar" onclick="toggleSidebar()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                <span>العناصر (81)</span>
            </button>
            <button class="back-voltai-btn" onclick="goBackToVoltAI()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>VoltAI Pro</span>
            </button>
        </div>

        <div class="sim-controls">
            <button class="t-btn" id="btnRunSim" onclick="toggleSimulation()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>تشغيل</span>
            </button>
            <button class="t-btn" onclick="stopSimulation()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                <span>إيقاف</span>
            </button>
            <button class="t-btn" onclick="undoAction()" title="تراجع Undo">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
            </button>
            <button class="t-btn" id="btnLockCanvas" onclick="toggleLockNodes()" title="قفل تحريك العناصر">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </button>
            <button class="t-btn" onclick="runFaultDiagnostics()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>فحص</span>
            </button>
            <button class="t-btn ai-magic" onclick="openDock('ai')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
                <span>الذكاء الاصطناعي</span>
            </button>
            <button class="t-btn" onclick="clearWorkspace()" title="مسح اللوحة">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
        </div>
    </header>

    <div class="studio-body">
        <aside class="comp-sidebar" id="compSidebar">
            <div class="search-wrap">
                <div class="search-input-box">
                    <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="compSearch" placeholder="ابحث (PLC، حساس PT100، أردوينو...)" onkeyup="filterPalette()">
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">
                    <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="cat-scroll" id="paletteContainer"></div>
        </aside>

        <main class="canvas-area" id="canvasArea" onclick="handleCanvasBgClick()">
            <div id="workspaceStage">
                <svg id="wiresSvg"></svg>
            </div>

            <div class="floating-wire-bar" onclick="event.stopPropagation()">
                <span style="font-size:0.71rem;color:#9ca3af;font-weight:700;">السلك:</span>
                <div class="w-color-dot active" style="background:#ef4444;" onclick="setWireColor('#ef4444', this)"></div>
                <div class="w-color-dot" style="background:#eab308;" onclick="setWireColor('#eab308', this)"></div>
                <div class="w-color-dot" style="background:#3b82f6;" onclick="setWireColor('#3b82f6', this)"></div>
                <div class="w-color-dot" style="background:#38bdf8;" onclick="setWireColor('#38bdf8', this)"></div>
                <div class="w-color-dot" style="background:#10b981;" onclick="setWireColor('#10b981', this)"></div>
                <button class="z-btn" style="width:26px;height:24px;margin-right:4px;" onclick="document.body.classList.toggle('light-blueprint')" title="تبديل خلفية اللوحة">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
                </button>
                <span id="wiringHint" style="font-size:0.71rem;color:#f59e0b;"></span>
            </div>

            <div class="zoom-controls" onclick="event.stopPropagation()">
                <button class="z-btn" onclick="changeZoom(-0.15)" title="تصغير">−</button>
                <span class="z-pct" id="zoomPctLabel" onclick="resetZoom()">100%</span>
                <button class="z-btn" onclick="changeZoom(0.15)" title="تكبير">+</button>
                <button class="z-btn" onclick="fitToScreen()" title="ملاءمة للشاشة">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </button>
            </div>

            <div class="prop-bar" id="propBar" onclick="event.stopPropagation()">
                <div style="display:flex;align-items:center;gap:6px;">
                    <span class="yellow-tag" id="propTagBadge">-KF1</span>
                    <span id="propTitle" style="font-size:0.74rem;font-weight:700;color:#e2e8f0;">خصائص</span>
                </div>
                <div id="propDynamicCtrl" style="display:flex;align-items:center;gap:6px;"></div>
                <div style="display:flex;align-items:center;gap:5px;">
                    <button class="t-btn" style="height:28px;padding:0 8px;" onclick="renameSelectedNode()">تسمية</button>
                    <button class="t-btn" style="height:28px;padding:0 8px;color:#f87171;border-color:#7f1d1d;" onclick="deleteSelectedNode()">حذف</button>
                </div>
            </div>

            <div class="fault-toast" id="faultToast" onclick="event.stopPropagation()"></div>

            <div class="bottom-dock" id="bottomDock" onclick="event.stopPropagation()">
                <div class="dock-header">
                    <span id="dockTitle">المساعد الهندسي الذكي</span>
                    <button onclick="closeDock()" style="background:none;border:none;color:#9ca3af;cursor:pointer;padding:2px 6px;display:flex;align-items:center;">
                        <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="dock-content" id="dockBody"></div>
            </div>
        </main>
    </div>

    <footer class="bottom-bar">
        <div style="display:flex;gap:6px;">
            <button class="dock-trigger" id="trig-ai" onclick="openDock('ai')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
                <span>الذكاء الاصطناعي</span>
            </button>
            <button class="dock-trigger" id="trig-process" onclick="openDock('process')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                <span>خزان المياه ومحطة الصرف</span>
            </button>
            <button class="dock-trigger" id="trig-plc" onclick="openDock('plc')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="15" x2="17" y2="15"/></svg>
                <span>محرر PLC Ladder</span>
            </button>
            <button class="dock-trigger" id="trig-arduino" onclick="openDock('arduino')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>
                <span>برمجة الأردوينو (C++)</span>
            </button>
        </div>
        <div id="simStatusText" style="font-size:0.74rem;color:#9ca3af;white-space:nowrap;">81 عنصر صناعي واقعي + تكبير وتصغير</div>
    </footer>

    <script>
        function renderSimurelayPLC(n, titleText, widthPx) {
            const w = widthPx || 152;
            const q0 = n && n.q0;
            const q1 = n && n.q1;
            const tag = (n && n.tag) || '-KF1';
            const lvl = typeof tankLevel !== 'undefined' ? Math.round(tankLevel) : 49;
            return `
            <div class="hw-wrap">
                <svg width="${w}" height="114" viewBox="0 0 156 118">
                    <rect x="26" y="110" width="16" height="7" rx="1.5" fill="#ea580c"/>

        function applyStageTransform() {
            const stage = document.getElementById('workspaceStage');
            if (stage) stage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
            const lbl = document.getElementById('zoomPctLabel');
            if (lbl) lbl.textContent = Math.round(zoomScale * 100) + '%';
        }

        function changeZoom(delta, centerX, centerY) {
            const oldScale = zoomScale;
            const newScale = Math.min(2.4, Math.max(0.4, +(oldScale + delta).toFixed(2)));
            if (newScale === oldScale) return;
            const area = document.getElementById('canvasArea');
            const cx = centerX !== undefined ? centerX : (area.clientWidth || 360) / 2;
            const cy = centerY !== undefined ? centerY : (area.clientHeight || 500) / 2;
            panX = cx - ((cx - panX) / oldScale) * newScale;
            panY = cy - ((cy - panY) / oldScale) * newScale;
            zoomScale = newScale;
            applyStageTransform();
        }

            zoomScale = Math.min(1.35, Math.max(0.45, Math.min(aw / bw, ah / bh)));
            panX = (aw - bw * zoomScale) / 2 - (minX - 30) * zoomScale;
            panY = (ah - bh * zoomScale) / 2 - (minY - 50) * zoomScale;
            applyStageTransform();

                changeZoom(e.deltaY < 0 ? 0.1 : -0.1, e.clientX - r.left, e.clientY - r.top);

                if (e.target.closest('.sim-node, .floating-wire-bar, .zoom-controls, .prop-bar, .bottom-dock')) return;

            area.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) { isPanning = false; lastPinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
            }, { passive: true });
            area.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    if (lastPinch > 0) {
                        const r = area.getBoundingClientRect();
                        changeZoom((d - lastPinch) * 0.0045, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top);
                    }
                    lastPinch = d;
                }
            }, { passive: false });
        }

        function saveHistory() { historyStack.push(JSON.stringify({ nodes, wires })); if (historyStack.length > 25) historyStack.shift(); }
        function undoAction() { if (!historyStack.length) return; const p = JSON.parse(historyStack.pop()); nodes = p.nodes || []; wires = p.wires || []; closePropBar(); renderAllNodes(); }
        function toggleLockNodes() { nodesLocked = !nodesLocked; document.getElementById('btnLockCanvas').classList.toggle('lock-active', nodesLocked); }
        function goBackToVoltAI() { if (window.history.length > 1) window.history.back(); else alert('أنت الآن في تطبيق المحاكي المستقل VoltAI Studio Pro.'); }

        function buildPalette() {
            const c = document.getElementById('paletteContainer');
            if (!c) return;
            c.innerHTML = '';
            CATEGORIES.forEach((cat, idx) => {
                const grp = document.createElement('div');
                grp.className = 'cat-group';
                grp.innerHTML = `<div class="cat-header" onclick="this.nextElementSibling.classList.toggle('closed')"><span><span class="cat-dot" style="background:${cat.color};"></span>${cat.name}</span><span style="color:#9ca3af;font-size:0.74rem;">${cat.items.length}</span></div><div class="cat-items ${idx > 3 ? 'closed' : ''}">${cat.items.map(it => `<div class="palette-item" data-label="${it.label}" onclick="spawnFromPalette('${it.type}')"><div class="palette-thumb">${it.render({ id: 'prev' })}</div><span>${it.label}</span></div>`).join('')}</div>`;
                c.appendChild(grp);
            });
        }

        function spawnFromPalette(type) { saveHistory(); spawnComponent(type); if (window.innerWidth <= 768) document.getElementById('compSidebar').classList.add('collapsed'); }
        function filterPalette() {
            const q = document.getElementById('compSearch').value.trim().toLowerCase();
            document.querySelectorAll('.cat-items').forEach(l => { if (q) l.classList.remove('closed'); });
            document.querySelectorAll('.palette-item').forEach(el => { el.style.display = el.getAttribute('data-label').toLowerCase().includes(q) ? 'flex' : 'none'; });
        }
        function toggleSidebar() { document.getElementById('compSidebar').classList.toggle('collapsed'); }
        function setWireColor(hex, dot) { currentWireColor = hex; document.querySelectorAll('.w-color-dot').forEach(d => d.classList.remove('active')); if (dot) dot.classList.add('active'); }
        function getCompDef(type) { for (const c of CATEGORIES) { const f = c.items.find(i => i.type === type); if (f) return f; } return null; }

        function spawnComponent(type, customX, customY, customTag) {
            const def = getCompDef(type);
            if (!def) return null;
            nodeSeq++;
            const id = 'node_' + nodeSeq;
            const x = customX !== undefined ? customX : Math.round((60 - panX) / zoomScale + (nodeSeq % 4) * 32);
            const y = customY !== undefined ? customY : Math.round((70 - panY) / zoomScale + (nodeSeq % 4) * 32);
            const node = { id, type, x, y, tag: customTag || ('-' + type.split('_')[0] + nodeSeq), pressed: false, swState: false, selPos: 0, analogVal: 50, timerSec: 5.0, timerDone: false, energized: false, running: false, tripped: false, sdMode: '3~ MOT', reading: '0.00 A', voltVal: '398 V', ampVal: '0.0 A', q0: false, q1: false, d7: false, servoOn: false, lcdText: 'VoltAI Ready' };
            nodes.push(node);
            renderAllNodes();
            return node;
        }

        function renderAllNodes() {
            const stage = document.getElementById('workspaceStage');
            stage.querySelectorAll('.sim-node').forEach(el => el.remove());
            nodes.forEach(node => {
                const def = getCompDef(node.type);
                if (!def) return;
                const el = document.createElement('div');
                el.className = 'sim-node' + (selectedNodeId === node.id ? ' selected-node' : '');
                el.id = node.id; el.style.left = node.x + 'px'; el.style.top = node.y + 'px';
                const portsHtml = def.ports.map(p => `<div class="term-port" style="left:${p.x}px;top:${p.y}px;" onclick="handlePortClick(event, '${node.id}', '${p.id}')"><span class="term-lbl" style="${p.y < 40 ? 'top:-13px;' : 'bottom:-13px;'}">${p.id}</span></div>`).join('');
                el.innerHTML = `<div style="position:relative;">${def.render(node)}${portsHtml}</div>`;
                enableDragAndSelect(el, node);
                stage.appendChild(el);
            });
            drawWires();
        }

        function enableDragAndSelect(el, node) {
            let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
            el.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                selectNode(node.id);
                if (nodesLocked || e.target.closest('.term-port, .push-actuator, .toggle-pill') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                dragging = true; sx = e.clientX; sy = e.clientY; ox = node.x; oy = node.y;
                try { el.setPointerCapture(e.pointerId); } catch (err) {}
            });
            el.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                node.x = Math.max(10, ox + (e.clientX - sx) / zoomScale);
                node.y = Math.max(20, oy + (e.clientY - sy) / zoomScale);
                el.style.left = node.x + 'px'; el.style.top = node.y + 'px';
                drawWires();
            });
            el.addEventListener('pointerup', (e) => { if (dragging) { dragging = false; try { el.releasePointerCapture(e.pointerId); } catch (err) {} } });
        }

        function selectNode(nodeId) {
            selectedNodeId = nodeId;
            const node = nodes.find(n => n.id === nodeId);
            const bar = document.getElementById('propBar');
            if (!node || !bar) return;
            const def = getCompDef(node.type);
            document.getElementById('propTagBadge').textContent = node.tag;
            document.getElementById('propTitle').textContent = def ? def.label : node.type;
            const dyn = document.getElementById('propDynamicCtrl');
            dyn.innerHTML = '';
            if (['TX_TEMP', 'TX_LEVEL_420', 'TX_PRESSURE', 'TX_FLOW', 'POT_CTRL'].includes(node.type)) {
                const isTemp = node.type === 'TX_TEMP';
                const minV = isTemp ? -50 : 0, maxV = isTemp ? 250 : 100, unit = isTemp ? '°C' : '%';
                const sigTxt = isTemp ? (((node.analogVal + 50) / 300) * 5).toFixed(2) + ' V' : (4 + (node.analogVal / 100) * 16).toFixed(2) + ' mA';
                dyn.innerHTML = `<input type="range" min="${minV}" max="${maxV}" value="${node.analogVal}" style="width:95px;" oninput="updateSelectedAnalog('${node.id}', this.value, '${unit}')"><span id="propValReadout" style="font-size:0.73rem;font-weight:800;color:#38bdf8;">${node.analogVal}${unit} (${sigTxt})</span>`;
            }
            bar.classList.add('open');
            document.querySelectorAll('.sim-node').forEach(el => el.classList.toggle('selected-node', el.id === nodeId));
        }

        function updateSelectedAnalog(nodeId, val, unit) {
            const n = nodes.find(x => x.id === nodeId);
            if (!n) return;
            n.analogVal = parseInt(val, 10) || 0;
            tankLevel = Math.min(100, Math.max(0, n.analogVal));
            const isTemp = n.type === 'TX_TEMP';
            const sigTxt = isTemp ? (((n.analogVal + 50) / 300) * 5).toFixed(2) + ' V' : (4 + (n.analogVal / 100) * 16).toFixed(2) + ' mA';
            const r = document.getElementById('propValReadout');
            if (r) r.textContent = `${n.analogVal}${unit} (${sigTxt})`;
            if (isRunning) evaluateCircuitStep();
            renderAllNodes();
        }

        function renameSelectedNode() { const n = nodes.find(x => x.id === selectedNodeId); if (!n) return; const t = prompt('الرمز الجديد:', n.tag); if (t && t.trim()) { n.tag = t.trim(); selectNode(n.id); renderAllNodes(); } }
        function deleteSelectedNode() { if (!selectedNodeId) return; saveHistory(); nodes = nodes.filter(n => n.id !== selectedNodeId); wires = wires.filter(w => w.fromNode !== selectedNodeId && w.toNode !== selectedNodeId); closePropBar(); renderAllNodes(); }
        function closePropBar() { selectedNodeId = null; document.getElementById('propBar').classList.remove('open'); document.querySelectorAll('.sim-node.selected-node').forEach(el => el.classList.remove('selected-node')); }
        function handleCanvasBgClick() { cancelWiring(); closePropBar(); }

        function handlePortClick(ev, nodeId, portId) {
            ev.stopPropagation();
            if (!pendingPort) { pendingPort = { nodeId, portId }; ev.currentTarget.classList.add('active-pin'); document.getElementById('wiringHint').textContent = `اختر الطرف الثاني من [${portId}]...`; return; }
            if (pendingPort.nodeId === nodeId && pendingPort.portId === portId) { cancelWiring(); return; }
            saveHistory(); connectPorts(pendingPort.nodeId, pendingPort.portId, nodeId, portId, currentWireColor); cancelWiring();
        }

        function connectPorts(fromNode, fromPort, toNode, toPort, color) {
            const dup = wires.some(w => (w.fromNode === fromNode && w.fromPort === fromPort && w.toNode === toNode && w.toPort === toPort) || (w.fromNode === toNode && w.fromPort === toPort && w.toNode === fromNode && w.toPort === fromPort));
            if (!dup) { wires.push({ id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), fromNode, fromPort, toNode, toPort, color: color || '#ef4444', live: false, shorted: false }); drawWires(); }
        }

        function cancelWiring() { pendingPort = null; document.querySelectorAll('.term-port.active-pin').forEach(p => p.classList.remove('active-pin')); document.getElementById('wiringHint').textContent = ''; }
        function getPortXY(nodeId, portId) { const n = nodes.find(x => x.id === nodeId); if (!n) return null; const d = getCompDef(n.type); if (!d) return null; const p = d.ports.find(x => x.id === portId); return p ? { x: n.x + p.x, y: n.y + p.y } : null; }

        function drawWires() {
            const svg = document.getElementById('wiresSvg');
            if (!svg) return;
            svg.innerHTML = '';
            wires.forEach(w => {
                const p1 = getPortXY(w.fromNode, w.fromPort), p2 = getPortXY(w.toNode, w.toPort);
                if (!p1 || !p2) return;
                const midY = Math.round((p1.y + p2.y) / 2);
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`);
                path.setAttribute('stroke', w.color); path.setAttribute('stroke-width', '3.2');
                path.classList.add('wire-stroke');
                if (w.live) path.classList.add('wire-energized');
                if (w.shorted) path.classList.add('wire-shorted');
                path.onclick = (e) => { e.stopPropagation(); saveHistory(); wires = wires.filter(i => i.id !== w.id); drawWires(); };
                svg.appendChild(path);
                [p1, p2].forEach(pt => {
                    const f = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    f.setAttribute('cx', pt.x); f.setAttribute('cy', pt.y); f.setAttribute('r', '4.3');
                    f.setAttribute('fill', w.color); f.setAttribute('stroke', '#0f172a'); f.setAttribute('stroke-width', '1.2');
                    svg.appendChild(f);
                });
            });
        }

        function pressButton(id, s) { const n = nodes.find(x => x.id === id); if (!n) return; n.pressed = s; if (isRunning) evaluateCircuitStep(); renderAllNodes(); }
        function toggleSwitchState(id) { const n = nodes.find(x => x.id === id); if (!n) return; n.swState = !n.swState; if (isRunning) evaluateCircuitStep(); renderAllNodes(); }
        function cycleSelector(id, max) { const n = nodes.find(x => x.id === id); if (!n) return; n.selPos = ((n.selPos || 0) + 1) % max; if (isRunning) evaluateCircuitStep(); renderAllNodes(); }
        function setAnalogVal(id, v) { const n = nodes.find(x => x.id === id); if (!n) return; n.analogVal = parseInt(v, 10) || 0; tankLevel = n.analogVal; if (isRunning) evaluateCircuitStep(); }

        function toggleSimulation() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btnRunSim').classList.add('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: المحاكاة الحية تعمل (Online)';
            runFaultDiagnostics();
            simInterval = setInterval(evaluateCircuitStep, 250);
        }

        function stopSimulation() {
            isRunning = false; clearInterval(simInterval); plcAutoLatch = false;
            document.getElementById('btnRunSim').classList.remove('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: متوقف | 81 عنصر واقعي';
            document.getElementById('faultToast').style.display = 'none';
            nodes.forEach(n => { n.energized = false; n.running = false; n.tripped = false; n.timerSec = 5.0; n.timerDone = false; n.sdMode = '3~ MOT'; n.q0 = false; n.q1 = false; n.d7 = false; n.servoOn = false; n.reading = '0.00 A'; n.ampVal = '0.0 A'; });
            wires.forEach(w => { w.live = false; w.shorted = false; });
            renderAllNodes();
        }

        function runFaultDiagnostics() {
            const toast = document.getElementById('faultToast');
            let faults = [];
            const hot = ['L1', 'L2', 'L3', '1', '3', '5', 'L'], neu = ['N', 'N1', 'N2', 'GND', '0V'];
            wires.forEach(w => {
                w.shorted = false;
                if ((hot.includes(w.fromPort) && neu.includes(w.toPort)) || (neu.includes(w.fromPort) && hot.includes(w.toPort))) {
                    w.shorted = true;
                    faults.push('<strong>قصر كهربائي مباشر (Short Circuit):</strong> تم ربط فاز مع النيوترال/الأرضي!');
                }
            });
            nodes.filter(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type)).forEach(ard => {
                if (wires.some(w => (w.fromNode === ard.id && ['L1', 'L2', 'L3', '2', '4', '6'].includes(w.toPort)) || (w.toNode === ard.id && ['L1', 'L2', 'L3', '2', '4', '6'].includes(w.fromPort)))) {
                    faults.push(`<strong>خطر تلف المتحكم (${ard.tag}):</strong> جهد عالي موصول مباشرة بالأردوينو!`);
                }
            });
            if (faults.length) {
                nodes.filter(n => n.type.startsWith('MCB') || n.type === 'MPCB').forEach(b => b.tripped = true);
                toast.innerHTML = faults.join('<br>'); toast.style.display = 'block';
            } else toast.style.display = 'none';
            renderAllNodes();
        }

        function evaluateCircuitStep() {
            if (wires.some(w => w.shorted)) return;
            const startBtns = nodes.filter(n => n.type === 'BTN_START' || n.type === 'BTN_DUAL');
            const stopBtn = nodes.find(n => n.type === 'BTN_STOP'), eStop = nodes.find(n => n.type === 'E_STOP');
            const swOn = nodes.find(n => ['SW_0_1', 'FLOAT_SW', 'LIMIT_SW', 'PROX_PNP', 'THERMOSTAT'].includes(n.type));
            const isStopped = (stopBtn && stopBtn.pressed) || (eStop && eStop.swState);
            const triggerActive = startBtns.some(b => b.pressed) || (swOn && swOn.swState);

            const contactors = nodes.filter(n => n.type.startsWith('KM_') || n.type.startsWith('RELAY_2') || n.type.startsWith('RELAY_4'));
            contactors.forEach((km, idx) => {
                if (!wires.some(w => w.fromNode === km.id || w.toNode === km.id)) return;
                if (isStopped) km.energized = false;
                else if (startBtns.length > 1) { const pb = startBtns[idx] || startBtns[0]; if (pb && pb.pressed) { contactors.forEach(o => o.energized = false); km.energized = true; } }
                else if (triggerActive || (startBtns.length === 0 && !swOn && wires.length >= 2)) km.energized = true;
            });

            const anyKm = contactors.some(k => k.energized);
            nodes.filter(n => n.type === 'TIMER_RELAY').forEach(tm => {
                if (anyKm && !isStopped) { if (tm.timerSec > 0) { tm.timerSec = Math.max(0, tm.timerSec - 0.25); tm.timerDone = tm.timerSec === 0; } }
                else { tm.timerSec = 5.0; tm.timerDone = false; }
            });

            nodes.filter(n => n.type.startsWith('PLC_')).forEach(plc => {
                if (isStopped) plcAutoLatch = false;
                if (triggerActive || (startBtns.length === 0 && !swOn && wires.length > 0)) plcAutoLatch = true;
                plc.q0 = plcAutoLatch && tankLevel < 90;
                plc.q1 = plcAutoLatch && sewageLevel > 70;
                nodes.filter(n => n.type.startsWith('RELAY_2')).forEach(r => { if (wires.some(w => (w.fromNode === plc.id && w.toNode === r.id) || (w.toNode === plc.id && w.fromNode === r.id))) r.energized = plc.q0; });
            });

            nodes.filter(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type)).forEach(ard => {
                const s = nodes.find(x => ['TX_TEMP', 'TX_LEVEL_420', 'POT_CTRL'].includes(x.type));
                const v = s ? s.analogVal : tankLevel;
                ard.d7 = v < 85;
                nodes.filter(n => n.type === 'RELAY_5V').forEach(r => r.energized = ard.d7);
                nodes.filter(n => n.type === 'SERVO_MOTOR').forEach(sv => sv.servoOn = ard.d7);
                nodes.filter(n => n.type === 'LCD_I2C').forEach(l => l.lcdText = `Val:${v} ${ard.d7 ? 'ON' : 'OFF'}`);
            });

            const powerActive = anyKm || nodes.some(n => n.type === 'RELAY_5V' && n.energized) || nodes.some(n => n.type.startsWith('PLC_') && n.q0);
            const timerNode = nodes.find(n => n.type === 'TIMER_RELAY');
            nodes.filter(n => ['MOTOR_SD', 'MOTOR_PTC', 'MOTOR_DC24', 'VFD_400V', 'SOFT_STARTER'].includes(n.type)).forEach(m => {
                m.running = wires.some(w => w.fromNode === m.id || w.toNode === m.id) && powerActive;
                if (m.type === 'MOTOR_SD') m.sdMode = !m.running ? '3~ MOT' : (contactors.length === 2 && !timerNode ? (contactors[1].energized ? 'REV' : 'FWD') : (timerNode && timerNode.timerDone ? 'DELTA Δ' : 'STAR Y'));
            });
            nodes.filter(n => n.type === 'PUMP_1P').forEach(p => { p.running = wires.some(w => w.fromNode === p.id || w.toNode === p.id) && powerActive; if (p.running) tankLevel = Math.min(100, tankLevel + 1.5); });
            if (outletOpen && tankLevel > 5) tankLevel = Math.max(5, tankLevel - 0.6);
            activeSewagePumps = powerActive ? Math.min(4, Math.ceil(sewageLevel / 25)) : 0;

            nodes.filter(n => ['LAMP_GREEN', 'BUZZER', 'LED_220'].includes(n.type)).forEach(l => l.energized = wires.some(w => w.fromNode === l.id || w.toNode === l.id) && powerActive);
            nodes.filter(n => n.type === 'LAMP_RED').forEach(l => l.energized = wires.some(w => w.fromNode === l.id || w.toNode === l.id) && !powerActive);
            const anyMot = nodes.some(n => n.running);
            nodes.filter(n => n.type === 'MULTIMETER').forEach(mm => mm.reading = anyMot ? '20.12 A' : '0.00 A');
            nodes.filter(n => n.type === 'AMMETER').forEach(am => am.ampVal = anyMot ? '20.1 A' : '0.0 A');
            wires.forEach(w => w.live = powerActive || w.color === '#ef4444');
            renderAllNodes();
            if (activeDock === 'process') renderProcessTank();
            if (activeDock === 'plc') renderPlcLadder();
        }

        let activeDock = null;
        function openDock(tab) {
            activeDock = tab;
            document.getElementById('bottomDock').classList.add('open');
            document.querySelectorAll('.dock-trigger').forEach(b => b.classList.remove('active'));
            const t = document.getElementById('trig-' + tab); if (t) t.classList.add('active');
            if (tab === 'ai') renderAiBuilderDock();
            if (tab === 'process') renderProcessTank();
            if (tab === 'plc') renderPlcLadder();
            if (tab === 'arduino') renderArduinoIde();
        }
        function closeDock() { activeDock = null; document.getElementById('bottomDock').classList.remove('open'); document.querySelectorAll('.dock-trigger').forEach(b => b.classList.remove('active')); }

        function renderProcessTank() {
            document.getElementById('dockTitle').textContent = 'محاكاة خزان المياه ومحطة ضخ الصرف';
            const pumpOn = nodes.some(n => n.type === 'PUMP_1P' && n.running), lvl = Math.round(tankLevel), sLvl = Math.round(sewageLevel);
            document.getElementById('dockBody').innerHTML = `<div style="display:flex;gap:14px;flex-wrap:wrap;"><div style="flex:1;min-width:240px;background:#0c0e12;border:1px solid #252c38;border-radius:10px;padding:10px;display:flex;gap:12px;align-items:center;"><svg width="140" height="140" viewBox="0 0 240 190"><rect x="70" y="28" width="100" height="135" fill="#111827" stroke="#64748b" stroke-width="2"/><rect x="72" y="${161 - (lvl * 1.3)}" width="96" height="${lvl * 1.3}" fill="#0284c7"/><text x="120" y="95" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">${lvl} %</text></svg><div style="font-size:0.78rem;line-height:1.6;"><div style="font-weight:800;color:#38bdf8;">خزان المياه</div><div>المضخة P1: <strong>${pumpOn ? 'تعمل' : 'متوقفة'}</strong></div><div>مرسل LT1: <strong>${(4 + (lvl / 100) * 16).toFixed(2)} mA</strong></div><button class="t-btn" style="margin-top:8px;" onclick="outletOpen=!outletOpen;renderProcessTank();">صمام V1 (${outletOpen ? 'مفتوح' : 'مغلق'})</button></div></div><div style="flex:1;min-width:240px;background:#0c0e12;border:1px solid #252c38;border-radius:10px;padding:10px;"><div style="font-weight:800;color:#f59e0b;margin-bottom:8px;">محطة الصرف (${sLvl}%)</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;">${[1, 2, 3, 4].map(i => `<div style="background:#171c26;border:1px solid ${activeSewagePumps >= i ? '#10b981' : '#334155'};border-radius:8px;padding:6px;text-align:center;">P${i}<br><small>${activeSewagePumps >= i ? 'RUN' : 'STBY'}</small></div>`).join('')}</div><input type="range" min="10" max="100" value="${sLvl}" style="width:100%;" oninput="sewageLevel=parseInt(this.value,10);if(isRunning)evaluateCircuitStep();renderProcessTank();"></div></div>`;
        }

        function renderPlcLadder() {
            document.getElementById('dockTitle').textContent = 'محرر ومراقب PLC Ladder التفاعلي';
            const q0 = nodes.some(n => n.type.startsWith('PLC_') && n.q0), lvl = Math.round(tankLevel);
            document.getElementById('dockBody').innerHTML = `<div class="ladder-rung rung-live"><div class="rung-title">Network 1: Analog Scaling</div><div class="rung-wire">|---[ SCALE IN: IW64 (${Math.round((lvl / 100) * 27648)}) → OUT: MW10 (${lvl}%) ]---|</div></div><div class="ladder-rung ${plcAutoLatch ? 'rung-live' : ''}"><div class="rung-title">Network 2: Start / Stop Latch</div><div class="rung-wire">|---[ I0.0 Start ]---+---[ /I0.1 Stop ]---( M0.0 Auto )---|</div></div><div class="ladder-rung ${q0 ? 'rung-live' : ''}"><div class="rung-title">Network 3: Pump Output</div><div class="rung-wire">|---[ M0.0 Auto ]---[ MW10 &lt; 90 ]---------( Q0.0 Pump )---|</div></div>`;
        }

        function renderArduinoIde() {
            document.getElementById('dockTitle').textContent = 'بيئة برمجة الأردوينو (C++ Sketch)';
            document.getElementById('dockBody').innerHTML = `<textarea id="arduinoEditor" rows="7" style="width:100%;background:#0c0e12;color:#38bdf8;border:1px solid #252c38;border-radius:8px;padding:10px;font-family:monospace;direction:ltr;text-align:left;font-size:0.79rem;">${arduinoCode}</textarea><button class="t-btn run-active" style="margin-top:6px;" onclick="arduinoCode=document.getElementById('arduinoEditor').value;toggleSimulation();">رفع الكود وتشغيل المحاكاة</button>`;
        }

        function renderAiBuilderDock() {
            document.getElementById('dockTitle').textContent = 'المهندس الذكي لبناء الدوائر تلقائياً (AI Auto-Builder)';
            document.getElementById('dockBody').innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"><button class="t-btn" onclick="buildPresetCircuit('dol')">تشغيل مباشر DOL</button><button class="t-btn" onclick="buildPresetCircuit('star_delta')">نجمة / دلتا</button><button class="t-btn" onclick="buildPresetCircuit('rev_motor')">عكس حركة محرك</button><button class="t-btn" onclick="buildPresetCircuit('plc_tank')">MINI PLC + خزان</button><button class="t-btn" onclick="buildPresetCircuit('arduino_pt100')">Arduino Uno + حساس PT100</button></div><div style="display:flex;gap:8px;"><input type="text" id="aiCircuitPrompt" placeholder="اكتب فكرة المشروع (مثال: أردوينو وحساس PT100، MINI PLC، ستار دلتا)..." style="flex:1;background:#0c0e12;border:1px solid #2d3748;color:#fff;padding:9px 12px;border-radius:8px;"><button class="t-btn ai-magic" onclick="handleAiBuildPrompt()">ابنِ الدائرة</button></div><div id="aiGuideOutput" style="margin-top:10px;background:#0c0e12;border:1px solid #252c38;border-radius:8px;padding:10px;line-height:1.7;display:none;"></div>`;
        }

        function handleAiBuildPrompt() {
            const q = document.getElementById('aiCircuitPrompt').value.trim().toLowerCase();
            if (!q) return;
            if (q.includes('عكس') || q.includes('rev')) buildPresetCircuit('rev_motor');
            else if (q.includes('أردوينو') || q.includes('arduino') || q.includes('pt100') || q.includes('حرار')) buildPresetCircuit('arduino_pt100');
            else if (q.includes('plc') || q.includes('خزان') || q.includes('مضخ')) buildPresetCircuit('plc_tank');
            else if (q.includes('ستار') || q.includes('دلتا') || q.includes('star')) buildPresetCircuit('star_delta');
            else buildPresetCircuit('dol');
        }

        function buildPresetCircuit(key) {
            stopSimulation(); saveHistory(); nodes = []; wires = []; nodeSeq = 0; closePropBar();
            if (window.innerWidth <= 768) document.getElementById('compSidebar').classList.add('collapsed');
            const guideBox = document.getElementById('aiGuideOutput');
            let guideHtml = '';

            if (key === 'dol') {
                const sup = spawnComponent('SUPPLY_3P', 50, 55, '-G1'), mcb = spawnComponent('MCB_3P', 50, 165, '-Q1'), km = spawnComponent('KM_3P_38A', 50, 285, '-KM1'), mot = spawnComponent('MOTOR_SD', 60, 410, '-M1'), stopB = spawnComponent('BTN_STOP', 210, 175, '-S0'), startB = spawnComponent('BTN_START', 210, 290, '-S1');
                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444'); connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308'); connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6'); connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8');
                connectPorts(mcb.id, '2', km.id, 'L1', '#ef4444'); connectPorts(mcb.id, '4', km.id, 'L2', '#eab308'); connectPorts(mcb.id, '6', km.id, 'L3', '#3b82f6');
                connectPorts(km.id, 'T1', mot.id, 'U1', '#ef4444'); connectPorts(km.id, 'T2', mot.id, 'V1', '#eab308'); connectPorts(km.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(mcb.id, '2', stopB.id, '1', '#ef4444'); connectPorts(stopB.id, '2', startB.id, '3', '#ef4444'); connectPorts(startB.id, '4', km.id, 'A1', '#ef4444'); connectPorts(mcb.id, 'N2', km.id, 'A2', '#38bdf8');
                guideHtml = `<strong style="color:#10b981;">دائرة التشغيل المباشر (DOL):</strong> اضغط على الزر الأخضر <strong>-S1</strong> لتشغيل المحرك.`;
            } else if (key === 'star_delta') {
                const sup = spawnComponent('SUPPLY_3P', 45, 55, '-G1'), mcb = spawnComponent('MCB_3P', 45, 160, '-Q1'), km1 = spawnComponent('KM_3P_38A', 45, 275, '-KM1'), km3 = spawnComponent('KM_3P_38A', 180, 275, '-KM3'), km2 = spawnComponent('KM_3P_12A', 315, 275, '-KM2'), tm = spawnComponent('TIMER_RELAY', 325, 160, '-KT1'), s1 = spawnComponent('BTN_START', 195, 160, '-S1'), mot = spawnComponent('MOTOR_SD', 120, 405, '-M1');
                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444'); connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308'); connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6'); connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8');
                connectPorts(mcb.id, '2', km1.id, 'L1', '#ef4444'); connectPorts(mcb.id, '4', km1.id, 'L2', '#eab308'); connectPorts(mcb.id, '6', km1.id, 'L3', '#3b82f6');
                connectPorts(km1.id, 'T1', mot.id, 'U1', '#ef4444'); connectPorts(km1.id, 'T2', mot.id, 'V1', '#eab308'); connectPorts(km1.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(mcb.id, '2', s1.id, '3', '#ef4444'); connectPorts(s1.id, '4', km1.id, 'A1', '#ef4444'); connectPorts(s1.id, '4', tm.id, 'A1', '#f59e0b'); connectPorts(tm.id, '16', km2.id, 'A1', '#10b981'); connectPorts(tm.id, '28', km3.id, 'A1', '#3b82f6');
                guideHtml = `<strong style="color:#f59e0b;">دائرة ستار / دلتا:</strong> اضغط <strong>-S1</strong> للبدء بوضع <strong>STAR Y</strong> ثم التحول إلى <strong>DELTA Δ</strong>.`;
            } else if (key === 'rev_motor') {
                const sup = spawnComponent('SUPPLY_3P', 50, 55, '-G1'), mcb = spawnComponent('MCB_3P', 50, 160, '-Q1'), km1 = spawnComponent('KM_3P_38A', 50, 280, '-KM1'), km2 = spawnComponent('KM_3P_38A', 195, 280, '-KM2'), s1 = spawnComponent('BTN_START', 195, 160, '-S1'), s2 = spawnComponent('BTN_START', 320, 160, '-S2'), mot = spawnComponent('MOTOR_SD', 125, 405, '-M1');
                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444'); connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308'); connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6');
                connectPorts(mcb.id, '2', km1.id, 'L1', '#ef4444'); connectPorts(mcb.id, '4', km1.id, 'L2', '#eab308'); connectPorts(mcb.id, '6', km1.id, 'L3', '#3b82f6');
                connectPorts(km1.id, 'T1', mot.id, 'U1', '#ef4444'); connectPorts(km1.id, 'T2', mot.id, 'V1', '#eab308'); connectPorts(km1.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(s1.id, '4', km1.id, 'A1', '#10b981'); connectPorts(s2.id, '4', km2.id, 'A1', '#f59e0b');
                guideHtml = `<strong style="color:#38bdf8;">عكس حركة محرك 3 فاز:</strong> اضغط <strong>-S1</strong> لليمين أو <strong>-S2</strong> لليسار.`;
            } else if (key === 'plc_tank') {
                const s1 = spawnComponent('BTN_START', 35, 55, '-S1'), s0 = spawnComponent('BTN_STOP', 145, 55, '-S0'), lt = spawnComponent('TX_LEVEL_420', 260, 45, 'LT1'), plc = spawnComponent('PLC_14IO', 115, 200, '-KF1'), rly = spawnComponent('RELAY_2CO', 55, 360, '-K1'), pump = spawnComponent('PUMP_1P', 225, 360, '-P1');
                connectPorts(s1.id, '4', plc.id, 'I0.0', '#10b981'); connectPorts(s0.id, '2', plc.id, 'I0.1', '#ef4444'); connectPorts(lt.id, 'OUT', plc.id, 'IW64', '#06b6d4');
                connectPorts(plc.id, 'Q0.0', rly.id, 'A1', '#eab308'); connectPorts(plc.id, '0V', rly.id, 'A2', '#38bdf8'); connectPorts(rly.id, '14', pump.id, 'L', '#f59e0b'); connectPorts(plc.id, '0V', pump.id, 'N', '#38bdf8');
                guideHtml = `<strong style="color:#38bdf8;">منظومة MINI PLC (-KF1):</strong> اضغط <strong>-S1</strong> للتشغيل، أو المس الحساس <strong>LT1</strong> لضبط المنسوب.`;
            } else if (key === 'arduino_pt100') {
                const ard = spawnComponent('ARDUINO_UNO', 110, 55, 'A1'), tt1 = spawnComponent('TX_TEMP', 120, 195, 'TT1'), lcd = spawnComponent('LCD_I2C', 265, 65, 'LCD1'), rel = spawnComponent('RELAY_5V', 55, 345, 'K1'), srv = spawnComponent('SERVO_MOTOR', 225, 345, 'SRV1');
                connectPorts(ard.id, '5V', tt1.id, '24V', '#ef4444'); connectPorts(tt1.id, 'OUT', ard.id, 'A0', '#f59e0b'); connectPorts(ard.id, 'D7', rel.id, 'IN', '#eab308'); connectPorts(ard.id, 'D9', srv.id, 'PWM', '#a855f7'); connectPorts(ard.id, '5V', lcd.id, 'VCC', '#ef4444');
                selectNode(tt1.id);
                guideHtml = `<strong style="color:#38bdf8;">Arduino Uno (A1) + حساس حرارة PT100 (TT1):</strong> حرّك شريط الحرارة (-50°C إلى 250°C) في الأسفل لمشاهدة الفولتية (0-5.00V) واستجابة الريليه والسيرفو!`;
            }

            if (guideBox) { guideBox.innerHTML = guideHtml; guideBox.style.display = 'block'; }
            setTimeout(fitToScreen, 60);
            toggleSimulation();
        }

        function clearWorkspace() { stopSimulation(); saveHistory(); nodes = []; wires = []; nodeSeq = 0; closePropBar(); renderAllNodes(); }

        window.addEventListener('DOMContentLoaded', () => { buildPalette(); setupCanvasPanAndPinch(); openDock('ai'); });
    </script>
</body>
</html>
