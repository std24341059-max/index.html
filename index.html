        function updateLadderRung(idx, field, val) {
            if (!customLadderRungs[idx]) return;
            customLadderRungs[idx][field] = val;
            saveToLocalStorage();
            if (isRunning) evaluateCircuitStep();
        }
        function toggleLadderContact(idx, field) {
            if (!customLadderRungs[idx]) return;
            customLadderRungs[idx][field] = customLadderRungs[idx][field] === 'NC' ? 'NO' : 'NC';
            saveToLocalStorage();
            renderPlcLadder();
            if (isRunning) evaluateCircuitStep();
        }
        function addLadderRung() {
            const n = customLadderRungs.length + 1;
            customLadderRungs.push({ id: 'r' + Date.now(), title: `Network ${n}: Custom Logic`, in1: 'I0.0', type1: 'NO', in2: 'I0.1', type2: 'NC', coil: 'Q0.1', live: false });
            saveToLocalStorage();
            renderPlcLadder();
        }
        function removeLadderRung(idx) {
            customLadderRungs.splice(idx, 1);
            saveToLocalStorage();
            renderPlcLadder();
        }

            document.getElementById('dockBody').innerHTML = `<textarea id="arduinoCodeEditor" style="width:100%;height:175px;background:#090c10;color:#34d399;border:1px solid #2d3748;border-radius:8px;padding:9px;font-family:monospace;font-size:0.76rem;direction:ltr;text-align:left;" oninput="arduinoCode=this.value">${arduinoCode}</textarea><div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:0.73rem;color:#9ca3af;">غيّر الشرط (مثلاً val &lt; 60) وسيتم تطبيقه مباشرة أثناء المحاكاة!</span><button class="t-btn" style="background:#0284c7;border:none;color:#fff;" onclick="if(!isRunning)toggleSimulation();">رفع وتشغيل</button></div>`;
        }

        /* --- Bill of Materials + Cost Estimator ($ USD & IQD) --- */
        function renderBomReport() {
            document.getElementById('dockTitle').textContent = 'جدول الكميات وحاسبة التكلفة التقديرية (BOM & Cost)';
            const counts = {};
            nodes.forEach(n => { const d = getCompDef(n.type); const k = d ? d.label : n.type; if (!counts[k]) counts[k] = { qty: 0, unitPrice: UNIT_PRICES_USD[n.type] || 10 }; counts[k].qty++; });
            const entries = Object.entries(counts);
            let totalUsd = 0;
            const rows = entries.map(([name, info], i) => {
                const sub = info.qty * info.unitPrice;
                totalUsd += sub;
                return `<tr><td>${i + 1}</td><td>${name}</td><td>${info.qty}</td><td>$${info.unitPrice}</td><td>$${sub}</td></tr>`;
            }).join('');
            const totalWireLen = (wires.length * 1.5).toFixed(1);
            const wireCost = Math.round(wires.length * 1.5);
            totalUsd += wireCost;
            const totalIqd = (totalUsd * 1500).toLocaleString();

            document.getElementById('dockBody').innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
                    <div style="font-size:0.78rem;">
                        <span style="color:#10b981;font-weight:900;">التكلفة الكلية التقديرية: $${totalUsd} USD</span>
                        <span style="color:#facc15;font-weight:800;margin-right:8px;">(≈ ${totalIqd} دينار عراقي)</span>
                    </div>
                    <button class="t-btn" style="background:#10b981;color:#042f2e;border:none;" onclick="openPrintableReport()">عرض التقرير الهندسي والطباعة PDF</button>
                </div>
                <table class="bom-table">
                    <thead><tr><th>#</th><th>اسم العنصر الصناعي</th><th>الكمية</th><th>سعر الوحدة</th><th>المجموع</th></tr></thead>
                    <tbody>
                        ${rows || '<tr><td colspan="5" style="text-align:center;">لا توجد عناصر في اللوحة بعد.</td></tr>'}
                        ${wires.length ? `<tr><td>+</td><td>أسلاك توصيل نحاسية معزولة (طول تقديري ${totalWireLen} متر)</td><td>${wires.length} سلك</td><td>-</td><td>$${wireCost}</td></tr>` : ''}
                    </tbody>
                </table>`;
        }

        function openPrintableReport() {
            const counts = {};
            nodes.forEach(n => { const d = getCompDef(n.type); const k = d ? d.label : n.type; if (!counts[k]) counts[k] = { qty: 0, unitPrice: UNIT_PRICES_USD[n.type] || 10 }; counts[k].qty++; });
            let totalUsd = Math.round(wires.length * 1.5);
            const bomRows = Object.entries(counts).map(([name, info], i) => {
                const sub = info.qty * info.unitPrice;
                totalUsd += sub;
                return `<tr><td>${i + 1}</td><td>${name}</td><td>${info.qty}</td><td>$${sub}</td></tr>`;
            }).join('');
            const wireRows = wires.map((w, i) => {
                const n1 = nodes.find(x => x.id === w.fromNode), n2 = nodes.find(x => x.id === w.toNode);
                return `<tr><td>W${i + 1}</td><td>${n1 ? n1.tag : ''} [${w.fromPort}]</td><td>${n2 ? n2.tag : ''} [${w.toPort}]</td><td>${w.gauge || '1.5'} mm²</td></tr>`;
            }).join('');

            document.getElementById('printSheetContent').innerHTML = `
                <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;border-bottom:1px solid #cbd5e1;padding-bottom:10px;">
                    <strong style="color:#0f172a;">معاينة التقرير الهندسي وجدول التسعير</strong>
                    <div style="display:flex;gap:6px;">
                        <button onclick="window.print()" style="background:#2563eb;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;cursor:pointer;">طباعة / حفظ PDF</button>
                        <button onclick="document.getElementById('printModal').classList.remove('open')" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer;">إغلاق</button>
                    </div>
                </div>
                <h2 style="margin-bottom:4px;">VoltAI Studio Pro — التقرير الهندسي وجدول الكميات والتسعير</h2>
                <p style="color:#475569;font-size:0.85rem;margin-bottom:12px;">إجمالي التكلفة التقديرية: <b>$${totalUsd} USD</b> (ما يعادل <b>${(totalUsd * 1500).toLocaleString()} IQD</b>)</p>
                <h3>1. جدول الكميات والأسعار التقديرية (BOM)</h3>
                <table><thead><tr><th>#</th><th>العنصر</th><th>الكمية</th><th>الإجمالي</th></tr></thead><tbody>${bomRows || '<tr><td colspan="4">فارغ</td></tr>'}</tbody></table>
                <h3>2. جدول توصيل الأسلاك ومقاطعها (Wire Schedule)</h3>
                <table><thead><tr><th>رقم السلك</th><th>من الطرف</th><th>إلى الطرف</th><th>مقطع السلك</th></tr></thead><tbody>${wireRows || '<tr><td colspan="4">لا توجد أسلاك</td></tr>'}</tbody></table>`;
            document.getElementById('printModal').classList.add('open');
        }

        function clearWorkspace() {
            stopSimulation();
            nodes = []; wires = []; nodeSeq = 0;
            localStorage.removeItem(STORAGE_KEY);
            window.location.hash = '';
            closePropBar(); renderAllNodes();
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildPalette();
            setupCanvasPanAndPinch();
            if (!loadFromUrlOrStorage()) {
                buildPresetCircuit('plc');
            } else {
                setTimeout(fitToScreen, 60);
            }
            if (window.innerWidth <= 768) document.getElementById('compSidebar').classList.add('collapsed');
        });
    </script>
</body>
</html>
