<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="المهندس منتظر عون">
    <meta name="copyright" content="جميع الحقوق محفوظة لدى المهندس منتظر عون">
    <title>VoltAI Studio Pro | محاكي الكلاسيك كنترول والـ PLC والأردوينو (88 عنصر واقعي)</title>
    <!-- جميع الحقوق محفوظة لدى المهندس منتظر عون -->
    <style>
        :root {
            --bg-canvas: #0b0e14;
            --grid-dot: #232a36;
            --panel-bg: #121620;
            --panel-border: #242c3a;
            --accent: #10b981;
            --accent-blue: #3b82f6;
            --danger: #ef4444;
            --text-main: #f3f4f6;
        }
        body.light-blueprint {
            --bg-canvas: #dce3ec;
            --grid-dot: #b4c0ce;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-canvas); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .svg-ic { width: 15px; height: 15px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
        .ltr-isolate { direction: ltr !important; unicode-bidi: isolate !important; }

        /* Top Bar */
        .top-bar { min-height: 48px; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 5px 8px; gap: 5px; z-index: 100; }
        .brand-group, .sim-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        .back-voltai-btn { background: rgba(59,130,246,0.14); border: 1px solid rgba(59,130,246,0.45); color: #60a5fa; height: 32px; padding: 0 9px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; text-decoration: none; transition: 0.15s; }
        .back-voltai-btn:hover { background: rgba(59,130,246,0.28); color: #fff; }
        .t-btn { background: #19202c; border: 1px solid #2d3748; color: var(--text-main); height: 32px; padding: 0 8px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transition: 0.15s; }
        .t-btn:hover { border-color: var(--accent-blue); }
        .t-btn.run-active { background: var(--accent); color: #042f2e; border-color: var(--accent); }
        .t-btn.lock-active { background: #f59e0b; color: #1c1917; border-color: #f59e0b; }
        .t-btn.sound-on { border-color: #10b981; color: #34d399; }
        .t-btn.ai-magic { background: linear-gradient(135deg, #2563eb, #7c3aed); border: none; color: #fff; box-shadow: 0 0 14px rgba(124,58,237,0.4); }
        .t-btn.auto-wire-btn { background: linear-gradient(135deg, #059669, #0284c7); border: none; color: #fff; }
        .t-btn.hmi-btn { background: linear-gradient(135deg, #d97706, #b45309); border: none; color: #fff; }

        /* Main Body & Sidebar */
        .studio-body { flex: 1; display: flex; position: relative; overflow: hidden; }
        .comp-sidebar { width: 300px; background: rgba(18,22,32,0.99); border-left: 1px solid var(--panel-border); display: flex; flex-direction: column; z-index: 80; flex-shrink: 0; }
        .comp-sidebar.collapsed { display: none !important; }
        @media (max-width: 768px) { .comp-sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 85%; max-width: 315px; box-shadow: -12px 0 30px rgba(0,0,0,0.85); } }

        .search-wrap { padding: 8px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; gap: 6px; }
        .search-input-box { flex: 1; display: flex; align-items: center; background: #0b0e14; border: 1px solid #2d3748; border-radius: 8px; padding: 0 8px; color: #9ca3af; }
        .search-input-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 7px 6px; font-size: 0.78rem; outline: none; }
        .close-sidebar-btn { background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.45); color: #f87171; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cat-scroll { flex: 1; overflow-y: auto; padding: 6px; }
        .cat-group { margin-bottom: 6px; }
        .cat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #171c26; border-radius: 8px; font-size: 0.78rem; font-weight: 800; color: #e5e7eb; cursor: pointer; user-select: none; }
        .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 7px; }
        .cat-items { display: flex; flex-direction: column; gap: 4px; padding: 5px 2px; }
        .cat-items.closed { display: none; }
        .palette-item { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid transparent; cursor: pointer; font-size: 0.75rem; color: #d1d5db; }
        .palette-item:hover { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.45); color: #fff; }
        .palette-thumb { width: 48px; height: 40px; background: #0b0e14; border: 1px solid #262f3d; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 2px; direction: ltr; }
        .palette-thumb svg { width: 100%; height: 100%; object-fit: contain; }

        /* Workspace & DIN-Rails */
        .canvas-area { flex: 1; position: relative; background-color: var(--bg-canvas); background-image: radial-gradient(var(--grid-dot) 1.4px, transparent 1.4px); background-size: 22px 22px; overflow: hidden; touch-action: none; cursor: grab; }
        .canvas-area:active { cursor: grabbing; }
        body.light-blueprint .canvas-area { background-image: linear-gradient(to right, rgba(100,116,139,0.16) 1px, transparent 1px), linear-gradient(to bottom, rgba(100,116,139,0.16) 1px, transparent 1px); background-size: 20px 20px; }
        #workspaceStage { position: absolute; top: 0; left: 0; width: 2600px; height: 2600px; transform-origin: 0 0; will-change: transform; direction: ltr; }

        .din-rail-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .din-rail-layer.hidden { display: none; }
        .din-rail-bar {
            position: absolute; left: 20px; width: 2000px; height: 26px;
            background: linear-gradient(180deg, #64748b 0%, #cbd5e1 22%, #94a3b8 50%, #cbd5e1 78%, #475569 100%);
            border-top: 1.5px solid #e2e8f0; border-bottom: 1.5px solid #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
            display: flex; align-items: center;
        }
        .din-rail-bar::after {
            content: ''; width: 100%; height: 8px;
            background: repeating-linear-gradient(90deg, transparent 0 18px, #334155 18px 34px);
            opacity: 0.65;
        }

        #wiresSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        .wire-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; cursor: pointer; transition: stroke-width 0.15s; }
        .wire-stroke:hover { stroke-width: 6 !important; }
        .wire-selected { stroke-dasharray: 4 3; filter: drop-shadow(0 0 6px #ffffff); stroke-width: 5.5 !important; }
        @keyframes currentFlow { to { stroke-dashoffset: -20; } }
        .wire-energized { stroke-dasharray: 7 3; animation: currentFlow 0.45s linear infinite; filter: drop-shadow(0 0 4px currentColor); }
        @keyframes faultBlink { 0%, 100% { stroke: #ef4444; stroke-width: 5; } 50% { stroke: #fde047; stroke-width: 7; } }
        .wire-shorted { animation: faultBlink 0.35s infinite; }
        @keyframes wireOverheat { 0%, 100% { stroke: #f97316; stroke-width: 4.5; } 50% { stroke: #ef4444; stroke-width: 6.5; filter: drop-shadow(0 0 8px #ef4444); } }
        .wire-overheated { animation: wireOverheat 0.45s infinite; }

        /* Visual Faults: Sparks & Smoke */
        @keyframes nodeShake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px, 2px); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, -2px); } }
        @keyframes smokeRise { 0% { opacity: 0.9; transform: translateY(0) scale(0.7); } 100% { opacity: 0; transform: translateY(-38px) scale(1.8); } }
        .node-damaged { animation: nodeShake 0.25s infinite; }
        .node-damaged .hw-wrap { filter: drop-shadow(0 0 14px #ef4444) brightness(0.85); }
        .fault-fx { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 60; font-size: 1.3rem; animation: smokeRise 1.1s ease-out infinite; }

        /* Nodes & Realistic Slotted Brass Terminals */
        .sim-node { position: absolute; z-index: 20; user-select: none; touch-action: none; direction: ltr; transform-origin: center center; }
        .sim-node.selected-node .hw-wrap { filter: drop-shadow(0 0 9px rgba(59,130,246,0.98)); }
        .hw-wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.68)); direction: ltr; }
        .yellow-tag { background: #facc15; color: #18181b; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 2px; border: 1px solid #ca8a04; letter-spacing: 0.3px; direction: ltr !important; unicode-bidi: isolate !important; display: inline-block; }

        .term-port {
            position: absolute; width: 12px; height: 12px; transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fef08a, #eab308 55%, #713f12 100%);
            border: 1.2px solid #271603;
            box-shadow: 0 0 0 1.2px rgba(15,23,42,0.85), inset 0 1px 1px rgba(255,255,255,0.65);
            cursor: crosshair; z-index: 40; display: flex; align-items: center; justify-content: center;
        }
        .term-port::after { content: ''; width: 6.5px; height: 1.4px; background: #422006; transform: rotate(-32deg); }
        .term-port:hover, .term-port.active-pin { background: #38bdf8; box-shadow: 0 0 11px #38bdf8; transform: translate(-50%, -50%) scale(1.45); }
        .term-lbl { position: absolute; font-size: 0.48rem; font-weight: 800; color: #f8fafc; background: rgba(11,14,20,0.9); padding: 0 2.5px; border-radius: 2px; pointer-events: none; white-space: nowrap; direction: ltr; letter-spacing: 0.2px; }

        /* Interactive Actuators & Rotors */
        .push-hit { cursor: pointer; touch-action: none; }
        .breaker-hit { cursor: pointer; }
        .toggle-pill { background: linear-gradient(180deg, #334155, #0f172a); border: 1px solid #64748b; color: #38bdf8; font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; cursor: pointer; direction: ltr; }
        @keyframes spinRotor { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .rotor-spinning { animation: spinRotor var(--spin-dur, 0.5s) linear infinite; }
        .rotor-spinning-rev { animation: spinRotor var(--spin-dur, 0.5s) linear infinite reverse; }

        /* Floating Wire & Gauge Bar */
        .floating-wire-bar { position: absolute; top: 8px; left: 8px; background: rgba(18,22,32,0.96); border: 1px solid var(--panel-border); padding: 5px 8px; border-radius: 10px; display: flex; align-items: center; gap: 5px; z-index: 70; flex-wrap: wrap; max-width: calc(100% - 16px); box-shadow: 0 6px 16px rgba(0,0,0,0.55); }
        .w-color-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .w-color-dot.active { border-color: #fff; transform: scale(1.16); }
        .gauge-select { background: #0b0e14; color: #facc15; border: 1px solid #334155; border-radius: 6px; padding: 2px 5px; font-size: 0.7rem; font-weight: 800; outline: none; direction: ltr; }

        .probe-badge { position: absolute; top: 52px; right: 10px; background: rgba(15,23,42,0.97); border: 1.5px solid #10b981; color: #ecfdf5; padding: 6px 11px; border-radius: 9px; font-size: 0.74rem; font-weight: 800; z-index: 78; display: none; box-shadow: 0 6px 18px rgba(0,0,0,0.65); cursor: pointer; }

        .zoom-controls { position: absolute; bottom: 52px; left: 10px; background: rgba(18,22,32,0.95); border: 1px solid var(--panel-border); border-radius: 10px; padding: 4px; display: flex; align-items: center; gap: 4px; z-index: 72; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
        .z-btn { background: #1e2532; border: 1px solid #334155; color: #f8fafc; width: 29px; height: 29px; border-radius: 7px; font-size: 0.85rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .z-pct { font-size: 0.71rem; font-weight: 800; color: #38bdf8; padding: 0 5px; min-width: 42px; text-align: center; cursor: pointer; }

        .prop-bar { position: absolute; bottom: 92px; left: 10px; right: 10px; max-width: 650px; background: rgba(22,27,38,0.98); border: 1px solid #3b82f6; border-radius: 12px; padding: 7px 10px; display: none; align-items: center; justify-content: space-between; gap: 6px; z-index: 75; box-shadow: 0 10px 25px rgba(0,0,0,0.75); }
        .prop-bar.open { display: flex; flex-wrap: wrap; }

        .fault-toast { position: absolute; top: 52px; left: 8px; max-width: 390px; background: rgba(127,29,29,0.97); border: 1px solid #ef4444; color: #fecaca; padding: 9px 13px; border-radius: 10px; font-size: 0.77rem; line-height: 1.5; z-index: 90; display: none; }
        .bottom-dock { position: absolute; bottom: 46px; left: 10px; right: 10px; max-width: 860px; height: 335px; background: rgba(18,22,32,0.98); border: 1px solid var(--panel-border); border-radius: 14px; z-index: 85; display: none; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.75); overflow: hidden; }
        .bottom-dock.open { display: flex; }
        .dock-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #171c26; border-bottom: 1px solid var(--panel-border); font-size: 0.8rem; font-weight: 800; }
        .dock-content { flex: 1; padding: 11px; overflow-y: auto; font-size: 0.8rem; }

        .bottom-bar { height: 46px; background: var(--panel-bg); border-top: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 8px; overflow-x: auto; z-index: 95; }
        .dock-trigger { background: #19202c; border: 1px solid #2d3748; color: #d1d5db; padding: 5px 9px; border-radius: 7px; font-size: 0.74rem; font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .dock-trigger.active { background: rgba(16,185,129,0.16); border-color: var(--accent); color: var(--accent); }
        .copyright-badge { font-size: 0.73rem; font-weight: 800; color: #facc15; background: rgba(250, 204, 21, 0.1); border: 1px solid rgba(250, 204, 21, 0.35); padding: 4px 10px; border-radius: 7px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }

        .ladder-rung { background: #0b0e14; border: 1px solid #242c3a; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-family: monospace; direction: ltr; text-align: left; font-size: 0.77rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .rung-live { border-color: #10b981; box-shadow: inset 3px 0 0 #10b981; }
        .rung-title { color: #9ca3af; font-size: 0.7rem; margin-bottom: 3px; }
        .rung-wire { color: #64748b; font-weight: bold; }
        .rung-live .rung-wire { color: #10b981; }
        .bom-table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
        .bom-table th, .bom-table td { border: 1px solid #263042; padding: 6px 8px; text-align: right; }
        .bom-table th { background: #171c26; color: #38bdf8; }
        .ai-msg-box { background: #0b0e14; border: 1px solid #263042; border-radius: 8px; padding: 9px 11px; margin-top: 8px; line-height: 1.65; font-size: 0.78rem; }
        .challenge-card { background: #0b0e14; border: 1px solid #2d3748; border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

        /* HMI Panel Door Overlay */
        .hmi-modal { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.92); z-index: 190; display: none; align-items: center; justify-content: center; padding: 14px; }
        .hmi-modal.open { display: flex; }
        .hmi-cabinet { background: linear-gradient(145deg, #475569, #334155); border: 4px solid #64748b; border-radius: 14px; width: 100%; max-width: 660px; max-height: 88vh; overflow-y: auto; padding: 18px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 25px 50px rgba(0,0,0,0.85); color: #f8fafc; }
        .hmi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; margin-top: 14px; background: #1e293b; border: 2px solid #0f172a; border-radius: 10px; padding: 14px; }
        .hmi-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }

        /* In-App Print Modal */
        .print-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; padding: 15px; }
        .print-modal.open { display: flex; }
        .print-sheet { background: #fff; color: #0f172a; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; border-radius: 12px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .print-sheet table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: 0.82rem; }
        .print-sheet th, .print-sheet td { border: 1px solid #cbd5e1; padding: 7px 10px; text-align: right; }
        .print-sheet th { background: #f1f5f9; }
        @media print {
            body > *:not(.print-modal) { display: none !important; }
            .print-modal { position: static; background: #fff; padding: 0; }
            .print-sheet { box-shadow: none; max-height: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>

    <script>
        /* =========================================================
           0. INDUSTRIAL WEB AUDIO SOUND SYNTHESIZER, HELPERS & COST DB
           جميع الحقوق محفوظة لدى المهندس منتظر عون
           ========================================================= */
        let soundEnabled = true;
        let audioCtx = null;
        let buzzerTick = 0;

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const WIRE_AMPACITY = { '1.5': 16, '2.5': 25, '4.0': 32, '6.0': 40, '10.0': 63 };

        const UNIT_PRICES_USD = {
            SUPPLY_3P: 15, CAT_GENSET: 3500, ATS_EOQ3: 110, ATS_GRID: 25, ATS_GEN: 45,
            DIST_1P_13: 8, DIST_4P_28: 18, DIST_4P_48: 26,
            BUS_H_6: 4, BUS_H_12: 6, BUS_H_18: 8, BUS_V_6: 4, BUS_V_12: 6, BUS_V_18: 8, SOCKET_16A: 5,
            MCB_3P: 22, MCB_1P: 6, MPCB: 34, KM_3P_12A: 18, KM_3P_38A: 28, KM_3P_95A: 65, KM_4P_40A: 38,
            AUX_2: 7, AUX_4: 12, KM_TIMER: 20, AUX_MCB: 8, RELAY_2CO: 8, RELAY_4CO: 11, TIMER_RELAY: 19,
            STAIR_TIMER: 14, IMPULSE_1NO: 12, IMPULSE_2NO: 15, PHASE_RELAY: 24, PTC_RELAY: 28, SAFETY_RELAY: 75,
            OVERLOAD: 22, BTN_START: 4, BTN_STOP: 4, BTN_DUAL: 6, E_STOP: 9, SW_0_1: 6, SEL_1_0_2: 8,
            SEL_1_2_3: 9, POT_CTRL: 7, LAMP_GREEN: 3, LAMP_RED: 3, BUZZER: 5,
            MOTOR_TERMINAL_BOX: 15, MOTOR_SD: 140, MOTOR_PTC: 165, MOTOR_DC24: 45, VALVE_PUMP_UNIT: 240,
            TOWER_2: 18, TOWER_3: 24, SIREN: 16, HEATER_FAN: 25, VFD_400V: 185, SOFT_STARTER: 160,
            LIMIT_SW: 9, FLOAT_SW: 11, THERMOSTAT: 12, PROX_PNP: 14, PROX_NPN: 14, TX_LEVEL_420: 55,
            TX_PRESSURE: 48, TX_FLOW: 65, TX_TEMP: 42, VOLTMETER: 12, AMMETER: 15, SEL_VA: 10, FREQ_METER: 14,
            HOUR_METER: 11, KWH_METER: 32, MULTIMETER: 28,
            S7_1200_PLC: 240, PLC_8DI_4DO: 95, PLC_14IO: 135, PLC_24IO: 195, PUMP_1P: 85,
            ARDUINO_UNO: 12, ARDUINO_MEGA: 22, ESP32_BOARD: 10, RELAY_5V: 4, HCSR04: 3,
            DHT22: 5, SERVO_MOTOR: 6, LCD_I2C: 7, LED_220: 1
        };

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btnSoundToggle');
            btn.classList.toggle('sound-on', soundEnabled);
            btn.style.opacity = soundEnabled ? '1' : '0.45';
        }

        function playSoundEffect(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'clack') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(42, now + 0.06);
                    gain.gain.setValueAtTime(0.32, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.start(now); osc.stop(now + 0.07);
                } else if (type === 'trip') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
                    osc.start(now); osc.stop(now + 0.19);
                } else if (type === 'buzzer') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                }
            } catch (e) {}
        }

        /* =========================================================
           1. REALISTIC 2.5D SVG HARDWARE RENDERERS (88 COMPONENTS)
           ========================================================= */
        function svgBrassScrews(ports) {
            return (ports || []).map(p => `
                <g transform="translate(${p.x},${p.y})">
                    <rect x="-6.5" y="-6.5" width="13" height="13" rx="2.5" fill="#0b0e14" stroke="#334155" stroke-width="0.8"/>
                    <circle cx="0" cy="0" r="4.6" fill="url(#mat-brass)" stroke="#422006" stroke-width="0.7"/>
                    <path d="M-2.8 0 H2.8 M0 -2.8 V2.8" stroke="#422006" stroke-width="1"/>
                </g>`).join('');
        }

        function renderRealisticPushButton(n, gradId, defaultTag, ports) {
            const pressed = n && n.pressed;
            const tag = escapeHtml((n && n.tag) || defaultTag);
            return `
            <div class="hw-wrap ltr-isolate">
                <svg width="76" height="94" viewBox="0 0 76 94" filter="url(#real-shadow)">
                    <rect x="20" y="6" width="36" height="82" rx="4" fill="url(#mat-dark-body)" stroke="#475569" stroke-width="1.4"/>
                    <rect x="24" y="16" width="28" height="62" rx="2" fill="${gradId.includes('red') ? '#7f1d1d' : (gradId.includes('blue') ? '#0c4a6e' : '#14532d')}" opacity="0.8"/>
                    <circle cx="40" cy="48" r="24" fill="#1e293b"/>
                    <circle cx="37" cy="47" r="24" fill="url(#mat-chrome)" stroke="#475569" stroke-width="1.4"/>
                    <circle cx="37" cy="47" r="18.5" fill="#0f172a"/>
                    <circle class="push-hit" cx="${pressed ? 38 : 36}" cy="47" r="16.5" fill="url(#${gradId})" onpointerdown="pressButton(event, '${n.id}', true)"/>
                    <path d="M26 38 A12 12 0 0 1 44 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.65" pointer-events="none"/>
                    <rect x="21" y="71" width="34" height="10" rx="1.5" fill="#facc15" stroke="#ca8a04" stroke-width="0.7"/>
                    <text x="38" y="78" fill="#18181b" font-size="6" font-weight="900" text-anchor="middle">${tag}</text>
                    ${svgBrassScrews(ports)}
                </svg>
            </div>`;
        }

        function renderRealisticProximitySensor(n, typeLabel, ports) {

                    const encoded = hash.replace('#circuit=', '');
                    const d = JSON.parse(decodeUtf8Base64(encoded));
                    if (d && Array.isArray(d.nodes) && d.nodes.length > 0) {
                        nodes = d.nodes; wires = d.wires || []; nodeSeq = d.nodeSeq || nodes.length;
                        nodes.forEach(n => { n.pressed = false; n.damaged = false; });
                        renderAllNodes();
                        return true;
                    }
                }
            } catch (e) {}
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const d = JSON.parse(raw);
                if (d && Array.isArray(d.nodes) && d.nodes.length > 0) {
                    nodes = d.nodes; wires = d.wires || []; nodeSeq = d.nodeSeq || nodes.length;
                    tankLevel = d.tankLevel !== undefined ? d.tankLevel : 49;
                    sewageLevel = d.sewageLevel !== undefined ? d.sewageLevel : 58;
                    if (d.totalRunningHours !== undefined) totalRunningHours = d.totalRunningHours;
                    if (d.totalEnergyKwh !== undefined) totalEnergyKwh = d.totalEnergyKwh;
                    if (Array.isArray(d.customLadderRungs)) customLadderRungs = d.customLadderRungs;
                    nodes.forEach(n => { n.pressed = false; n.damaged = false; });
                    renderAllNodes();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function exportProjectJson() {
            const payload = {
                app: 'VoltAI Studio Pro',
                author: 'المهندس منتظر عون',
                exportedAt: new Date().toISOString(),
                nodes: nodes.map(({ id, type, x, y, rot, tag, swState, selPos, analogVal, timerMax, tripAmp, vfdHz, linkMode }) => ({ id, type, x, y, rot, tag, swState, selPos, analogVal, timerMax, tripAmp, vfdHz, linkMode })),
                wires,
                nodeSeq,
                customLadderRungs,
                arduinoCode
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `VoltAI_Circuit_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showProbeReading('تم تصدير ملف المشروع بنجاح!');
        }

        function importProjectJson(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const d = JSON.parse(e.target.result);
                    if (!d || !Array.isArray(d.nodes)) throw new Error('Invalid');
                    stopSimulation();
                    saveHistory();
                    nodes = d.nodes;
                    wires = d.wires || [];
                    nodeSeq = d.nodeSeq || nodes.length;
                    if (Array.isArray(d.customLadderRungs)) customLadderRungs = d.customLadderRungs;
                    if (typeof d.arduinoCode === 'string') arduinoCode = d.arduinoCode;
                    nodes.forEach(n => { n.pressed = false; n.damaged = false; });
                    renderAllNodes();
                    saveToLocalStorage();
                    fitToScreen();
                    showProbeReading('تم استيراد الدائرة بنجاح!');
                } catch (err) {
                    alert('ملف المشروع غير صالح.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function shareCircuitLink() {
            if (!nodes.length) { alert('ارسم دائرة أولاً لمشاركتها عبر الرابط.'); return; }
            try {
                const compact = { nodes: nodes.map(({ id, type, x, y, rot, tag, swState, selPos, analogVal, timerMax, tripAmp, vfdHz, linkMode }) => ({ id, type, x, y, rot, tag, swState, selPos, analogVal, timerMax, tripAmp, vfdHz, linkMode })), wires, nodeSeq };
                const b64 = encodeUtf8Base64(JSON.stringify(compact));
                const url = window.location.origin + window.location.pathname + '#circuit=' + b64;
                window.location.hash = 'circuit=' + b64;
                if (navigator.clipboard) navigator.clipboard.writeText(url);
                showProbeReading('تم نسخ رابط مشاركة الدائرة إلى الحافظة بنجاح!');
            } catch (e) { alert('تعذر إنشاء الرابط.'); }
        }

        function snapToDinRail(node) {
            const layer = document.getElementById('dinRailLayer');
            if (!layer || layer.classList.contains('hidden')) return;
            if (!DIN_MOUNT_PREFIXES.some(p => node.type.startsWith(p))) return;
            const midY = node.y + 38;
            for (const ry of RAIL_CENTERS_Y) {
                if (Math.abs(midY - ry) <= 24) {
                    node.y = ry - 38;
                    node.x = Math.round(node.x / 10) * 10;
                    break;
                }
            }
        }

        function applyStageTransform() {
            const stage = document.getElementById('workspaceStage');
            if (stage) stage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
            const lbl = document.getElementById('zoomPctLabel');
            if (lbl) lbl.textContent = Math.round(zoomScale * 100) + '%';
        }

        function changeZoom(delta, centerX, centerY) {
            const oldScale = zoomScale;
            const newScale = Math.min(2.4, Math.max(0.4, +(oldScale + delta).toFixed(2)));
            if (newScale === oldScale) return;
            const area = document.getElementById('canvasArea');
            const cx = centerX !== undefined ? centerX : (area.clientWidth || 360) / 2;
            const cy = centerY !== undefined ? centerY : (area.clientHeight || 500) / 2;
            panX = cx - ((cx - panX) / oldScale) * newScale;
            panY = cy - ((cy - panY) / oldScale) * newScale;
            zoomScale = newScale;
            applyStageTransform();
        }

        function resetZoom() { zoomScale = 1.0; panX = 0; panY = 0; applyStageTransform(); }

        function fitToScreen() {
            if (!nodes.length) { resetZoom(); return; }
            const area = document.getElementById('canvasArea');
            const aw = area.clientWidth || 360, ah = area.clientHeight || 500;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            nodes.forEach(n => {
                const def = getCompDef(n.type);
                const w = (def && def.w) || 120, h = (def && def.h) || 100;
                minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
                maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
            });
            const bw = Math.max(180, maxX - minX + 60), bh = Math.max(180, maxY - minY + 110);
            zoomScale = Math.min(1.3, Math.max(0.45, Math.min(aw / bw, ah / bh)));
            panX = (aw - bw * zoomScale) / 2 - (minX - 30) * zoomScale;
            panY = (ah - bh * zoomScale) / 2 - (minY - 50) * zoomScale;
            applyStageTransform();
        }

        function setupCanvasPanAndPinch() {
            const area = document.getElementById('canvasArea');
            let isPanning = false, sx = 0, sy = 0, ox = 0, oy = 0, lastPinch = 0;
            area.addEventListener('wheel', (e) => {
                e.preventDefault();
                const r = area.getBoundingClientRect();
                changeZoom(e.deltaY < 0 ? 0.1 : -0.1, e.clientX - r.left, e.clientY - r.top);
            }, { passive: false });
            area.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.sim-node, .floating-wire-bar, .zoom-controls, .prop-bar, .bottom-dock')) return;
                isPanning = true; sx = e.clientX; sy = e.clientY; ox = panX; oy = panY;
            });
            window.addEventListener('pointermove', (e) => { if (isPanning) { panX = ox + (e.clientX - sx); panY = oy + (e.clientY - sy); applyStageTransform(); } });
            window.addEventListener('pointerup', () => { isPanning = false; });
            area.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) { isPanning = false; lastPinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
            }, { passive: true });
            area.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    if (lastPinch > 0) {
                        const r = area.getBoundingClientRect();
                        changeZoom((d - lastPinch) * 0.0045, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top);
                    }
                    lastPinch = d;
                }
            }, { passive: false });
        }

        function saveHistory() { historyStack.push(JSON.stringify({ nodes, wires })); if (historyStack.length > 25) historyStack.shift(); }
        function undoAction() {
            if (!historyStack.length) return;
            const prev = JSON.parse(historyStack.pop());
            nodes = prev.nodes; wires = prev.wires;
            selectedNodeId = null; selectedWireId = null;
            document.getElementById('propBar').classList.remove('open');
            renderAllNodes(); saveToLocalStorage();
        }
        function toggleLockNodes() { nodesLocked = !nodesLocked; document.getElementById('btnLockCanvas').classList.toggle('lock-active', nodesLocked); }
        function toggleSidebar() { document.getElementById('compSidebar').classList.toggle('collapsed'); }

        function buildPalette() {
            const container = document.getElementById('paletteContainer');
            container.innerHTML = '';
            CATEGORIES.forEach((cat, idx) => {
                const grp = document.createElement('div');
                grp.className = 'cat-group';
                grp.innerHTML = `<div class="cat-header" onclick="this.nextElementSibling.classList.toggle('closed')"><span><span class="cat-dot" style="background:${cat.color};"></span>${cat.name}</span><span>▾</span></div><div class="cat-items ${idx > 1 ? 'closed' : ''}"></div>`;
                const list = grp.querySelector('.cat-items');
                cat.items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'palette-item';
                    row.dataset.label = item.label.toLowerCase();
                    row.innerHTML = `<div class="palette-thumb">${item.render({ id: 'prev' })}</div><span>${item.label}</span>`;
                    row.onclick = () => addComponent(item.type);
                    list.appendChild(row);
                });
                container.appendChild(grp);
            });
        }

        function filterPalette() {
            const q = document.getElementById('compSearch').value.trim().toLowerCase();
            document.querySelectorAll('.cat-group').forEach(g => {
                let any = false;
                const list = g.querySelector('.cat-items');
                g.querySelectorAll('.palette-item').forEach(it => {
                    const m = !q || it.dataset.label.includes(q);
                    it.style.display = m ? 'flex' : 'none';
                    if (m) any = true;
                });
                g.style.display = any ? 'block' : 'none';
                if (q && any) list.classList.remove('closed');
            });
        }

        function getCompDef(type) {
            for (const c of CATEGORIES) { const f = c.items.find(i => i.type === type); if (f) return f; }
            return null;
        }

        function defaultTagFor(type, seq) {
            if (type.startsWith('KM_')) return `-KM${seq}`;
            if (type.startsWith('RELAY_') || type === 'RELAY_5V') return `-K${seq}`;
            if (type === 'TIMER_RELAY' || type === 'STAIR_TIMER') return `-KT${seq}`;
            if (type === 'OVERLOAD') return `-F${seq}`;
            if (type.startsWith('MCB_') || type === 'MPCB') return `-Q${seq}`;
            if (type.startsWith('BTN_') || type === 'E_STOP') return `-S${seq}`;
            if (type.startsWith('MOTOR_') || type === 'VALVE_PUMP_UNIT') return `-M${seq}`;
            if (type.startsWith('PLC_') || type === 'S7_1200_PLC') return `-PLC${seq}`;
            if (type.startsWith('TX_')) return `-TT${seq}`;
            if (type === 'CAT_GENSET') return `-GEN${seq}`;
            return `-X${seq}`;
        }

        function addComponent(type, customX, customY, customTag) {
            saveHistory(); nodeSeq++;
            const area = document.getElementById('canvasArea');
            const x = customX !== undefined ? customX : Math.round(((area.clientWidth || 320) * 0.25 - panX) / zoomScale) + (nodeSeq % 4) * 28;
            const y = customY !== undefined ? customY : Math.round(((area.clientHeight || 400) * 0.25 - panY) / zoomScale) + (nodeSeq % 4) * 28;
            const node = {
                id: 'n_' + nodeSeq, type, x, y, rot: 0,
                tag: customTag || defaultTagFor(type, nodeSeq),
                swState: type === 'ATS_GRID', selPos: 0, analogVal: 50,
                timerMax: 5.0, timerSec: 5.0, tripAmp: 25, vfdHz: 50, linkMode: 'STAR',
                tripped: false, energized: false, running: false, damaged: false,
                q0: false, q1: false, d7: false, servoOn: false
            };
            snapToDinRail(node);
            nodes.push(node);
            renderAllNodes();
            saveToLocalStorage();
            if (window.innerWidth <= 768) document.getElementById('compSidebar').classList.add('collapsed');
            return node;
        }

        function renderAllNodes() {
            const stage = document.getElementById('workspaceStage');
            stage.querySelectorAll('.sim-node').forEach(el => el.remove());
            nodes.forEach(node => {
                const def = getCompDef(node.type);
                if (!def) return;
                const el = document.createElement('div');
                el.className = 'sim-node' + (node.id === selectedNodeId ? ' selected-node' : '') + (node.damaged ? ' node-damaged' : '');
                el.id = node.id;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                el.style.transform = `rotate(${node.rot || 0}deg)`;

                const faultHtml = node.damaged ? `<div class="fault-fx">🔥💨</div>` : '';
                let portsHtml = '';
                def.ports.forEach(p => {
                    const isAct = pendingPort && pendingPort.nodeId === node.id && pendingPort.portId === p.id;
                    const lblTop = p.y < 30 ? -12 : 12;
                    const lblHtml = p.hideLbl ? '' : `<span class="term-lbl" style="left:${p.x}px;top:${p.y + lblTop}px;transform:translateX(-50%);">${p.id}</span>`;
                    portsHtml += `<div class="term-port ${isAct ? 'active-pin' : ''}" style="left:${p.x}px;top:${p.y}px;" onclick="handlePortClick(event, '${node.id}', '${p.id}')" title="${node.tag}:${p.id}"></div>${lblHtml}`;
                });
                el.innerHTML = faultHtml + def.render(node) + portsHtml;
                setupNodeDrag(el, node);
                el.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node.id); });
                stage.appendChild(el);
            });
            drawWires();
        }

        function setupNodeDrag(el, node) {
            let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
            el.addEventListener('pointerdown', (e) => {
                if (nodesLocked || e.target.closest('.term-port, .push-hit, .toggle-pill, .breaker-hit, input, button')) return;
                e.stopPropagation(); dragging = true; moved = false;
                sx = e.clientX; sy = e.clientY; ox = node.x; oy = node.y;
                try { el.setPointerCapture(e.pointerId); } catch (err) {}
            });
            el.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = (e.clientX - sx) / zoomScale, dy = (e.clientY - sy) / zoomScale;
                if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
                node.x = Math.max(0, Math.round((ox + dx) / 10) * 10);
                node.y = Math.max(0, Math.round((oy + dy) / 10) * 10);
                el.style.left = node.x + 'px'; el.style.top = node.y + 'px';
                drawWires();
            });
            el.addEventListener('pointerup', (e) => {
                if (dragging) {
                    dragging = false;
                    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
                    if (moved) { snapToDinRail(node); el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; drawWires(); saveToLocalStorage(); }
                }
            });
        }

        function selectNode(id) {
            selectedNodeId = id;
            selectedWireId = null;
            document.querySelectorAll('.sim-node').forEach(el => el.classList.toggle('selected-node', el.id === id));
            drawWires();
            const node = nodes.find(n => n.id === id);
            const bar = document.getElementById('propBar');
            if (!node) { bar.classList.remove('open'); return; }
            const def = getCompDef(node.type);
            document.getElementById('propTagBadge').textContent = node.tag;
            document.getElementById('propTitle').textContent = def ? def.label : node.type;
            document.getElementById('propActionBtns').style.display = 'flex';

            const ctrl = document.getElementById('propDynamicCtrl');
            ctrl.innerHTML = '';
            if (node.type === 'TIMER_RELAY') {
                ctrl.innerHTML = `<span style="font-size:0.7rem;color:#facc15;">الزمن:</span><input type="number" min="1" max="60" step="0.5" value="${node.timerMax || 5}" style="width:52px;background:#0b0e14;color:#fff;border:1px solid #334155;border-radius:5px;padding:2px 4px;font-size:0.74rem;" onchange="updateNodeProp('${node.id}','timerMax',parseFloat(this.value))"><span style="font-size:0.68rem;color:#9ca3af;">ث</span>`;
            } else if (node.type === 'OVERLOAD') {
                ctrl.innerHTML = `<span style="font-size:0.7rem;color:#fb923c;">تيار الفصل:</span><input type="number" min="2" max="100" step="1" value="${node.tripAmp || 25}" style="width:52px;background:#0b0e14;color:#fff;border:1px solid #334155;border-radius:5px;padding:2px 4px;font-size:0.74rem;" onchange="updateNodeProp('${node.id}','tripAmp',parseFloat(this.value))"><span style="font-size:0.68rem;color:#9ca3af;">A</span>`;
            } else if (node.type === 'VFD_400V') {
                ctrl.innerHTML = `<span style="font-size:0.7rem;color:#34d399;">التردد:</span><input type="range" min="5" max="60" value="${node.vfdHz || 50}" style="width:72px;" oninput="updateNodeProp('${node.id}','vfdHz',parseFloat(this.value))"><span style="font-size:0.7rem;color:#fff;">${node.vfdHz || 50}Hz</span>`;
            } else if (['TX_TEMP', 'TX_LEVEL_420', 'TX_PRESSURE', 'TX_FLOW', 'POT_CTRL', 'HCSR04', 'DHT22'].includes(node.type)) {
                const maxVal = node.type === 'HCSR04' ? 400 : (node.type === 'DHT22' ? 50 : 100);
                ctrl.innerHTML = `<span style="font-size:0.7rem;color:#38bdf8;">القيمة:</span><input type="range" min="0" max="${maxVal}" value="${node.analogVal !== undefined ? node.analogVal : 50}" style="width:78px;" oninput="setAnalogVal('${node.id}', this.value)"><span style="font-size:0.7rem;color:#fff;">${node.analogVal !== undefined ? node.analogVal : 50}</span>`;
            } else if (node.type === 'MOTOR_TERMINAL_BOX') {
                ctrl.innerHTML = `<button class="t-btn" style="height:26px;padding:0 8px;background:#7c2d12;border-color:#ea580c;color:#fef3c7;" onclick="cycleTerminalLinks('${node.id}')">جسور: ${node.linkMode || 'STAR'}</button>`;
            }
            bar.classList.add('open');
        }

        function selectWire(wireId) {
            selectedWireId = wireId;
            selectedNodeId = null;
            document.querySelectorAll('.sim-node').forEach(el => el.classList.remove('selected-node'));
            drawWires();
            const w = wires.find(x => x.id === wireId);
            const bar = document.getElementById('propBar');
            if (!w) { bar.classList.remove('open'); return; }
            const n1 = nodes.find(n => n.id === w.fromNode);
            const n2 = nodes.find(n => n.id === w.toNode);
            document.getElementById('propTagBadge').textContent = `${w.gauge || '1.5'} mm²`;
            document.getElementById('propTitle').textContent = `سلك: ${(n1 && n1.tag) || '?'}:${w.fromPort} ↔ ${(n2 && n2.tag) || '?'}:${w.toPort}`;
            document.getElementById('propActionBtns').style.display = 'none';
            const ctrl = document.getElementById('propDynamicCtrl');
            ctrl.innerHTML = `
                <select class="gauge-select" onchange="updateWireProp('${w.id}','gauge',this.value)">
                    <option value="1.5" ${w.gauge === '1.5' ? 'selected' : ''}>1.5 mm² (16A)</option>
                    <option value="2.5" ${w.gauge === '2.5' ? 'selected' : ''}>2.5 mm² (25A)</option>
                    <option value="4.0" ${w.gauge === '4.0' ? 'selected' : ''}>4.0 mm² (32A)</option>
                    <option value="6.0" ${w.gauge === '6.0' ? 'selected' : ''}>6.0 mm² (40A)</option>
                    <option value="10.0" ${w.gauge === '10.0' ? 'selected' : ''}>10 mm² (63A)</option>
                </select>
                <button class="t-btn" style="height:27px;padding:0 8px;color:#f87171;border-color:#7f1d1d;" onclick="deleteSelectedWire()">حذف السلك</button>
            `;
            bar.classList.add('open');
        }

        function updateWireProp(wireId, prop, val) {
            const w = wires.find(x => x.id === wireId);
            if (!w) return;
            saveHistory();
            w[prop] = val;
            if (prop === 'gauge') w.ampLimit = WIRE_AMPACITY[val] || 16;
            drawWires(); saveToLocalStorage(); selectWire(wireId);
        }

        function deleteSelectedWire() {
            if (!selectedWireId) return;
            saveHistory();
            wires = wires.filter(w => w.id !== selectedWireId);
            selectedWireId = null;
            document.getElementById('propBar').classList.remove('open');
            drawWires(); saveToLocalStorage();
        }

        function updateNodeProp(id, prop, val) {
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n[prop] = val;
            if (prop === 'timerMax') n.timerSec = val;
            renderAllNodes(); saveToLocalStorage(); selectNode(id);
        }

        function rotateSelectedNode() {
            const n = nodes.find(x => x.id === selectedNodeId);
            if (!n) return;
            saveHistory(); n.rot = ((n.rot || 0) + 90) % 360;
            renderAllNodes(); saveToLocalStorage();
        }

        function duplicateSelectedNode() {
            const n = nodes.find(x => x.id === selectedNodeId);
            if (!n) return;
            const copy = addComponent(n.type, n.x + 30, n.y + 30);
            selectNode(copy.id);
        }

        function handleCanvasBgClick() {
            pendingPort = null; selectedNodeId = null; selectedWireId = null;
            document.getElementById('wiringHint').textContent = '';
            document.getElementById('propBar').classList.remove('open');
            document.getElementById('probeBadge').style.display = 'none';
            document.querySelectorAll('.term-port').forEach(p => p.classList.remove('active-pin'));
            document.querySelectorAll('.sim-node').forEach(el => el.classList.remove('selected-node'));
            drawWires();
        }

        function renameSelectedNode() {
            const n = nodes.find(x => x.id === selectedNodeId);
            if (!n) return;
            const nt = prompt('أدخل الرمز التعريفي الجديد للعنصر:', n.tag);
            if (nt && nt.trim()) {
                saveHistory();
                n.tag = nt.trim().slice(0, 14);
                renderAllNodes(); saveToLocalStorage(); selectNode(n.id);
            }
        }

        function deleteSelectedNode() {
            if (!selectedNodeId) return;
            saveHistory();
            wires = wires.filter(w => w.fromNode !== selectedNodeId && w.toNode !== selectedNodeId);
            nodes = nodes.filter(n => n.id !== selectedNodeId);
            selectedNodeId = null;
            document.getElementById('propBar').classList.remove('open');
            renderAllNodes(); saveToLocalStorage();
        }

        /* =========================================================
           3. WIRING, THERMAL AMPACITY & LIVE MULTIMETER PROBE
           ========================================================= */
        function setWireColor(hex, dotEl) {
            currentWireColor = hex;
            document.querySelectorAll('.w-color-dot').forEach(d => d.classList.remove('active'));
            if (dotEl) dotEl.classList.add('active');
        }

        function setWireGauge(val) { currentWireGauge = val; }

        function showProbeReading(text) {
            const badge = document.getElementById('probeBadge');
            badge.innerHTML = `⚡ مقياس الفحص: <span style="color:#facc15;">${escapeHtml(text)}</span>`;
            badge.style.display = 'block';
        }

        function handlePortClick(e, nodeId, portId) {
            e.stopPropagation();
            if (isRunning && !pendingPort) {
                const n = nodes.find(x => x.id === nodeId);
                let vText = '0 V';
                if (['L1', 'L2', 'L3', '1', '3', '5', 'L', 'V1'].includes(portId)) vText = '230V AC / 400V 3~';
                else if (['N', 'N1', 'N2', '0V', 'GND', 'BU-', 'COM', 'V2'].includes(portId)) vText = '0V (Neutral / GND)';
                else if (['L+', '24V', 'BN+'].includes(portId)) vText = '+24V DC';
                else if (['5V', 'VCC'].includes(portId)) vText = '+5V DC';
                else if (['3V3'].includes(portId)) vText = '+3.3V DC';
                else if (n && (n.energized || n.running || n.q0 || n.d7)) vText = 'LIVE (مُغذى)';
                showProbeReading(`${(n && n.tag) || ''}:${portId} ➔ ${vText}`);
                return;
            }
            if (!pendingPort) {
                pendingPort = { nodeId, portId };
                document.getElementById('wiringHint').textContent = `اختر الطرف الثاني... (${currentWireGauge}mm²)`;
                renderAllNodes();
            } else {
                if (pendingPort.nodeId !== nodeId || pendingPort.portId !== portId) {
                    saveHistory();
                    wires.push({
                        id: 'w_' + Date.now() + Math.random().toString(16).slice(2, 5),
                        fromNode: pendingPort.nodeId, fromPort: pendingPort.portId,
                        toNode: nodeId, toPort: portId,
                        color: currentWireColor, gauge: currentWireGauge,
                        ampLimit: WIRE_AMPACITY[currentWireGauge] || 16,
                        live: false, shorted: false, overheated: false
                    });
                    saveToLocalStorage();
                }
                pendingPort = null;
                document.getElementById('wiringHint').textContent = '';
                renderAllNodes();
            }
        }

        function getPortCoords(nodeId, portId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return null;
            const def = getCompDef(node.type);
            if (!def) return null;
            const p = def.ports.find(x => x.id === portId) || def.ports[0];
            if (!p) return null;
            const cx = def.w / 2, cy = def.h / 2;
            const rad = ((node.rot || 0) * Math.PI) / 180;
            const dx = p.x - cx, dy = p.y - cy;
            const rx = cx + dx * Math.cos(rad) - dy * Math.sin(rad);
            const ry = cy + dx * Math.sin(rad) + dy * Math.cos(rad);
            return { x: node.x + rx, y: node.y + ry };
        }

        function drawWires() {
            const svg = document.getElementById('wiresSvg');
            svg.innerHTML = '';
            wires.forEach((w, idx) => {
                const p1 = getPortCoords(w.fromNode, w.fromPort), p2 = getPortCoords(w.toNode, w.toPort);
                if (!p1 || !p2) return;
                const laneOffset = ((idx % 5) - 2) * 5;
                const midY = (p1.y + p2.y) / 2 + laneOffset;
                const pathD = `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
                const strokeW = Math.min(6, 2.6 + parseFloat(w.gauge || '1.5') * 0.35);
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathD);
                path.setAttribute('stroke', w.color);
                path.setAttribute('stroke-width', strokeW);
                path.setAttribute('class', 'wire-stroke' + (w.id === selectedWireId ? ' wire-selected' : '') + (w.live && isRunning ? ' wire-energized' : '') + (w.shorted ? ' wire-shorted' : '') + (w.overheated ? ' wire-overheated' : ''));
                path.onclick = (e) => {
                    e.stopPropagation();
                    if (isRunning) {
                        const warn = w.overheated ? ' 🔥 تحذير: السلك يسخن بسبب زيادة التيار!' : '';
                        showProbeReading(`سلك (${w.gauge || '1.5'} mm² / Max ${w.ampLimit || 16}A) ➔ ${w.live ? 'مُغذى بالتيار' : 'مفتوح 0V'}${warn}`);
                    } else {
                        selectWire(w.id);
                    }
                };
                svg.appendChild(path);
            });
        }

        function smartAutoWireBoard() {
            if (nodes.length < 2) { alert('أضف عناصر إلى اللوحة أولاً ثم اضغط توصيل تلقائي.'); return; }
            saveHistory();
            const find = t => nodes.find(n => n.type === t);
            const sup = find('SUPPLY_3P'), mcb3 = find('MCB_3P'), mcb1 = find('MCB_1P');
            const kms = nodes.filter(n => n.type.startsWith('KM_'));
            const ol = find('OVERLOAD'), mot = find('MOTOR_SD') || find('MOTOR_PTC');
            const s0 = find('BTN_STOP'), s1 = find('BTN_START'), tBox = find('MOTOR_TERMINAL_BOX');
            let added = 0;
            const link = (a, pa, b, pb, col, g = '2.5') => {
                if (!a || !b) return;
                if (!wires.some(w => (w.fromNode === a.id && w.fromPort === pa && w.toNode === b.id && w.toPort === pb) || (w.fromNode === b.id && w.fromPort === pb && w.toNode === a.id && w.toPort === pa))) {
                    wires.push({ id: 'w_' + Date.now() + Math.random(), fromNode: a.id, fromPort: pa, toNode: b.id, toPort: pb, color: col, gauge: g, ampLimit: WIRE_AMPACITY[g] || 25 });
                    added++;
                }
            };
            if (sup && mcb3) { link(sup, 'L1', mcb3, '1', '#ef4444', '4.0'); link(sup, 'L2', mcb3, '3', '#eab308', '4.0'); link(sup, 'L3', mcb3, '5', '#3b82f6', '4.0'); link(sup, 'N', mcb3, 'N1', '#38bdf8', '4.0'); }
            if (mcb3 && kms[0]) { link(mcb3, '2', kms[0], 'L1', '#ef4444', '4.0'); link(mcb3, '4', kms[0], 'L2', '#eab308', '4.0'); link(mcb3, '6', kms[0], 'L3', '#3b82f6', '4.0'); }
            if (kms[0] && ol) { link(kms[0], 'T1', ol, 'T1', '#ef4444', '4.0'); link(kms[0], 'T2', ol, 'T2', '#eab308', '4.0'); link(kms[0], 'T3', ol, 'T3', '#3b82f6', '4.0'); }
            if (ol && mot) { link(ol, 'T1', mot, 'U1', '#ef4444', '4.0'); link(ol, 'T2', mot, 'V1', '#eab308', '4.0'); link(ol, 'T3', mot, 'W1', '#3b82f6', '4.0'); }
            else if (kms[0] && mot) { link(kms[0], 'T1', mot, 'U1', '#ef4444', '4.0'); link(kms[0], 'T2', mot, 'V1', '#eab308', '4.0'); link(kms[0], 'T3', mot, 'W1', '#3b82f6', '4.0'); }
            if (mot && tBox) { link(mot, 'W2', tBox, 'W2', '#ef4444', '4.0'); link(mot, 'U2', tBox, 'U2', '#eab308', '4.0'); link(mot, 'V2', tBox, 'V2', '#3b82f6', '4.0'); }
            if (mcb3 && mcb1) link(mcb3, '2', mcb1, '1', '#ef4444', '1.5');
            if (mcb1 && s0) link(mcb1, '2', s0, '1', '#ef4444', '1.5');
            if (s0 && s1) link(s0, '2', s1, '3', '#ef4444', '1.5');
            if (s1 && kms[0]) {
                link(s1, '4', kms[0], 'A1', '#ef4444', '1.5');
                link(s1, '3', kms[0], '13', '#ef4444', '1.5');
                link(s1, '4', kms[0], '14', '#ef4444', '1.5');
                if (mcb3) link(kms[0], 'A2', mcb3, 'N2', '#38bdf8', '1.5');
            }
            drawWires(); saveToLocalStorage();
            showProbeReading(added > 0 ? `تم توصيل ${added} سلك تلقائياً بنجاح!` : 'العناصر موصلة مسبقاً.');
        }

        /* =========================================================
           4. INTERACTIVE ACTUATORS & LIVE SIMULATION ENGINE
           ========================================================= */
        function pressButton(e, id, state) {
            e.stopPropagation();
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n.pressed = state;
            playSoundEffect('clack');
            const release = () => {
                n.pressed = false;
                renderAllNodes();
                if (isRunning) evaluateCircuitStep();
                window.removeEventListener('pointerup', release);
            };
            window.addEventListener('pointerup', release);
            renderAllNodes();
            if (isRunning) evaluateCircuitStep();
        }

        function toggleBreaker(id) {
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n.tripped = !n.tripped;
            playSoundEffect(n.tripped ? 'trip' : 'clack');
            if (!n.tripped) {
                nodes.forEach(x => x.damaged = false);
                wires.forEach(w => { w.shorted = false; w.overheated = false; });
                document.getElementById('faultToast').style.display = 'none';
            }
            renderAllNodes(); saveToLocalStorage();
            if (isRunning) evaluateCircuitStep();
        }

        function toggleSwitchState(id) {
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n.swState = !n.swState;
            playSoundEffect('clack');
            if (n.type === 'OVERLOAD' && !n.swState) {
                document.getElementById('faultToast').style.display = 'none';
            }
            renderAllNodes(); saveToLocalStorage();
            if (isRunning) evaluateCircuitStep();
        }

        function cycleSelector(id, count) {
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n.selPos = ((n.selPos || 0) + 1) % count;
            playSoundEffect('clack');

        }

        function cycleTerminalLinks(id) {
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            const modes = ['STAR', 'DELTA', 'OPEN'];
            n.linkMode = modes[(modes.indexOf(n.linkMode || 'STAR') + 1) % modes.length];
