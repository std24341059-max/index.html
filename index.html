<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltAI Studio Pro | محاكي الكلاسيك كنترول والـ PLC والأردوينو (88 عنصر واقعي)</title>
    <style>
        :root {
            --bg-canvas: #0b0e14;
            --grid-dot: #232a36;
            --panel-bg: #121620;
            --panel-border: #242c3a;
            --accent: #10b981;
            --accent-blue: #3b82f6;
            --danger: #ef4444;
            --text-main: #f3f4f6;
        }
        body.light-blueprint {
            --bg-canvas: #dce3ec;
            --grid-dot: #b4c0ce;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-canvas); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .svg-ic { width: 15px; height: 15px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
        .ltr-isolate { direction: ltr !important; unicode-bidi: isolate !important; }

        /* Top Bar */
        .top-bar { min-height: 48px; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 5px 8px; gap: 5px; z-index: 100; }
        .brand-group, .sim-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        .back-voltai-btn { background: rgba(59,130,246,0.14); border: 1px solid rgba(59,130,246,0.45); color: #60a5fa; height: 32px; padding: 0 9px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; text-decoration: none; transition: 0.15s; }
        .back-voltai-btn:hover { background: rgba(59,130,246,0.28); color: #fff; }
        .t-btn { background: #19202c; border: 1px solid #2d3748; color: var(--text-main); height: 32px; padding: 0 8px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; transition: 0.15s; }
        .t-btn:hover { border-color: var(--accent-blue); }
        .t-btn.run-active { background: var(--accent); color: #042f2e; border-color: var(--accent); }
        .t-btn.lock-active { background: #f59e0b; color: #1c1917; border-color: #f59e0b; }
        .t-btn.sound-on { border-color: #10b981; color: #34d399; }
        .t-btn.ai-magic { background: linear-gradient(135deg, #2563eb, #7c3aed); border: none; color: #fff; box-shadow: 0 0 14px rgba(124,58,237,0.4); }
        .t-btn.auto-wire-btn { background: linear-gradient(135deg, #059669, #0284c7); border: none; color: #fff; }
        .t-btn.hmi-btn { background: linear-gradient(135deg, #d97706, #b45309); border: none; color: #fff; }

        /* Main Body & Sidebar */
        .studio-body { flex: 1; display: flex; position: relative; overflow: hidden; }
        .comp-sidebar { width: 300px; background: rgba(18,22,32,0.99); border-left: 1px solid var(--panel-border); display: flex; flex-direction: column; z-index: 80; flex-shrink: 0; }
        .comp-sidebar.collapsed { display: none !important; }
        @media (max-width: 768px) { .comp-sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 85%; max-width: 315px; box-shadow: -12px 0 30px rgba(0,0,0,0.85); } }

        .search-wrap { padding: 8px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; gap: 6px; }
        .search-input-box { flex: 1; display: flex; align-items: center; background: #0b0e14; border: 1px solid #2d3748; border-radius: 8px; padding: 0 8px; color: #9ca3af; }
        .search-input-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 7px 6px; font-size: 0.78rem; outline: none; }
        .close-sidebar-btn { background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.45); color: #f87171; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cat-scroll { flex: 1; overflow-y: auto; padding: 6px; }
        .cat-group { margin-bottom: 6px; }
        .cat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #171c26; border-radius: 8px; font-size: 0.78rem; font-weight: 800; color: #e5e7eb; cursor: pointer; user-select: none; }
        .cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 7px; }
        .cat-items { display: flex; flex-direction: column; gap: 4px; padding: 5px 2px; }
        .cat-items.closed { display: none; }
        .palette-item { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid transparent; cursor: pointer; font-size: 0.75rem; color: #d1d5db; }
        .palette-item:hover { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.45); color: #fff; }
        .palette-thumb { width: 48px; height: 40px; background: #0b0e14; border: 1px solid #262f3d; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 2px; direction: ltr; }
        .palette-thumb svg { width: 100%; height: 100%; object-fit: contain; }

        /* Workspace & DIN-Rails */
        .canvas-area { flex: 1; position: relative; background-color: var(--bg-canvas); background-image: radial-gradient(var(--grid-dot) 1.4px, transparent 1.4px); background-size: 22px 22px; overflow: hidden; touch-action: none; cursor: grab; }
        .canvas-area:active { cursor: grabbing; }
        body.light-blueprint .canvas-area { background-image: linear-gradient(to right, rgba(100,116,139,0.16) 1px, transparent 1px), linear-gradient(to bottom, rgba(100,116,139,0.16) 1px, transparent 1px); background-size: 20px 20px; }
        #workspaceStage { position: absolute; top: 0; left: 0; width: 2600px; height: 2600px; transform-origin: 0 0; will-change: transform; direction: ltr; }

        .din-rail-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .din-rail-layer.hidden { display: none; }
        .din-rail-bar {
            position: absolute; left: 20px; width: 2000px; height: 26px;
            background: linear-gradient(180deg, #64748b 0%, #cbd5e1 22%, #94a3b8 50%, #cbd5e1 78%, #475569 100%);
            border-top: 1.5px solid #e2e8f0; border-bottom: 1.5px solid #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
            display: flex; align-items: center;
        }
        .din-rail-bar::after {
            content: ''; width: 100%; height: 8px;
            background: repeating-linear-gradient(90deg, transparent 0 18px, #334155 18px 34px);
            opacity: 0.65;
        }

        #wiresSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        .wire-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; cursor: pointer; transition: stroke-width 0.15s; }
        .wire-stroke:hover { stroke-width: 6 !important; }
        @keyframes currentFlow { to { stroke-dashoffset: -20; } }
        .wire-energized { stroke-dasharray: 7 3; animation: currentFlow 0.45s linear infinite; filter: drop-shadow(0 0 4px currentColor); }
        @keyframes faultBlink { 0%, 100% { stroke: #ef4444; stroke-width: 5; } 50% { stroke: #fde047; stroke-width: 7; } }
        .wire-shorted { animation: faultBlink 0.35s infinite; }
        @keyframes wireOverheat { 0%, 100% { stroke: #f97316; stroke-width: 4.5; } 50% { stroke: #ef4444; stroke-width: 6.5; filter: drop-shadow(0 0 8px #ef4444); } }
        .wire-overheated { animation: wireOverheat 0.45s infinite; }

        /* Visual Faults: Sparks & Smoke */
        @keyframes nodeShake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px, 2px); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, -2px); } }
        @keyframes smokeRise { 0% { opacity: 0.9; transform: translateY(0) scale(0.7); } 100% { opacity: 0; transform: translateY(-38px) scale(1.8); } }
        .node-damaged { animation: nodeShake 0.25s infinite; }
        .node-damaged .hw-wrap { filter: drop-shadow(0 0 14px #ef4444) brightness(0.85); }
        .fault-fx { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: 60; font-size: 1.3rem; animation: smokeRise 1.1s ease-out infinite; }

        /* Nodes & Realistic Slotted Brass Terminals */
        .sim-node { position: absolute; z-index: 20; user-select: none; touch-action: none; direction: ltr; transform-origin: center center; }
        .sim-node.selected-node .hw-wrap { filter: drop-shadow(0 0 9px rgba(59,130,246,0.98)); }
        .hw-wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.68)); direction: ltr; }
        .yellow-tag { background: #facc15; color: #18181b; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 2px; border: 1px solid #ca8a04; letter-spacing: 0.3px; direction: ltr !important; unicode-bidi: isolate !important; display: inline-block; }

        .term-port {
            position: absolute; width: 12px; height: 12px; transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fef08a, #eab308 55%, #713f12 100%);
            border: 1.2px solid #271603;
            box-shadow: 0 0 0 1.2px rgba(15,23,42,0.85), inset 0 1px 1px rgba(255,255,255,0.65);
            cursor: crosshair; z-index: 40; display: flex; align-items: center; justify-content: center;
        }
        .term-port::after { content: ''; width: 6.5px; height: 1.4px; background: #422006; transform: rotate(-32deg); }
        .term-port:hover, .term-port.active-pin { background: #38bdf8; box-shadow: 0 0 11px #38bdf8; transform: translate(-50%, -50%) scale(1.45); }
        .term-lbl { position: absolute; font-size: 0.48rem; font-weight: 800; color: #f8fafc; background: rgba(11,14,20,0.9); padding: 0 2.5px; border-radius: 2px; pointer-events: none; white-space: nowrap; direction: ltr; letter-spacing: 0.2px; }

        /* Interactive Actuators & Rotors */
        .push-hit { cursor: pointer; touch-action: none; }
        .toggle-pill { background: linear-gradient(180deg, #334155, #0f172a); border: 1px solid #64748b; color: #38bdf8; font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; cursor: pointer; direction: ltr; }
        @keyframes spinRotor { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .rotor-spinning { animation: spinRotor var(--spin-dur, 0.5s) linear infinite; }
        .rotor-spinning-rev { animation: spinRotor var(--spin-dur, 0.5s) linear infinite reverse; }

        /* Floating Wire & Gauge Bar */
        .floating-wire-bar { position: absolute; top: 8px; left: 8px; background: rgba(18,22,32,0.96); border: 1px solid var(--panel-border); padding: 5px 8px; border-radius: 10px; display: flex; align-items: center; gap: 5px; z-index: 70; flex-wrap: wrap; max-width: calc(100% - 16px); box-shadow: 0 6px 16px rgba(0,0,0,0.55); }
        .w-color-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .w-color-dot.active { border-color: #fff; transform: scale(1.16); }
        .gauge-select { background: #0b0e14; color: #facc15; border: 1px solid #334155; border-radius: 6px; padding: 2px 5px; font-size: 0.7rem; font-weight: 800; outline: none; direction: ltr; }

        .probe-badge { position: absolute; top: 52px; right: 10px; background: rgba(15,23,42,0.97); border: 1.5px solid #10b981; color: #ecfdf5; padding: 6px 11px; border-radius: 9px; font-size: 0.74rem; font-weight: 800; z-index: 78; display: none; box-shadow: 0 6px 18px rgba(0,0,0,0.65); }

        .zoom-controls { position: absolute; bottom: 52px; left: 10px; background: rgba(18,22,32,0.95); border: 1px solid var(--panel-border); border-radius: 10px; padding: 4px; display: flex; align-items: center; gap: 4px; z-index: 72; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
        .z-btn { background: #1e2532; border: 1px solid #334155; color: #f8fafc; width: 29px; height: 29px; border-radius: 7px; font-size: 0.85rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .z-pct { font-size: 0.71rem; font-weight: 800; color: #38bdf8; padding: 0 5px; min-width: 42px; text-align: center; cursor: pointer; }

        .prop-bar { position: absolute; bottom: 92px; left: 10px; right: 10px; max-width: 620px; background: rgba(22,27,38,0.98); border: 1px solid #3b82f6; border-radius: 12px; padding: 7px 10px; display: none; align-items: center; justify-content: space-between; gap: 6px; z-index: 75; box-shadow: 0 10px 25px rgba(0,0,0,0.75); }
        .prop-bar.open { display: flex; flex-wrap: wrap; }

        .fault-toast { position: absolute; top: 52px; left: 8px; max-width: 390px; background: rgba(127,29,29,0.97); border: 1px solid #ef4444; color: #fecaca; padding: 9px 13px; border-radius: 10px; font-size: 0.77rem; line-height: 1.5; z-index: 90; display: none; }
        .bottom-dock { position: absolute; bottom: 46px; left: 10px; right: 10px; max-width: 860px; height: 335px; background: rgba(18,22,32,0.98); border: 1px solid var(--panel-border); border-radius: 14px; z-index: 85; display: none; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.75); overflow: hidden; }
        .bottom-dock.open { display: flex; }
        .dock-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: #171c26; border-bottom: 1px solid var(--panel-border); font-size: 0.8rem; font-weight: 800; }
        .dock-content { flex: 1; padding: 11px; overflow-y: auto; font-size: 0.8rem; }

        .bottom-bar { height: 44px; background: var(--panel-bg); border-top: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 6px; overflow-x: auto; z-index: 95; }
        .dock-trigger { background: #19202c; border: 1px solid #2d3748; color: #d1d5db; padding: 5px 9px; border-radius: 7px; font-size: 0.74rem; font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .dock-trigger.active { background: rgba(16,185,129,0.16); border-color: var(--accent); color: var(--accent); }
        .ladder-rung { background: #0b0e14; border: 1px solid #242c3a; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-family: monospace; direction: ltr; text-align: left; font-size: 0.77rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .rung-live { border-color: #10b981; box-shadow: inset 3px 0 0 #10b981; }
        .rung-title { color: #9ca3af; font-size: 0.7rem; margin-bottom: 3px; }
        .rung-wire { color: #64748b; font-weight: bold; }
        .rung-live .rung-wire { color: #10b981; }
        .bom-table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
        .bom-table th, .bom-table td { border: 1px solid #263042; padding: 6px 8px; text-align: right; }
        .bom-table th { background: #171c26; color: #38bdf8; }
        .ai-msg-box { background: #0b0e14; border: 1px solid #263042; border-radius: 8px; padding: 9px 11px; margin-top: 8px; line-height: 1.65; font-size: 0.78rem; }
        .challenge-card { background: #0b0e14; border: 1px solid #2d3748; border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

        /* HMI Panel Door Overlay */
        .hmi-modal { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.92); z-index: 190; display: none; align-items: center; justify-content: center; padding: 14px; }
        .hmi-modal.open { display: flex; }
        .hmi-cabinet { background: linear-gradient(145deg, #475569, #334155); border: 4px solid #64748b; border-radius: 14px; width: 100%; max-width: 660px; max-height: 88vh; overflow-y: auto; padding: 18px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 25px 50px rgba(0,0,0,0.85); color: #f8fafc; }
        .hmi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; margin-top: 14px; background: #1e293b; border: 2px solid #0f172a; border-radius: 10px; padding: 14px; }
        .hmi-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }

        /* In-App Print Modal */
        .print-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; padding: 15px; }
        .print-modal.open { display: flex; }
        .print-sheet { background: #fff; color: #0f172a; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; border-radius: 12px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .print-sheet table { width: 100%; border-collapse: collapse; margin: 12px 0 18px; font-size: 0.82rem; }
        .print-sheet th, .print-sheet td { border: 1px solid #cbd5e1; padding: 7px 10px; text-align: right; }
        .print-sheet th { background: #f1f5f9; }
        @media print {
            body > *:not(.print-modal) { display: none !important; }
            .print-modal { position: static; background: #fff; padding: 0; }
            .print-sheet { box-shadow: none; max-height: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Global Shared 2.5D Realistic Industrial Materials & Shadows -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none;">
        <defs>
            <filter id="real-shadow" x="-15%" y="-15%" width="135%" height="135%">
                <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
            </filter>
            <linearGradient id="mat-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f8fafc"/><stop offset="32%" stop-color="#94a3b8"/>
                <stop offset="62%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#475569"/>
            </linearGradient>
            <radialGradient id="mat-brass" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#fef08a"/><stop offset="48%" stop-color="#eab308"/>
                <stop offset="100%" stop-color="#713f12"/>
            </radialGradient>
            <linearGradient id="mat-copper" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fdba74"/><stop offset="50%" stop-color="#ea580c"/>
                <stop offset="100%" stop-color="#9a3412"/>
            </linearGradient>
            <linearGradient id="mat-din-body" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e2e8f0"/><stop offset="18%" stop-color="#cbd5e1"/>
                <stop offset="85%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/>
            </linearGradient>
            <linearGradient id="mat-dark-body" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#334155"/><stop offset="20%" stop-color="#252932"/>
                <stop offset="85%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <linearGradient id="mat-plc-body" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#1e293b"/>
                <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <linearGradient id="mat-cat-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#facc15"/><stop offset="55%" stop-color="#eab308"/>
                <stop offset="100%" stop-color="#ca8a04"/>
            </linearGradient>
            <linearGradient id="mat-motor-blue" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6"/><stop offset="45%" stop-color="#1d4ed8"/>
                <stop offset="100%" stop-color="#1e3a8a"/>
            </linearGradient>
            <radialGradient id="mat-btn-green" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#86efac"/><stop offset="40%" stop-color="#22c55e"/>
                <stop offset="85%" stop-color="#15803d"/><stop offset="100%" stop-color="#052e16"/>
            </radialGradient>
            <radialGradient id="mat-btn-red" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fca5a5"/><stop offset="40%" stop-color="#ef4444"/>
                <stop offset="85%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#450a0a"/>
            </radialGradient>
            <radialGradient id="mat-btn-blue" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#7dd3fc"/><stop offset="40%" stop-color="#0ea5e9"/>
                <stop offset="85%" stop-color="#0369a1"/><stop offset="100%" stop-color="#0c4a6e"/>
            </radialGradient>
        </defs>
    </svg>

    <header class="top-bar">
        <div class="brand-group">
            <button class="t-btn" id="btnToggleSidebar" onclick="toggleSidebar()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                <span>العناصر (88)</span>
            </button>
            <a href="https://volt-ai.std24341059.workers.dev/" class="back-voltai-btn" target="_top">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>VoltAI Pro</span>
            </a>
        </div>

        <div class="sim-controls">
            <button class="t-btn" id="btnRunSim" onclick="toggleSimulation()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>تشغيل</span>
            </button>
            <button class="t-btn" onclick="stopSimulation()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                <span>إيقاف</span>

    <script>
        /* =========================================================
           0. INDUSTRIAL WEB AUDIO SOUND SYNTHESIZER & COST DB
           ========================================================= */
        let soundEnabled = true;
        let audioCtx = null;
        let buzzerTick = 0;

        const WIRE_AMPACITY = { '1.5': 16, '2.5': 25, '4.0': 32, '6.0': 40, '10.0': 63 };

        const UNIT_PRICES_USD = {
            SUPPLY_3P: 15, CAT_GENSET: 3500, ATS_EOQ3: 110, ATS_GRID: 25, ATS_GEN: 45,
            DIST_1P_13: 8, DIST_4P_28: 18, DIST_4P_48: 26,
            BUS_H_6: 4, BUS_H_12: 6, BUS_H_18: 8, BUS_V_6: 4, BUS_V_12: 6, BUS_V_18: 8, SOCKET_16A: 5,
            MCB_3P: 22, MCB_1P: 6, MPCB: 34, KM_3P_12A: 18, KM_3P_38A: 28, KM_3P_95A: 65, KM_4P_40A: 38,
            AUX_2: 7, AUX_4: 12, KM_TIMER: 20, AUX_MCB: 8, RELAY_2CO: 8, RELAY_4CO: 11, TIMER_RELAY: 19,
            STAIR_TIMER: 14, IMPULSE_1NO: 12, IMPULSE_2NO: 15, PHASE_RELAY: 24, PTC_RELAY: 28, SAFETY_RELAY: 75,
            OVERLOAD: 22, BTN_START: 4, BTN_STOP: 4, BTN_DUAL: 6, E_STOP: 9, SW_0_1: 6, SEL_1_0_2: 8,
            SEL_1_2_3: 9, POT_CTRL: 7, LAMP_GREEN: 3, LAMP_RED: 3, BUZZER: 5,
            MOTOR_TERMINAL_BOX: 15, MOTOR_SD: 140, MOTOR_PTC: 165, MOTOR_DC24: 45, VALVE_PUMP_UNIT: 240,
            TOWER_2: 18, TOWER_3: 24, SIREN: 16, HEATER_FAN: 25, VFD_400V: 185, SOFT_STARTER: 160,
            LIMIT_SW: 9, FLOAT_SW: 11, THERMOSTAT: 12, PROX_PNP: 14, PROX_NPN: 14, TX_LEVEL_420: 55,
            TX_PRESSURE: 48, TX_FLOW: 65, TX_TEMP: 42, VOLTMETER: 12, AMMETER: 15, SEL_VA: 10, FREQ_METER: 14,
            HOUR_METER: 11, KWH_METER: 32, MULTIMETER: 28,
            S7_1200_PLC: 240, PLC_8DI_4DO: 95, PLC_14IO: 135, PLC_24IO: 195, PUMP_1P: 85,
            ARDUINO_UNO: 12, ARDUINO_MEGA: 22, ESP32_BOARD: 10, RELAY_5V: 4, HCSR04: 3,
            DHT22: 5, SERVO_MOTOR: 6, LCD_I2C: 7, LED_220: 1
        };

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btnSoundToggle');
            btn.classList.toggle('sound-on', soundEnabled);
            btn.style.opacity = soundEnabled ? '1' : '0.45';
        }

        function playSoundEffect(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'clack') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(42, now + 0.06);
                    gain.gain.setValueAtTime(0.32, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.start(now); osc.stop(now + 0.07);
                } else if (type === 'trip') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
                    osc.start(now); osc.stop(now + 0.19);
                } else if (type === 'buzzer') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                }
            } catch (e) {}
        }

        /* =========================================================
           1. REALISTIC 2.5D SVG HARDWARE RENDERERS (88 COMPONENTS)
           ========================================================= */
        function svgBrassScrews(ports) {
            return (ports || []).map(p => `
                <g transform="translate(${p.x},${p.y})">
                    <rect x="-6.5" y="-6.5" width="13" height="13" rx="2.5" fill="#0b0e14" stroke="#334155" stroke-width="0.8"/>
                    <circle cx="0" cy="0" r="4.6" fill="url(#mat-brass)" stroke="#422006" stroke-width="0.7"/>
                    <path d="M-2.8 0 H2.8 M0 -2.8 V2.8" stroke="#422006" stroke-width="1"/>
                </g>`).join('');
        }

        function renderRealisticPushButton(n, gradId, defaultTag, ports) {
            const pressed = n && n.pressed;
            const tag = (n && n.tag) || defaultTag;
            return `
            <div class="hw-wrap ltr-isolate">
                <svg width="76" height="94" viewBox="0 0 76 94" filter="url(#real-shadow)">
                    <!-- Rear Contact Block -->
                    <rect x="20" y="6" width="36" height="82" rx="4" fill="url(#mat-dark-body)" stroke="#475569" stroke-width="1.4"/>
                    <rect x="24" y="16" width="28" height="62" rx="2" fill="${gradId.includes('red') ? '#7f1d1d' : '#14532d'}" opacity="0.8"/>
                    <!-- 2.5D Metallic Bezel Ring -->
                    <circle cx="40" cy="48" r="24" fill="#1e293b"/>
                    <circle cx="37" cy="47" r="24" fill="url(#mat-chrome)" stroke="#475569" stroke-width="1.4"/>
                    <circle cx="37" cy="47" r="18.5" fill="#0f172a"/>
                    <!-- Colored Actuator Cap -->
                    <circle class="push-hit" cx="${pressed ? 38 : 36}" cy="47" r="16.5" fill="url(#${gradId})" onpointerdown="pressButton(event, '${n.id}', true)"/>
                    <path d="M26 38 A12 12 0 0 1 44 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.65" pointer-events="none"/>
                    <!-- Yellow Tag -->
                    <rect x="21" y="71" width="34" height="10" rx="1.5" fill="#facc15" stroke="#ca8a04" stroke-width="0.7"/>
                    <text x="38" y="78" fill="#18181b" font-size="6" font-weight="900" text-anchor="middle">${tag}</text>
                    ${svgBrassScrews(ports)}
                </svg>
            </div>`;
        }

        function renderRealisticProximitySensor(n, typeLabel, ports) {
            const active = n && n.swState;
            const tag = (n && n.tag) || '-B1';
            return `
            <div class="hw-wrap ltr-isolate" onclick="toggleSwitchState('${n.id}')" title="انقر لتفعيل/إلغاء الاستشعار">
                <svg width="116" height="72" viewBox="0 0 116 72" filter="url(#real-shadow)">
                    <!-- 3-Core Cable -->
                    <path d="M22 25 C4 25, 4 56, 26 56 L78 56" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
                    <line x1="22" y1="56" x2="22" y2="63" stroke="#92400e" stroke-width="2"/>
                    <line x1="50" y1="56" x2="50" y2="63" stroke="#0f172a" stroke-width="2"/>
                    <line x1="78" y1="56" x2="78" y2="63" stroke="#2563eb" stroke-width="2"/>
                    <!-- Rear Cap & Status LED -->
                    <rect x="20" y="18" width="12" height="14" rx="2" fill="#334155"/>
                    <circle cx="26" cy="25" r="3" fill="${active ? '#22c55e' : '#f59e0b'}"/>
                    <!-- M18 Threaded Chrome Barrel -->
                    <rect x="32" y="16" width="58" height="18" fill="url(#mat-chrome)" stroke="#475569" stroke-width="1"/>
                    <g stroke="#475569" stroke-width="0.9" opacity="0.75">
                        <line x1="38" y1="16" x2="38" y2="34"/><line x1="42" y1="16" x2="42" y2="34"/><line x1="46" y1="16" x2="46" y2="34"/>
                        <line x1="68" y1="16" x2="68" y2="34"/><line x1="72" y1="16" x2="72" y2="34"/><line x1="76" y1="16" x2="76" y2="34"/><line x1="80" y1="16" x2="80" y2="34"/><line x1="84" y1="16" x2="84" y2="34"/>
                    </g>
                    <!-- Locknuts -->
                    <rect x="50" y="13" width="6" height="24" rx="1.2" fill="url(#mat-chrome)" stroke="#334155"/>
                    <rect x="59" y="13" width="6" height="24" rx="1.2" fill="url(#mat-chrome)" stroke="#334155"/>
                    <!-- Orange Sensing Face -->
                    <path d="M90 16 H101 A3 3 0 0 1 104 19 V31 A3 3 0 0 1 101 34 H90 Z" fill="#ea580c" stroke="#9a3412"/>
                    <rect x="35" y="38" width="44" height="10" rx="1.5" fill="#facc15"/>
                    <text x="57" y="45" fill="#18181b" font-size="5.6" font-weight="900" text-anchor="middle">${tag} ${typeLabel}</text>
                    ${svgBrassScrews(ports)}
                </svg>

                el.innerHTML = `<div style="position:relative;width:100%;height:100%;">${fxHtml}${def.render(node)}${portsHtml}</div>`;
                enableDragAndSelect(el, node);
                stage.appendChild(el);
            });
            drawWires();
            if (document.getElementById('hmiModal').classList.contains('open')) renderHmiGrid();
        }

        function enableDragAndSelect(el, node) {
            let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
            el.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                selectNode(node.id);
                if (nodesLocked || e.target.closest('.term-port, .push-hit, .toggle-pill') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                dragging = true; sx = e.clientX; sy = e.clientY; ox = node.x; oy = node.y;
                try { el.setPointerCapture(e.pointerId); } catch (err) {}
            });
            el.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                node.x = Math.max(10, ox + (e.clientX - sx) / zoomScale);
                node.y = Math.max(20, oy + (e.clientY - sy) / zoomScale);
                el.style.left = node.x + 'px'; el.style.top = node.y + 'px';
                drawWires();
            });
            el.addEventListener('pointerup', (e) => {
                if (dragging) {
                    dragging = false;
                    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
                    snapToDinRail(node);
                    el.style.left = node.x + 'px'; el.style.top = node.y + 'px';
                    drawWires();
                    saveToLocalStorage();
                }
            });
        }

        function selectNode(nodeId) {
            selectedNodeId = nodeId;
            const node = nodes.find(n => n.id === nodeId);
            const bar = document.getElementById('propBar');
            if (!node || !bar) return;
            const def = getCompDef(node.type);
            document.getElementById('propTagBadge').textContent = node.tag;
            document.getElementById('propTitle').textContent = def ? def.label : node.type;
            const dyn = document.getElementById('propDynamicCtrl');
            dyn.innerHTML = '';

            if (['TX_TEMP', 'TX_LEVEL_420', 'TX_PRESSURE', 'TX_FLOW', 'POT_CTRL'].includes(node.type)) {
                const isTemp = node.type === 'TX_TEMP';
                const minV = isTemp ? -50 : 0, maxV = isTemp ? 250 : 100, unit = isTemp ? '°C' : '%';
                const sigTxt = isTemp ? (((node.analogVal + 50) / 300) * 5).toFixed(2) + ' V' : (4 + (node.analogVal / 100) * 16).toFixed(2) + ' mA';
                dyn.innerHTML = `<input type="range" min="${minV}" max="${maxV}" value="${node.analogVal}" style="width:90px;" oninput="updateSelectedAnalog('${node.id}', this.value, '${unit}')"><span id="propValReadout" style="font-size:0.72rem;font-weight:800;color:#38bdf8;">${node.analogVal}${unit} (${sigTxt})</span>`;
            } else if (node.type === 'TIMER_RELAY') {
                const tMax = node.timerMax || 5.0;
                dyn.innerHTML = `<span style="font-size:0.7rem;color:#9ca3af;">الزمن:</span><input type="range" min="1" max="30" step="0.5" value="${tMax}" style="width:85px;" oninput="updateTimerSetting('${node.id}', this.value)"><span id="propValReadout" style="font-size:0.72rem;font-weight:800;color:#f59e0b;">${tMax.toFixed(1)}s</span>`;
            } else if (node.type === 'OVERLOAD') {
                const tAmp = node.tripAmp || 25;
                dyn.innerHTML = `<span style="font-size:0.7rem;color:#9ca3af;">تيار الفصل:</span><input type="range" min="5" max="60" step="1" value="${tAmp}" style="width:85px;" oninput="updateOverloadSetting('${node.id}', this.value)"><span id="propValReadout" style="font-size:0.72rem;font-weight:800;color:#fb923c;">${tAmp} A</span>`;
            } else if (node.type === 'VFD_400V') {
                const hz = node.vfdHz || 50;
                dyn.innerHTML = `<span style="font-size:0.7rem;color:#9ca3af;">التردد:</span><input type="range" min="5" max="60" step="1" value="${hz}" style="width:85px;" oninput="updateVfdSetting('${node.id}', this.value)"><span id="propValReadout" style="font-size:0.72rem;font-weight:800;color:#38bdf8;">${hz} Hz</span>`;
            } else if (node.type === 'MOTOR_TERMINAL_BOX') {
                dyn.innerHTML = `<button class="toggle-pill" onclick="cycleTerminalLinks('${node.id}')">جسور النحاس: ${node.linkMode || 'STAR'}</button>`;
            }

            bar.classList.add('open');
            document.querySelectorAll('.sim-node').forEach(el => el.classList.toggle('selected-node', el.id === nodeId));
        }

        function cycleTerminalLinks(id) {
            const n = nodes.find(x => x.id === id); if (!n) return;
            const order = ['STAR', 'DELTA', 'OPEN'];
            n.linkMode = order[(order.indexOf(n.linkMode || 'STAR') + 1) % order.length];
            playSoundEffect('clack');
            if (selectedNodeId === id) selectNode(id);
            renderAllNodes(); saveToLocalStorage();
        }

        function updateTimerSetting(id, val) {
            const n = nodes.find(x => x.id === id); if (!n) return;
            n.timerMax = parseFloat(val) || 5.0; n.timerSec = n.timerMax;
            const r = document.getElementById('propValReadout'); if (r) r.textContent = n.timerMax.toFixed(1) + 's';
            renderAllNodes(); saveToLocalStorage();
        }
        function updateOverloadSetting(id, val) {
            const n = nodes.find(x => x.id === id); if (!n) return;
            n.tripAmp = parseInt(val, 10) || 25;
            const r = document.getElementById('propValReadout'); if (r) r.textContent = n.tripAmp + ' A';
            renderAllNodes(); saveToLocalStorage();
        }
        function updateVfdSetting(id, val) {
            const n = nodes.find(x => x.id === id); if (!n) return;
            n.vfdHz = parseInt(val, 10) || 50;
            const r = document.getElementById('propValReadout'); if (r) r.textContent = n.vfdHz + ' Hz';
            renderAllNodes(); saveToLocalStorage();
        }

        function rotateSelectedNode() { const n = nodes.find(x => x.id === selectedNodeId); if (!n) return; saveHistory(); n.rot = ((n.rot || 0) + 90) % 360; renderAllNodes(); saveToLocalStorage(); }
        function duplicateSelectedNode() { const n = nodes.find(x => x.id === selectedNodeId); if (!n) return; saveHistory(); const copy = spawnComponent(n.type, n.x + 115, n.y, n.tag + '_2'); if (copy) { selectNode(copy.id); saveToLocalStorage(); } }
        function updateSelectedAnalog(nodeId, val, unit) {
            const n = nodes.find(x => x.id === nodeId); if (!n) return;
            n.analogVal = parseInt(val, 10) || 0; tankLevel = Math.min(100, Math.max(0, n.analogVal));
            const isTemp = n.type === 'TX_TEMP';
            const sigTxt = isTemp ? (((n.analogVal + 50) / 300) * 5).toFixed(2) + ' V' : (4 + (n.analogVal / 100) * 16).toFixed(2) + ' mA';
            const r = document.getElementById('propValReadout'); if (r) r.textContent = `${n.analogVal}${unit} (${sigTxt})`;
            if (isRunning) evaluateCircuitStep();
            saveToLocalStorage();
        }
        function renameSelectedNode() { const n = nodes.find(x => x.id === selectedNodeId); if (!n) return; const t = prompt('الرمز الجديد:', n.tag); if (t && t.trim()) { n.tag = t.trim(); selectNode(n.id); renderAllNodes(); saveToLocalStorage(); } }
        function deleteSelectedNode() { if (!selectedNodeId) return; saveHistory(); nodes = nodes.filter(n => n.id !== selectedNodeId); wires = wires.filter(w => w.fromNode !== selectedNodeId && w.toNode !== selectedNodeId); closePropBar(); renderAllNodes(); saveToLocalStorage(); }
        function closePropBar() { selectedNodeId = null; document.getElementById('propBar').classList.remove('open'); document.querySelectorAll('.sim-node.selected-node').forEach(el => el.classList.remove('selected-node')); }
        function handleCanvasBgClick() { cancelWiring(); closePropBar(); }

        /* --- HMI Panel Door View --- */
        function openHmiDoor() {
            document.getElementById('hmiModal').classList.add('open');
            renderHmiGrid();
        }
        function closeHmiDoor() { document.getElementById('hmiModal').classList.remove('open'); }
        function renderHmiGrid() {
            const grid = document.getElementById('hmiGridContent');
            if (!grid) return;
            const hmiTypes = ['BTN_START', 'BTN_STOP', 'BTN_DUAL', 'E_STOP', 'SW_0_1', 'SEL_1_0_2', 'SEL_1_2_3', 'ATS_GRID', 'ATS_GEN', 'CAT_GENSET', 'LAMP_GREEN', 'LAMP_RED', 'BUZZER', 'VOLTMETER', 'AMMETER', 'FREQ_METER', 'KWH_METER'];
            const doorNodes = nodes.filter(n => hmiTypes.includes(n.type));
            if (!doorNodes.length) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px;">لا توجد أزرار أو لمبات أو عدادات في الدائرة الحالية لعرضها على باب اللوحة.</div>`;
                return;
            }
            grid.innerHTML = doorNodes.map(n => {
                let ctrlHtml = '';
                if (['BTN_START', 'BTN_STOP', 'BTN_DUAL'].includes(n.type)) {
                    const bg = n.type === 'BTN_START' ? '#22c55e' : (n.type === 'BTN_STOP' ? '#ef4444' : '#0ea5e9');
                    ctrlHtml = `<div style="width:44px;height:44px;border-radius:50%;background:${bg};border:3px solid #cbd5e1;cursor:pointer;" onpointerdown="pressButton(event, '${n.id}', true)"></div>`;
                } else if (['ATS_GRID', 'ATS_GEN', 'CAT_GENSET', 'SW_0_1', 'E_STOP'].includes(n.type)) {
                    ctrlHtml = `<button class="toggle-pill" onclick="toggleSwitchState('${n.id}')">${n.swState ? 'ON / RUN' : 'OFF / STOP'}</button>`;
                } else if (['SEL_1_0_2', 'SEL_1_2_3'].includes(n.type)) {
                    ctrlHtml = `<button class="toggle-pill" onclick="cycleSelector('${n.id}', 3)">POS: ${n.selPos || 0}</button>`;
                } else if (n.type === 'LAMP_GREEN') {
                    ctrlHtml = `<div style="width:34px;height:34px;border-radius:50%;background:${n.energized ? '#22c55e' : '#14532d'};box-shadow:${n.energized ? '0 0 16px #22c55e' : 'none'};border:2px solid #94a3b8;"></div>`;
                } else if (n.type === 'LAMP_RED') {
                    ctrlHtml = `<div style="width:34px;height:34px;border-radius:50%;background:${n.energized ? '#ef4444' : '#7f1d1d'};box-shadow:${n.energized ? '0 0 16px #ef4444' : 'none'};border:2px solid #94a3b8;"></div>`;
                } else if (n.type === 'VOLTMETER') {
                    ctrlHtml = `<div style="font-family:monospace;font-size:1rem;font-weight:900;color:#38bdf8;">${n.voltVal || '398 V'}</div>`;
                } else if (n.type === 'AMMETER') {
                    ctrlHtml = `<div style="font-family:monospace;font-size:1rem;font-weight:900;color:#facc15;">${n.ampVal || '0.0 A'}</div>`;
                } else {
                    ctrlHtml = `<div style="font-family:monospace;font-size:0.85rem;color:#10b981;">ACTIVE</div>`;
                }
                return `<div class="hmi-item"><span class="yellow-tag">${n.tag}</span>${ctrlHtml}</div>`;
            }).join('');
        }

        /* =========================================================
           4. WIRING, ORTHOGONAL TAGS, ROTATION MATH & AUTO-WIRE
           ========================================================= */
        function smartAutoWireBoard() {
            if (nodes.length < 2) { alert('أضف عنصرين على الأقل للوحة ليتم توصيلهما تلقائياً.'); return; }
            saveHistory();
            const sup = nodes.find(n => n.type === 'SUPPLY_3P' || n.type === 'CAT_GENSET');
            const mcb = nodes.find(n => n.type === 'MCB_3P');
            const kms = nodes.filter(n => n.type.startsWith('KM_'));
            const mot = nodes.find(n => n.type.startsWith('MOTOR_') && n.type !== 'MOTOR_TERMINAL_BOX');
            const s1 = nodes.find(n => n.type === 'BTN_START');
            const s0 = nodes.find(n => n.type === 'BTN_STOP');

            const prevLen = wires.length;
            if (sup && mcb) {
                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444', '4.0');
                connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308', '4.0');
                connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6', '4.0');
                connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8', '2.5');
            }
            if (mcb && kms[0]) {
                connectPorts(mcb.id, '2', kms[0].id, 'L1', '#ef4444', '4.0');
                connectPorts(mcb.id, '4', kms[0].id, 'L2', '#eab308', '4.0');
                connectPorts(mcb.id, '6', kms[0].id, 'L3', '#3b82f6', '4.0');
                connectPorts(mcb.id, 'N2', kms[0].id, 'A2', '#38bdf8', '1.5');
                if (s0 && s1) {
                    connectPorts(mcb.id, '2', s0.id, '1', '#ef4444', '1.5');
                    connectPorts(s0.id, '2', s1.id, '3', '#ef4444', '1.5');
                    connectPorts(s1.id, '4', kms[0].id, 'A1', '#ef4444', '1.5');
                } else if (s1) {
                    connectPorts(mcb.id, '2', s1.id, '3', '#ef4444', '1.5');
                    connectPorts(s1.id, '4', kms[0].id, 'A1', '#ef4444', '1.5');
                } else {
                    connectPorts(mcb.id, '2', kms[0].id, 'A1', '#ef4444', '1.5');
                }
            }
            if (kms[0] && mot) {
                connectPorts(kms[0].id, 'T1', mot.id, 'U1', '#ef4444', '4.0');
                connectPorts(kms[0].id, 'T2', mot.id, 'V1', '#eab308', '4.0');
                connectPorts(kms[0].id, 'T3', mot.id, 'W1', '#3b82f6', '4.0');
            }
            const wiredCount = wires.length - prevLen;
            saveToLocalStorage();
            showProbeReading(wiredCount > 0 ? `تم تمديد ${wiredCount} سلك تلقائياً بنجاح!` : 'العناصر الأساسية موصلة مسبقاً.');
        }

        function getPinVoltageLabel(node, portId) {
            if (!isRunning) return `${node.tag} [${portId}]: الدائرة متوقفة (0V)`;
            if (['L1', 'L2', 'L3', '1', '3', '5', 'T1', 'T2', 'T3', 'U1', 'V1', 'W1'].includes(portId)) return `${node.tag} [${portId}]: 400V AC ~ (فاز قدرة)`;
            if (['N', 'N1', 'N2', '0V', 'GND', 'CATH', 'BU-', 'PE'].includes(portId)) return `${node.tag} [${portId}]: 0V (نيوترال / أرضي)`;
            if (['24V', 'L+', 'BN+'].includes(portId)) return `${node.tag} [${portId}]: +24V DC`;
            if (['5V', 'VCC', '3V3'].includes(portId)) return `${node.tag} [${portId}]: +5.0V DC`;
            if (portId === 'OUT' || portId === 'IW64' || portId === 'A0') {
                const isTemp = node.type === 'TX_TEMP';
                const val = node.analogVal !== undefined ? node.analogVal : Math.round(tankLevel);
                return isTemp
                    ? `${node.tag} [${portId}]: ${(((val + 50) / 300) * 5).toFixed(2)}V DC (${val}°C)`
                    : `${node.tag} [${portId}]: ${(4 + (val / 100) * 16).toFixed(2)}mA (${val}%)`;
            }
            if (portId === 'Q0.0') return `${node.tag} [Q0.0]: ${node.q0 ? '24V DC (ON)' : '0V (OFF)'}`;
            if (portId === 'Q0.1') return `${node.tag} [Q0.1]: ${node.q1 ? '24V DC (ON)' : '0V (OFF)'}`;
            if (portId === 'D7' || portId === 'IN') return `${node.tag} [${portId}]: ${node.d7 || node.energized ? '5.0V HIGH' : '0V LOW'}`;
            return `${node.tag} [${portId}]: ${node.energized || node.running ? '230V / 24V (مُغذّى)' : '0V (مفتوح)'}`;
        }

        function showProbeReading(text) {
            const b = document.getElementById('probeBadge');
            if (!b) return;
            b.innerHTML = `<span style="color:#10b981;">الحالة:</span> <span class="ltr-isolate">${text}</span>`;
            b.style.display = 'block';
        }

        function handlePortClick(ev, nodeId, portId) {
            ev.stopPropagation();
            const n = nodes.find(x => x.id === nodeId);
            if (n && isRunning) showProbeReading(getPinVoltageLabel(n, portId));

            if (!pendingPort) {
                pendingPort = { nodeId, portId };
                ev.currentTarget.classList.add('active-pin');
                document.getElementById('wiringHint').textContent = `اختر الطرف الثاني من [${portId}]...`;
                return;
            }
            if (pendingPort.nodeId === nodeId && pendingPort.portId === portId) { cancelWiring(); return; }
            saveHistory();
            connectPorts(pendingPort.nodeId, pendingPort.portId, nodeId, portId, currentWireColor, currentWireGauge);
            cancelWiring();
            saveToLocalStorage();
        }

        function connectPorts(fromNode, fromPort, toNode, toPort, color, gauge) {
            const dup = wires.some(w => (w.fromNode === fromNode && w.fromPort === fromPort && w.toNode === toNode && w.toPort === toPort) || (w.fromNode === toNode && w.fromPort === toPort && w.toNode === fromNode && w.toPort === fromPort));
            if (!dup) {
                const g = gauge || currentWireGauge || '1.5';
                wires.push({
                    id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    fromNode, fromPort, toNode, toPort,
                    color: color || '#ef4444',
                    gauge: g,
                    ampLimit: WIRE_AMPACITY[g] || 16,
                    live: false, shorted: false, overheated: false
                });
                drawWires();
            }
        }

        function cancelWiring() { pendingPort = null; document.querySelectorAll('.term-port.active-pin').forEach(p => p.classList.remove('active-pin')); document.getElementById('wiringHint').textContent = ''; }

        function getPortXY(nodeId, portId) {
            const n = nodes.find(x => x.id === nodeId);
            if (!n) return null;
            const d = getCompDef(n.type);
            if (!d) return null;
            const p = d.ports.find(i => i.id === portId);
            if (!p) return null;
            const rot = (n.rot || 0) % 360;
            if (!rot) return { x: n.x + p.x, y: n.y + p.y };
            const w = d.w || 100, h = d.h || 80;
            const cx = w / 2, cy = h / 2;
            const rad = (rot * Math.PI) / 180;
            const dx = p.x - cx, dy = p.y - cy;
            const rx = dx * Math.cos(rad) - dy * Math.sin(rad) + cx;
            const ry = dx * Math.sin(rad) + dy * Math.cos(rad) + cy;
            return { x: n.x + rx, y: n.y + ry };
        }

        function drawWires() {
            const svg = document.getElementById('wiresSvg');
            if (!svg) return;
            svg.innerHTML = '';
            const colorOffsets = { '#ef4444': -6, '#eab308': -2, '#3b82f6': 2, '#38bdf8': 6, '#10b981': 10 };
            wires.forEach((w, idx) => {
                const p1 = getPortXY(w.fromNode, w.fromPort), p2 = getPortXY(w.toNode, w.toPort);
                if (!p1 || !p2) return;
                const offset = colorOffsets[w.color] || 0;
                const midY = Math.round((p1.y + p2.y) / 2) + offset;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`);
                path.setAttribute('stroke', w.color);
                path.setAttribute('stroke-width', '3.2');
                path.classList.add('wire-stroke');
                if (w.live) path.classList.add('wire-energized');
                if (w.shorted) path.classList.add('wire-shorted');
                if (w.overheated) path.classList.add('wire-overheated');
                path.onclick = (e) => {
                    e.stopPropagation();
                    if (isRunning) {
                        const fn = nodes.find(x => x.id === w.fromNode);
                        if (fn) showProbeReading(getPinVoltageLabel(fn, w.fromPort) + ` | مقطع ${w.gauge || '1.5'}mm²`);
                        return;
                    }
                    saveHistory();
                    wires = wires.filter(i => i.id !== w.id);
                    drawWires();
                    saveToLocalStorage();
                };
                svg.appendChild(path);

                // Wire Tag & Gauge Pill on Orthogonal Horizontal Segment
                if (Math.abs(p2.x - p1.x) >= 34) {
                    const mx = (p1.x + p2.x) / 2;
                    const gTxt = `${w.fromPort} | ${w.gauge || '1.5'}mm²`;
                    const boxW = Math.max(44, gTxt.length * 4.5);
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.setAttribute('transform', `translate(${mx}, ${midY})`);
                    g.setAttribute('pointer-events', 'none');
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', -boxW / 2); rect.setAttribute('y', -7);
                    rect.setAttribute('width', boxW); rect.setAttribute('height', 14);
                    rect.setAttribute('rx', 3);
                    rect.setAttribute('fill', w.overheated ? '#7f1d1d' : '#0f172a');
                    rect.setAttribute('stroke', w.overheated ? '#ef4444' : w.color);
                    rect.setAttribute('stroke-width', '0.9');
                    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    txt.setAttribute('x', 0); txt.setAttribute('y', 2.5);
                    txt.setAttribute('fill', w.overheated ? '#fef08a' : '#f8fafc');
                    txt.setAttribute('font-size', '6.2');
                    txt.setAttribute('font-family', 'monospace');
                    txt.setAttribute('font-weight', 'bold');
                    txt.setAttribute('text-anchor', 'middle');
                    txt.textContent = gTxt;
                    g.appendChild(rect); g.appendChild(txt);
                    svg.appendChild(g);
                }

                [p1, p2].forEach(pt => {
                    const f = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    f.setAttribute('cx', pt.x); f.setAttribute('cy', pt.y); f.setAttribute('r', '4');
                    f.setAttribute('fill', w.color); f.setAttribute('stroke', '#0f172a'); f.setAttribute('stroke-width', '1.2');
                    svg.appendChild(f);
                });
            });
        }

        let activePressedButtonId = null;

        function pressButton(ev, id, isDown) {
            if (ev) ev.stopPropagation();
            const n = nodes.find(x => x.id === id);
            if (!n) return;
            n.pressed = isDown;
            activePressedButtonId = isDown ? id : null;
            if (isDown) playSoundEffect('clack');
            if (isRunning) evaluateCircuitStep();
            renderAllNodes();
        }

        function releaseAnyPressedButton() {
            if (!activePressedButtonId) return;
            const n = nodes.find(x => x.id === activePressedButtonId);
            activePressedButtonId = null;
            if (n && n.pressed) {
                n.pressed = false;
                if (isRunning) evaluateCircuitStep();
                renderAllNodes();
            }
        }

        window.addEventListener('pointerup', releaseAnyPressedButton);
        window.addEventListener('pointercancel', releaseAnyPressedButton);
        window.addEventListener('blur', releaseAnyPressedButton);

        function toggleSwitchState(id) { const n = nodes.find(x => x.id === id); if (!n) return; n.swState = !n.swState; playSoundEffect(n.type === 'OVERLOAD' && n.swState ? 'trip' : 'clack'); if (isRunning) evaluateCircuitStep(); renderAllNodes(); saveToLocalStorage(); }
        function cycleSelector(id, max) { const n = nodes.find(x => x.id === id); if (!n) return; n.selPos = ((n.selPos || 0) + 1) % max; playSoundEffect('clack'); if (isRunning) evaluateCircuitStep(); renderAllNodes(); saveToLocalStorage(); }
        function setAnalogVal(id, v) { const n = nodes.find(x => x.id === id); if (!n) return; n.analogVal = parseInt(v, 10) || 0; tankLevel = n.analogVal; if (isRunning) evaluateCircuitStep(); saveToLocalStorage(); }

        /* =========================================================
           5. SIMULATION ENGINE (3-LINE ATS + WIRE THERMAL + LADDER)
           ========================================================= */
        function toggleSimulation() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btnRunSim').classList.add('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: المحاكاة تعمل (المس أي برغي أو سلك لفحص الجهد)';
            runFaultDiagnostics();
            simInterval = setInterval(evaluateCircuitStep, 250);
        }

        function stopSimulation() {
            isRunning = false; clearInterval(simInterval); plcAutoLatch = false;
            activePressedButtonId = null;
            document.getElementById('btnRunSim').classList.remove('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: متوقف | انقر على سلك لحذفه أو اسحب العناصر';
            document.getElementById('faultToast').style.display = 'none';
            document.getElementById('probeBadge').style.display = 'none';
            nodes.forEach(n => { n.pressed = false; n.energized = false; n.running = false; n.tripped = false; n.damaged = false; n.timerSec = n.timerMax || 5.0; n.timerDone = false; n.sdMode = '3~ MOT'; n.q0 = false; n.q1 = false; n.d7 = false; n.servoOn = false; n.reading = '0.00 A'; n.ampVal = '0.0 A'; });
            wires.forEach(w => { w.live = false; w.shorted = false; w.overheated = false; });
            renderAllNodes();
        }

        function runFaultDiagnostics() {
            const toast = document.getElementById('faultToast');
            let faults = [];
            nodes.forEach(n => n.damaged = false);
            const hot = ['L1', 'L2', 'L3', '1', '3', '5', 'L'], neu = ['N', 'N1', 'N2', 'GND', '0V'];
            wires.forEach(w => {
                w.shorted = false;
                if ((hot.includes(w.fromPort) && neu.includes(w.toPort)) || (neu.includes(w.fromPort) && hot.includes(w.toPort))) {
                    w.shorted = true;
                    const n1 = nodes.find(x => x.id === w.fromNode), n2 = nodes.find(x => x.id === w.toNode);
                    if (n1) n1.damaged = true;
                    if (n2) n2.damaged = true;
                    faults.push('<strong>قصر كهربائي مباشر (Short Circuit):</strong> تم ربط فاز مع النيوترال/الأرضي!');
                }
            });
            nodes.filter(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type)).forEach(ard => {
                if (wires.some(w => (w.fromNode === ard.id && ['L1', 'L2', 'L3', '2', '4', '6'].includes(w.toPort)) || (w.toNode === ard.id && ['L1', 'L2', 'L3', '2', '4', '6'].includes(w.fromPort)))) {
                    ard.damaged = true;
                    faults.push(`<strong>تلف المتحكم (${ard.tag}):</strong> جهد 400V/230V موصول مباشرة بالأردوينو!`);
                }
            });
            nodes.filter(n => n.type === 'MOTOR_TERMINAL_BOX' && n.linkMode === 'OPEN').forEach(tb => {
                faults.push(`<strong>تنبيه روزتة المحرك (${tb.tag}):</strong> جسور النحاس مفتوحة (OPEN)! انقر عليها لاختيار Star أو Delta.`);
            });
            if (faults.length) {
                playSoundEffect('trip');
                nodes.filter(n => n.type.startsWith('MCB') || n.type === 'MPCB').forEach(b => b.tripped = true);
                toast.innerHTML = faults.join('<br>'); toast.style.display = 'block';
            } else toast.style.display = 'none';
            renderAllNodes();
        }

        function evaluateCircuitStep() {
            if (wires.some(w => w.shorted)) return;
            const prevStates = nodes.map(n => n.energized);

            const startBtns = nodes.filter(n => n.type === 'BTN_START' || n.type === 'BTN_DUAL');
            const stopBtn = nodes.find(n => n.type === 'BTN_STOP'), eStop = nodes.find(n => n.type === 'E_STOP');
            const olrTripped = nodes.some(n => n.type === 'OVERLOAD' && n.swState);
            const swOn = nodes.find(n => ['SW_0_1', 'FLOAT_SW', 'LIMIT_SW', 'PROX_PNP', 'PROX_NPN', 'THERMOSTAT'].includes(n.type));
            const gridNode = nodes.find(n => n.type === 'ATS_GRID');
            const genNodes = nodes.filter(n => n.type === 'ATS_GEN' || n.type === 'CAT_GENSET');
            const isStopped = (stopBtn && stopBtn.pressed) || (eStop && eStop.swState) || olrTripped;
            const triggerActive = startBtns.some(b => b.pressed) || (swOn && swOn.swState);

            const contactors = nodes.filter(n => n.type.startsWith('KM_') || n.type.startsWith('RELAY_2') || n.type.startsWith('RELAY_4'));
            
            if (gridNode && genNodes.length >= 2 && contactors.length >= 3) {
                const l1On = gridNode.swState !== false;
                const l2On = genNodes[0].swState === true;
                const l3On = genNodes[1].swState === true;
                contactors[0].energized = l1On && !isStopped;
                contactors[1].energized = !l1On && l2On && !isStopped;
                contactors[2].energized = !l1On && !l2On && l3On && !isStopped;
            } else if (gridNode && genNodes.length >= 1 && contactors.length >= 2) {
                const gridAvailable = gridNode.swState !== false;
                const genAvailable = genNodes[0].swState === true;
                contactors[0].energized = gridAvailable && !isStopped;
                contactors[1].energized = !gridAvailable && genAvailable && !isStopped;
            } else {
                contactors.forEach((km, idx) => {
                    if (!wires.some(w => w.fromNode === km.id || w.toNode === km.id)) return;
                    const hasLatch = wires.some(w => (w.fromNode === km.id && ['13', '14', '11'].includes(w.fromPort)) || (w.toNode === km.id && ['13', '14', '11'].includes(w.fromPort)));
                    
                    if (isStopped) {
                        km.energized = false;
                    } else if (startBtns.length > 1) {
                        const pb = startBtns[idx] || startBtns[0];
                        if (pb && pb.pressed) {
                            contactors.forEach(o => o.energized = false);
                            km.energized = true;
                        } else if (!hasLatch && !stopBtn) {
                            km.energized = false;
                        }
                    } else if (triggerActive || (startBtns.length === 0 && !swOn && wires.length >= 2)) {
                        km.energized = true;
                    } else if (!hasLatch && !stopBtn && startBtns.length > 0 && !triggerActive) {
                        km.energized = false;
                    }
                });
            }

            if (nodes.some((n, i) => n.energized !== prevStates[i])) {
                playSoundEffect('clack');
            }

            const anyKm = contactors.some(k => k.energized);
            nodes.filter(n => n.type === 'TIMER_RELAY').forEach(tm => {
                const maxT = tm.timerMax || 5.0;
                if (anyKm && !isStopped) { if (tm.timerSec > 0) { tm.timerSec = Math.max(0, tm.timerSec - 0.25); tm.timerDone = tm.timerSec === 0; } }
                else { tm.timerSec = maxT; tm.timerDone = false; }
            });

            // Evaluate Interactive PLC Ladder Logic
            let memM0 = false;
            customLadderRungs.forEach(rung => {
                const evalCond = (inp, cType) => {
                    let raw = false;
                    if (inp === 'I0.0') raw = triggerActive || plcAutoLatch;
                    else if (inp === 'I0.1') raw = isStopped;
                    else if (inp === 'I0.2') raw = sewageLevel > 70;
                    else if (inp === 'I0.3') raw = !!(swOn && swOn.swState);
                    else if (inp === 'M0.0') raw = memM0;
                    else if (inp === 'IW64<90') raw = tankLevel < 90;
                    else if (inp === 'IW64>50') raw = tankLevel > 50;
                    return cType === 'NC' ? !raw : raw;
                };
                rung.live = evalCond(rung.in1, rung.type1) && evalCond(rung.in2, rung.type2);
                if (rung.coil === 'M0.0') memM0 = rung.live;
            });

            nodes.filter(n => n.type.startsWith('PLC_') || n.type === 'S7_1200_PLC').forEach(plc => {
                if (isStopped) plcAutoLatch = false;
                if (triggerActive || (startBtns.length === 0 && !swOn && wires.length > 0)) plcAutoLatch = true;
                const q0Rung = customLadderRungs.find(r => r.coil === 'Q0.0');
                const q1Rung = customLadderRungs.find(r => r.coil === 'Q0.1');
                plc.q0 = q0Rung ? q0Rung.live : (plcAutoLatch && tankLevel < 90);
                plc.q1 = q1Rung ? q1Rung.live : (plcAutoLatch && sewageLevel > 70);
                nodes.filter(n => n.type.startsWith('RELAY_2')).forEach(r => { if (wires.some(w => (w.fromNode === plc.id && w.toNode === r.id) || (w.toNode === plc.id && w.fromNode === r.id))) r.energized = plc.q0; });
            });

            nodes.filter(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type)).forEach(ard => {
                const s = nodes.find(x => ['TX_TEMP', 'TX_LEVEL_420', 'POT_CTRL'].includes(x.type));
                const v = s ? s.analogVal : tankLevel;
                const matchLt = arduinoCode.match(/val\s*<\s*(-?\d+)/);
                const matchGt = arduinoCode.match(/val\s*>\s*(-?\d+)/);
                if (matchLt) ard.d7 = v < parseInt(matchLt[1], 10);
                else if (matchGt) ard.d7 = v > parseInt(matchGt[1], 10);
                else ard.d7 = v < 85;
                nodes.filter(n => n.type === 'RELAY_5V').forEach(r => r.energized = ard.d7);
                nodes.filter(n => n.type === 'SERVO_MOTOR').forEach(sv => sv.servoOn = ard.d7);
                nodes.filter(n => n.type === 'LCD_I2C').forEach(l => l.lcdText = `Val:${v} ${ard.d7 ? 'ON' : 'OFF'}`);
            });

            const powerActive = anyKm || nodes.some(n => n.type === 'RELAY_5V' && n.energized) || nodes.some(n => (n.type.startsWith('PLC_') || n.type === 'S7_1200_PLC') && n.q0);
            const timerNode = nodes.find(n => n.type === 'TIMER_RELAY');
            const tbNode = nodes.find(n => n.type === 'MOTOR_TERMINAL_BOX');
            nodes.filter(n => ['MOTOR_SD', 'MOTOR_PTC', 'MOTOR_DC24', 'VFD_400V', 'SOFT_STARTER', 'VALVE_PUMP_UNIT'].includes(n.type)).forEach(m => {
                m.running = wires.some(w => w.fromNode === m.id || w.toNode === m.id) && powerActive && (!tbNode || tbNode.linkMode !== 'OPEN');
                if (m.type === 'MOTOR_SD') {
                    if (!m.running) m.sdMode = '3~ MOT';
                    else if (tbNode) m.sdMode = tbNode.linkMode === 'DELTA' ? 'DELTA Δ' : 'STAR Y';
                    else m.sdMode = (contactors.length === 2 && !timerNode ? (contactors[1].energized ? 'REV' : 'FWD') : (timerNode && timerNode.timerDone ? 'DELTA Δ' : 'STAR Y'));
                }
            });
            nodes.filter(n => n.type === 'PUMP_1P').forEach(p => { p.running = wires.some(w => w.fromNode === p.id || w.toNode === p.id) && powerActive; if (p.running) tankLevel = Math.min(100, tankLevel + 1.5); });
            if (outletOpen && tankLevel > 5) tankLevel = Math.max(5, tankLevel - 0.6);
            activeSewagePumps = powerActive ? Math.min(4, Math.ceil(sewageLevel / 25)) : 0;

            buzzerTick = (buzzerTick + 1) % 4;
            nodes.filter(n => ['LAMP_GREEN', 'BUZZER', 'LED_220'].includes(n.type)).forEach(l => {
                l.energized = wires.some(w => w.fromNode === l.id || w.toNode === l.id) && powerActive;
                if (l.type === 'BUZZER' && l.energized && buzzerTick === 0) playSoundEffect('buzzer');
            });
            nodes.filter(n => n.type === 'LAMP_RED').forEach(l => l.energized = wires.some(w => w.fromNode === l.id || w.toNode === l.id) && (!powerActive || olrTripped));
            
            const anyMot = nodes.some(n => n.running);
            const vfd = nodes.find(n => n.type === 'VFD_400V');
            const hzFactor = vfd ? ((vfd.vfdHz || 50) / 50) : 1;
            const deltaFactor = (tbNode && tbNode.linkMode === 'DELTA') ? 1.45 : 1.0;
            const currentAmps = anyMot ? +((19.8 * hzFactor * deltaFactor) + (Math.random() * 0.6)).toFixed(2) : 0;
            
            // Automatic Thermal Overload Trip Check
            nodes.filter(n => n.type === 'OVERLOAD').forEach(olr => {
                if (anyMot && currentAmps > (olr.tripAmp || 25) && !olr.swState) {
                    olr.swState = true;
                    playSoundEffect('trip');
                    showProbeReading(`فصل الأوفرلود (${olr.tag}) لتجاوز تيار الحمل ${olr.tripAmp}A!`);
                }
            });

            // Wire Gauge Thermal Overload Check
            wires.forEach(w => {
                w.live = powerActive || w.color === '#ef4444';
                const isPowerWire = ['L1', 'L2', 'L3', 'T1', 'T2', 'T3', 'U1', 'V1', 'W1', '2', '4', '6'].includes(w.fromPort) || ['L1', 'L2', 'L3', 'T1', 'T2', 'T3', 'U1', 'V1', 'W1'].includes(w.toPort);
                w.overheated = anyMot && isPowerWire && currentAmps > (w.ampLimit || 16);
            });

            scopeHistory.push(currentAmps);
            if (scopeHistory.length > 40) scopeHistory.shift();
            scopePhaseTick += 0.45;

            nodes.filter(n => n.type === 'MULTIMETER').forEach(mm => mm.reading = anyMot ? `${currentAmps.toFixed(2)} A` : '0.00 A');
            nodes.filter(n => n.type === 'AMMETER').forEach(am => am.ampVal = anyMot ? `${currentAmps.toFixed(1)} A` : '0.0 A');
            
            const draggingSlider = document.activeElement && document.activeElement.type === 'range';
            if (!activePressedButtonId && !draggingSlider) renderAllNodes();
            else drawWires();
            
            if (activeChallengeGoal && anyMot && !wires.some(w => w.shorted)) {
                const chBox = document.getElementById('challengeStatusBanner');
                if (chBox) chBox.innerHTML = `<span style="color:#10b981;font-weight:900;">🎉 أحسنت! تم إصلاح العطل وتشغيل المنظومة بنجاح!</span>`;
            }

            if (activeDock === 'scope') renderScopeDock();
            if (activeDock === 'process') renderProcessTank();
            if (activeDock === 'plc') renderPlcLadder();
        }

        /* =========================================================
           6. BOTTOM DOCKS (AI, 3-PHASE SCOPE, RANDOM FAULTS, LADDER, COST BOM)
           ========================================================= */
        let activeDock = null;
        function openDock(tab) {
            activeDock = tab;
            document.getElementById('bottomDock').classList.add('open');
            document.querySelectorAll('.dock-trigger').forEach(b => b.classList.remove('active'));
            const t = document.getElementById('trig-' + tab); if (t) t.classList.add('active');
            if (tab === 'ai') renderAiBuilderDock();
            if (tab === 'scope') renderScopeDock();
            if (tab === 'challenges') renderChallengesDock();
            if (tab === 'process') renderProcessTank();
            if (tab === 'plc') renderPlcLadder();
            if (tab === 'arduino') renderArduinoIde();
            if (tab === 'bom') renderBomReport();
        }
        function closeDock() { activeDock = null; document.getElementById('bottomDock').classList.remove('open'); document.querySelectorAll('.dock-trigger').forEach(b => b.classList.remove('active')); }

        function renderScopeDock() {
            document.getElementById('dockTitle').textContent = 'راسم الإشارة وموجات الـ 3 فاز (3-Phase Oscilloscope)';
            const maxA = 35;
            const pts = scopeHistory.map((v, i) => `${12 + i * 9},${78 - Math.min(68, (v / maxA) * 68)}`).join(' ');
            const latestA = scopeHistory[scopeHistory.length - 1] || 0;
            const anyMot = nodes.some(n => n.running);
            const vfd = nodes.find(n => n.type === 'VFD_400V');
            const hz = anyMot ? (vfd ? (vfd.vfdHz || 50) : 50) : 0;

            const buildSine = (phaseOffset) => {
                let p = [];
                for (let x = 0; x <= 340; x += 6) {
                    const y = 42 - (anyMot ? 28 : 2) * Math.sin((x * 0.045) - scopePhaseTick + phaseOffset);
                    p.push(`${10 + x},${y.toFixed(1)}`);
                }
                return p.join(' ');
            };

            document.getElementById('dockBody').innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
                    <span style="color:#facc15;font-weight:800;">تيار الحمل: ${latestA.toFixed(2)} A</span>
                    <span style="color:#38bdf8;font-weight:800;">التردد: ${hz} Hz | الجهد: ${anyMot ? '398 V' : '0 V'}</span>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div style="background:#020617;border:1px solid #1e293b;border-radius:8px;padding:6px;">
                        <div style="font-size:0.68rem;color:#94a3b8;margin-bottom:3px;">منحنى تيار الإقلاع والحمل (A)</div>
                        <svg width="100%" height="90" viewBox="0 0 375 90" style="direction:ltr;">
                            <line x1="12" y1="25" x2="365" y2="25" stroke="#1e293b" stroke-dasharray="3 3"/>
                            <line x1="12" y1="78" x2="365" y2="78" stroke="#334155"/>
                            <polyline fill="none" stroke="#10b981" stroke-width="2.5" points="${pts}"/>
                        </svg>
                    </div>
                    <div style="background:#020617;border:1px solid #1e293b;border-radius:8px;padding:6px;">
                        <div style="font-size:0.68rem;color:#94a3b8;margin-bottom:3px;">موجات الـ 3 فاز (L1 أحمر | L2 أصفر | L3 أزرق)</div>
                        <svg width="100%" height="90" viewBox="0 0 360 84" style="direction:ltr;">
                            <line x1="10" y1="42" x2="350" y2="42" stroke="#334155"/>
                            <polyline fill="none" stroke="#ef4444" stroke-width="2" points="${buildSine(0)}"/>
                            <polyline fill="none" stroke="#eab308" stroke-width="2" points="${buildSine(2.094)}"/>
                            <polyline fill="none" stroke="#3b82f6" stroke-width="2" points="${buildSine(4.188)}"/>
                        </svg>
                    </div>
                </div>`;
        }

        function renderChallengesDock() {
            document.getElementById('dockTitle').textContent = 'مختبر تحديات الأعطال الصناعية (Troubleshooting Lab)';
            document.getElementById('dockBody').innerHTML = `
                <div id="challengeStatusBanner" style="margin-bottom:9px;font-size:0.78rem;color:#38bdf8;">اختر تحدياً جاهزاً أو ولّد عطلاً عشوائياً في اللوحة ثم قم بإصلاحه وتشغيل المحاكاة:</div>
                <div style="margin-bottom:10px;">
                    <button class="t-btn" style="background:#7c3aed;border:none;color:#fff;width:100%;justify-content:center;" onclick="injectRandomFault()">🎲 توليد عطل عشوائي في الدائرة الحالية (Random Fault)</button>
                </div>
                <div class="challenge-card">
                    <div><strong style="color:#facc15;">التحدي 1: المحرك لا يعمل عند الضغط على Start</strong><br><span style="color:#9ca3af;font-size:0.73rem;">دائرة DOL بها سلك مقطوع أو خطأ توصيل. اكتشفه وأصلحه!</span></div>
                    <button class="t-btn" style="background:#dc2626;border:none;color:#fff;" onclick="loadChallenge(1)">ابدأ التحدي</button>
                </div>
                <div class="challenge-card">
                    <div><strong style="color:#facc15;">التحدي 2: قصر كهربائي (Short Circuit) يفصل القاطع</strong><br><span style="color:#9ca3af;font-size:0.73rem;">أحد الفنيين ربط الفاز مع النيوترال بالخطأ. احذف السلك المسبب للقصر!</span></div>
                    <button class="t-btn" style="background:#dc2626;border:none;color:#fff;" onclick="loadChallenge(2)">ابدأ التحدي</button>
                </div>`;
        }

        function injectRandomFault() {
            if (!nodes.length || !wires.length) {
                alert('ابنِ دائرة أولاً (أو اختر أحد القوالب من المساعد الذكي) ليتم حقن عطل عشوائي فيها!');
                return;
            }
            stopSimulation();
            const mode = Math.floor(Math.random() * 3);
            const banner = document.getElementById('challengeStatusBanner');
            if (mode === 0 && wires.length > 0) {
                const idx = Math.floor(Math.random() * wires.length);
                const removed = wires.splice(idx, 1)[0];
                activeChallengeGoal = 'FIX_OPEN';
                renderAllNodes();
                if (banner) banner.innerHTML = `<span style="color:#f59e0b;font-weight:800;">⚠️ عطل عشوائي: انقطع أحد الأسلاك عن الطرف [${removed.toPort}]! افحص التوصيلات وأعد ربطه.</span>`;
            } else if (mode === 1) {
                const sup = nodes.find(n => n.type === 'SUPPLY_3P' || n.type === 'MCB_3P');
                if (sup) {
                    connectPorts(sup.id, sup.type === 'SUPPLY_3P' ? 'L1' : '2', sup.id, sup.type === 'SUPPLY_3P' ? 'N' : 'N2', '#ef4444', '1.5');
                    activeChallengeGoal = 'FIX_SHORT';
                    if (banner) banner.innerHTML = `<span style="color:#ef4444;font-weight:800;">⚠️ عطل عشوائي: حدث قصر كهربائي في اللوحة! اضغط تشغيل لتحديد السلك المسبب للقصر واحذفه.</span>`;
                }
            } else {
                let olr = nodes.find(n => n.type === 'OVERLOAD');
                if (!olr) olr = spawnComponent('OVERLOAD', 250, 260, '-F2');
                olr.swState = true;
                activeChallengeGoal = 'FIX_OLR';
                renderAllNodes();
                if (banner) banner.innerHTML = `<span style="color:#fb923c;font-weight:800;">⚠️ عطل عشوائي: فصل الأوفرلود الحراري (${olr.tag})! انقر عليه لإعادة ضبطه (Reset).</span>`;
            }
        }

        function loadChallenge(num) {
            activeChallengeGoal = num;
            buildPresetCircuit('dol');
            wires.pop();
            if (num === 2) {
                const n1 = nodes[0], n2 = nodes[1];
                if (n1 && n2) connectPorts(n1.id, 'L1', n2.id, 'N1', '#ef4444', '1.5');
            }
            renderAllNodes();
            const b = document.getElementById('challengeStatusBanner');
            if (b) b.innerHTML = `<span style="color:#f59e0b;font-weight:800;">⚠️ تم تحميل التحدي ${num}! افحص الأسلاك ثم اضغط تشغيل.</span>`;

        function executeAiPrompt() {
            const txt = (document.getElementById('aiPromptInput').value || '').toLowerCase();

            else if (txt.includes('ats') || txt.includes('مولد') || txt.includes('تحويل')) buildPresetCircuit('ats');
            else if (txt.includes('ستار') || txt.includes('دلتا') || txt.includes('star')) buildPresetCircuit('stardelta');
            else if (txt.includes('عكس') || txt.includes('اتجاهين') || txt.includes('rev')) buildPresetCircuit('rev');
            else if (txt.includes('vfd') || txt.includes('سرعة')) buildPresetCircuit('vfd');
            else if (txt.includes('plc') || txt.includes('خزان')) buildPresetCircuit('plc');
            else if (txt.includes('اردوينو') || txt.includes('arduino')) buildPresetCircuit('arduino');
            else buildPresetCircuit('dol');
        }
