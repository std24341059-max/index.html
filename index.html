        function analyzeCurrentCircuitAI() {
            const box = document.getElementById('aiGuideOutput');
            if (!box) return;
            box.style.display = 'block';
            if (nodes.length === 0) {
                box.innerHTML = `<strong style="color:#f59e0b;">تقرير الفحص الذكي:</strong> اللوحة فارغة حالياً! أضف عناصر من القائمة أو اختر أحد القوالب الجاهزة أعلاه.`;
                return;
            }
            let report = [];
            const hasSupply = nodes.some(n => ['SUPPLY_3P', 'ATS_GRID', 'ATS_GEN', 'ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type));
            if (!hasSupply) report.push('❌ <strong>نقص مصدر التغذية:</strong> لا يوجد مصدر طاقة (3~ 400V أو وطنية/مولدة) في اللوحة.');
            
            nodes.filter(n => n.type.startsWith('KM_')).forEach(km => {
                const hasA1 = wires.some(w => (w.fromNode === km.id && w.fromPort === 'A1') || (w.toNode === km.id && w.toPort === 'A1'));
                const hasA2 = wires.some(w => (w.fromNode === km.id && w.fromPort === 'A2') || (w.toNode === km.id && w.toPort === 'A2'));
                if (!hasA1 || !hasA2) report.push(`⚠️ <strong>ملف الكونتاكتور (${km.tag}):</strong> غير مكتمل التوصيل! تأكد من ربط طرفي الملف <strong>A1</strong> و <strong>A2</strong>.`);
            });

            nodes.filter(n => n.type.startsWith('MOTOR_')).forEach(m => {
                const motorWires = wires.filter(w => w.fromNode === m.id || w.toNode === m.id).length;
                if (motorWires < 3) report.push(`⚠️ <strong>المحرك (${m.tag}):</strong> موصول بـ (${motorWires}) أسلاك فقط! المحرك الثلاثي يحتاج 3 أطوار (U1, V1, W1).`);
            });

            if (wires.length === 0) report.push('⚠️ <strong>لا توجد أسلاك:</strong> اضغط على زر <strong>توصيل تلقائي</strong> في الأعلى أو صل البراغي يدوياً.');

            if (report.length === 0) {
                box.innerHTML = `<strong style="color:#10b981;">✅ تقرير الفحص الذكي ممتاز:</strong> جميع العناصر الأساسية ومصادر التغذية وملفات الكونتاكتورات موصولة بشكل سليم. اضغط على زر <strong>تشغيل</strong> في الأعلى لتجربة الدائرة!`;
            } else {
                box.innerHTML = `<strong style="color:#38bdf8;">🔍 نتيجة تحليل الذكاء الاصطناعي لدائرتك:</strong><br>` + report.join('<br>');
            }
        }

            if ((q.includes('ats') || q.includes('تحويل') || q.includes('خط')) && (q.includes('3') || q.includes('ثلاث'))) buildPresetCircuit('ats_3line');
            else if (q.includes('ats') || q.includes('مولد') || q.includes('وطني') || q.includes('تحويل')) buildPresetCircuit('ats');
            else if (q.includes('عكس') || q.includes('rev')) buildPresetCircuit('rev_motor');
            else if (q.includes('أردوينو') || q.includes('arduino') || q.includes('pt100') || q.includes('حرار')) buildPresetCircuit('arduino_pt100');
            else if (q.includes('plc') || q.includes('خزان') || q.includes('مضخ')) buildPresetCircuit('plc_tank');

        }

                guideHtml = `<strong style="color:#f59e0b;">دائرة ستار / دلتا:</strong> اضغط <strong>-S1</strong> للبدء بوضع <strong>STAR Y</strong> ثم التحول إلى <strong>DELTA Δ</strong>.`;
            } else if (key === 'rev_motor') {
                const sup = spawnComponent('SUPPLY_3P', 50, 60, '-G1'), mcb = spawnComponent('MCB_3P', 50, 190, '-Q1'), km1 = spawnComponent('KM_3P_38A', 50, 320, '-KM1'), km2 = spawnComponent('KM_3P_38A', 195, 320, '-KM2'), s1 = spawnComponent('BTN_START', 195, 180, '-S1'), s2 = spawnComponent('BTN_START', 320, 180, '-S2'), mot = spawnComponent('MOTOR_SD', 125, 450, '-M1');
                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444'); connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308'); connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6'); connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8');
                connectPorts(mcb.id, '2', km1.id, 'L1', '#ef4444'); connectPorts(mcb.id, '4', km1.id, 'L2', '#eab308'); connectPorts(mcb.id, '6', km1.id, 'L3', '#3b82f6');
                connectPorts(mcb.id, '2', km2.id, 'L3', '#ef4444'); connectPorts(mcb.id, '4', km2.id, 'L2', '#eab308'); connectPorts(mcb.id, '6', km2.id, 'L1', '#3b82f6');
                connectPorts(km1.id, 'T1', mot.id, 'U1', '#ef4444'); connectPorts(km1.id, 'T2', mot.id, 'V1', '#eab308'); connectPorts(km1.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(km2.id, 'T1', mot.id, 'U1', '#3b82f6'); connectPorts(km2.id, 'T2', mot.id, 'V1', '#eab308'); connectPorts(km2.id, 'T3', mot.id, 'W1', '#ef4444');
                connectPorts(s1.id, '4', km1.id, 'A1', '#10b981'); connectPorts(mcb.id, 'N2', km1.id, 'A2', '#38bdf8');
                connectPorts(s2.id, '4', km2.id, 'A1', '#f59e0b'); connectPorts(mcb.id, 'N2', km2.id, 'A2', '#38bdf8');
                guideHtml = `<strong style="color:#38bdf8;">عكس حركة محرك 3 فاز:</strong> اضغط <strong>-S1</strong> للدوران يميناً أو <strong>-S2</strong> لعكس الطورين والدوران يساراً.`;
            } else if (key === 'plc_tank') {
                const s1 = spawnComponent('BTN_START', 35, 50, '-S1'), s0 = spawnComponent('BTN_STOP', 145, 50, '-S0'), lt = spawnComponent('TX_LEVEL_420', 260, 42, '-LT1'), plc = spawnComponent('PLC_14IO', 110, 190, '-KF1'), rly = spawnComponent('RELAY_2CO', 55, 320, '-K1'), pump = spawnComponent('PUMP_1P', 225, 330, '-P1');
                connectPorts(s1.id, '4', plc.id, 'I0.0', '#10b981'); connectPorts(s0.id, '2', plc.id, 'I0.1', '#ef4444'); connectPorts(lt.id, 'OUT', plc.id, 'IW64', '#06b6d4');
                connectPorts(plc.id, 'Q0.0', rly.id, 'A1', '#eab308'); connectPorts(plc.id, '0V', rly.id, 'A2', '#38bdf8'); connectPorts(rly.id, '14', pump.id, 'L', '#f59e0b'); connectPorts(rly.id, '0V', pump.id, 'N', '#38bdf8');
                guideHtml = `<strong style="color:#38bdf8;">منظومة MINI PLC (-KF1):</strong> اضغط <strong>-S1</strong> للتشغيل، أو المس الحساس <strong>-LT1</strong> لضبط المنسوب.`;
            } else if (key === 'arduino_pt100') {
                const ard = spawnComponent('ARDUINO_UNO', 110, 55, '-A1'), tt1 = spawnComponent('TX_TEMP', 120, 195, '-TT1'), lcd = spawnComponent('LCD_I2C', 265, 65, '-LCD1'), rel = spawnComponent('RELAY_5V', 55, 345, '-K1'), srv = spawnComponent('SERVO_MOTOR', 225, 345, '-SRV1');
                connectPorts(ard.id, '5V', tt1.id, '24V', '#ef4444'); connectPorts(tt1.id, 'OUT', ard.id, 'A0', '#f59e0b'); connectPorts(ard.id, 'D7', rel.id, 'IN', '#eab308'); connectPorts(ard.id, 'D9', srv.id, 'PWM', '#38bdf8'); connectPorts(ard.id, '5V', lcd.id, 'VCC', '#10b981');
                guideHtml = `<strong style="color:#0284c7;">منظومة Arduino + PT100 (-TT1):</strong> المس رأس الحساس الأزرق <strong>-TT1</strong> لتغيير درجة الحرارة!`;
            }

            if (guideBox && guideHtml) { guideBox.innerHTML = guideHtml; guideBox.style.display = 'block'; }
            saveToLocalStorage();
            setTimeout(() => { fitToScreen(); toggleSimulation(); }, 70);
        }

        function clearWorkspace() {
            stopSimulation(); saveHistory(); nodes = []; wires = []; closePropBar(); renderAllNodes(); resetZoom();
            try { localStorage.removeItem(STORAGE_KEY); window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildPalette();
            setupCanvasPanAndPinch();
            const restored = loadFromUrlOrStorage();
            if (!restored) buildPresetCircuit('plc_tank');
            else setTimeout(() => { fitToScreen(); toggleSimulation(); }, 80);
        });
    </script>
