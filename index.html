<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltAI Studio Pro | محاكي الكلاسيك كنترول والـ PLC والأردوينو</title>
    <style>
        :root {
            --bg-canvas: #090b0f;
            --grid-dot: #1f2630;
            --panel-bg: #11151c;
            --panel-border: #232a36;
            --accent: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-canvas);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .svg-ic {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
        }

        /* Responsive Top Toolbar */
        .top-bar {
            min-height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            gap: 5px;
            z-index: 100;
        }

        .brand-group, .sim-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .back-voltai-btn {
            background: rgba(59, 130, 246, 0.14);
            border: 1px solid rgba(59, 130, 246, 0.45);
            color: #60a5fa;
            height: 34px;
            padding: 0 9px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            cursor: pointer;
        }

        .t-btn {
            background: #191f2a;
            border: 1px solid #2c3545;
            color: var(--text-main);
            height: 34px;
            padding: 0 9px;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .t-btn:hover { border-color: var(--accent-blue); }
        .t-btn.run-active { background: var(--accent); color: #042f2e; border-color: var(--accent); }
        .t-btn.ai-magic {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            color: #fff;
            box-shadow: 0 0 14px rgba(124, 58, 237, 0.4);
        }

        /* Main Studio Body */
        .studio-body {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Categorized Component Sidebar */
        .comp-sidebar {
            width: 295px;
            background: rgba(17, 21, 28, 0.99);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 80;
            flex-shrink: 0;
        }
        .comp-sidebar.collapsed {
            display: none !important;
        }

        @media (max-width: 768px) {
            .comp-sidebar {
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 84%;
                max-width: 310px;
                box-shadow: -12px 0 30px rgba(0, 0, 0, 0.85);
            }
        }

        .search-wrap {
            padding: 8px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-input-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: #090b0f;
            border: 1px solid #2c3545;
            border-radius: 8px;
            padding: 0 8px;
            color: #9ca3af;
        }
        .search-input-box:focus-within { border-color: var(--accent); }
        .search-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 6px;
            font-size: 0.79rem;
            outline: none;
        }

        .close-sidebar-btn {
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.45);
            color: #f87171;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .cat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .cat-group { margin-bottom: 6px; }
        .cat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: #161b24;
            border-radius: 8px;
            font-size: 0.79rem;
            font-weight: 800;
            color: #e5e7eb;
            cursor: pointer;
            user-select: none;
        }
        .cat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 7px;
        }
        .cat-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 5px 2px;
        }
        .cat-items.closed { display: none; }

        .palette-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.77rem;
            color: #d1d5db;
            transition: all 0.15s;
        }
        .palette-item:hover {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.45);
            color: #fff;
        }
        .palette-thumb {
            width: 38px;
            height: 34px;
            background: #0b0e14;
            border: 1px solid #262f3d;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            padding: 2px;
        }
        .palette-thumb svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Dot-Grid Workspace */
        .canvas-area {
            flex: 1;
            position: relative;
            background-color: var(--bg-canvas);
            background-image: radial-gradient(var(--grid-dot) 1.3px, transparent 1.3px);
            background-size: 22px 22px;
            overflow: hidden;
            touch-action: none;
        }

        /* Wires sit cleanly behind component bodies (z-index: 15 < 20) */
        #wiresSvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        .wire-stroke {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: stroke;
            cursor: pointer;
            transition: stroke-width 0.15s;
        }
        .wire-stroke:hover { stroke-width: 6 !important; }

        @keyframes currentFlow { to { stroke-dashoffset: -20; } }
        .wire-energized {
            stroke-dasharray: 7 3;
            animation: currentFlow 0.45s linear infinite;
            filter: drop-shadow(0 0 4px currentColor);
        }

        @keyframes faultBlink {
            0%, 100% { stroke: #ef4444; stroke-width: 5; }
            50% { stroke: #fde047; stroke-width: 7; }
        }
        .wire-shorted { animation: faultBlink 0.35s infinite; }

        /* Realistic Placed Industrial Components */
        .sim-node {
            position: absolute;
            z-index: 20;
            user-select: none;
            touch-action: none;
        }
        .node-body {
            position: relative;
            background: linear-gradient(180deg, #1b222e 0%, #121720 100%);
            border: 1.5px solid #334155;
            border-radius: 7px;
            padding: 13px 8px 12px;
            min-width: 104px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .node-tag {
            font-size: 0.62rem;
            font-weight: 800;
            color: #cbd5e1;
            background: #0b0e14;
            border: 1px solid #293241;
            padding: 1px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .node-del {
            position: absolute;
            top: 3px;
            left: 4px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            border-radius: 4px;
            color: #94a3b8;
            width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .node-del:hover { color: var(--danger); border-color: var(--danger); }

        /* Realistic Brass/Steel Screw Terminals */
        .term-port {
            position: absolute;
            width: 13px;
            height: 13px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e2e8f0, #64748b 65%, #1e293b 100%);
            border: 1.5px solid #0f172a;
            box-shadow: 0 0 0 1.5px #475569;
            cursor: crosshair;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .term-port::after {
            content: '';
            width: 7px;
            height: 1.6px;
            background: #0f172a;
            transform: rotate(-35deg);
        }
        .term-port:hover, .term-port.active-pin {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            transform: translate(-50%, -50%) scale(1.38);
        }
        .term-lbl {
            position: absolute;
            font-size: 0.53rem;
            font-weight: 800;
            color: #94a3b8;
            background: rgba(9, 11, 15, 0.85);
            padding: 0 2px;
            border-radius: 2px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Realistic Metallic Bezel Pushbuttons & Switches */
        .bezel-ring {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(145deg, #cbd5e1, #475569);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            margin: 2px 0;
        }
        .push-actuator {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #0f172a;
            cursor: pointer;
            transition: transform 0.08s, box-shadow 0.1s;
        }
        .push-actuator:active { transform: scale(0.88); }

        .toggle-pill {
            background: linear-gradient(180deg, #1e293b, #0f172a);
            border: 1px solid #475569;
            color: #38bdf8;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        @keyframes spinRotor {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .rotor-spinning {
            transform-origin: 42px 32px;
            animation: spinRotor 0.5s linear infinite;
        }

        /* Floating Wire Color Picker */
        .floating-wire-bar {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(17, 21, 28, 0.94);
            border: 1px solid var(--panel-border);
            padding: 5px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 70;
        }
        .w-color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .w-color-dot.active { border-color: #fff; transform: scale(1.16); }

        /* Fault Banner */
        .fault-toast {
            position: absolute;
            top: 48px;
            left: 8px;
            max-width: 380px;
            background: rgba(127, 29, 29, 0.96);
            border: 1px solid #ef4444;
            color: #fecaca;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            line-height: 1.55;
            z-index: 90;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.65);
        }

        /* Bottom Dock Tabs */
        .bottom-dock {
            position: absolute;
            bottom: 46px;
            left: 10px;
            right: 10px;
            max-width: 780px;
            height: 270px;
            background: rgba(17, 21, 28, 0.98);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            z-index: 85;
            display: none;
            flex-direction: column;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.75);
            overflow: hidden;
        }
        .bottom-dock.open { display: flex; }

        .dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #161b24;
            border-bottom: 1px solid var(--panel-border);
            font-size: 0.81rem;
            font-weight: 800;
        }
        .dock-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.81rem;
        }

        /* Bottom Bar */
        .bottom-bar {
            height: 44px;
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            gap: 6px;
            overflow-x: auto;
            z-index: 95;
        }
        .dock-trigger {
            background: #191f2a;
            border: 1px solid #2c3545;
            color: #d1d5db;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .dock-trigger.active {
            background: rgba(16, 185, 129, 0.16);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Ladder Rung */
        .ladder-rung {
            background: #090b0f;
            border: 1px solid #232a36;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            font-size: 0.78rem;
        }
        .rung-live {
            border-color: #10b981;
            box-shadow: inset 3px 0 0 #10b981;
        }
        .rung-title { color: #9ca3af; font-size: 0.71rem; margin-bottom: 4px; }
        .rung-wire { color: #64748b; font-weight: bold; }
        .rung-live .rung-wire { color: #10b981; }
    </style>
</head>
<body>

    <!-- Top Bar with Clean SVG Icons -->
    <header class="top-bar">
        <div class="brand-group">
            <button class="t-btn" id="btnToggleSidebar" onclick="toggleSidebar()" title="إظهار/إخفاء العناصر">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                <span>العناصر (77)</span>
            </button>
            <button class="back-voltai-btn" onclick="goBackToVoltAI()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>VoltAI Pro</span>
            </button>
        </div>

        <div class="sim-controls">
            <button class="t-btn" id="btnRunSim" onclick="toggleSimulation()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>تشغيل</span>
            </button>
            <button class="t-btn" onclick="stopSimulation()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                <span>إيقاف</span>
            </button>
            <button class="t-btn" onclick="runFaultDiagnostics()">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>كاشف الأعطال</span>
            </button>
            <button class="t-btn ai-magic" onclick="openDock('ai')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                <span>الذكاء الاصطناعي</span>
            </button>
            <button class="t-btn" onclick="clearWorkspace()" title="مسح اللوحة">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
        </div>
    </header>

    <div class="studio-body">
        <!-- Categorized 77-Item Sidebar -->
        <aside class="comp-sidebar" id="compSidebar">
            <div class="search-wrap">
                <div class="search-input-box">
                    <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="compSearch" placeholder="ابحث (PLC، كونتاكتور، أردوينو...)" onkeyup="filterPalette()">
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()" title="إغلاق القائمة">
                    <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="cat-scroll" id="paletteContainer"></div>
        </aside>

        <!-- Main Dot-Grid Workspace -->
        <main class="canvas-area" id="canvasArea" onclick="cancelWiring()">
            <svg id="wiresSvg"></svg>

            <!-- Wire Color Selector -->
            <div class="floating-wire-bar" onclick="event.stopPropagation()">
                <svg class="svg-ic" style="color:#9ca3af;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6 4 4 6-6"/></svg>
                <span style="font-size:0.71rem;color:#9ca3af;font-weight:700;">السلك:</span>
                <div class="w-color-dot active" style="background:#ef4444;" title="L1 / حار" onclick="setWireColor('#ef4444', this)"></div>
                <div class="w-color-dot" style="background:#eab308;" title="L2" onclick="setWireColor('#eab308', this)"></div>
                <div class="w-color-dot" style="background:#3b82f6;" title="L3 / +24V" onclick="setWireColor('#3b82f6', this)"></div>
                <div class="w-color-dot" style="background:#38bdf8;" title="Neutral / 0V" onclick="setWireColor('#38bdf8', this)"></div>
                <div class="w-color-dot" style="background:#10b981;" title="Earth / PE" onclick="setWireColor('#10b981', this)"></div>
                <span id="wiringHint" style="font-size:0.71rem;color:#f59e0b;margin-right:4px;"></span>
            </div>

            <!-- Live Fault Detector Alert -->
            <div class="fault-toast" id="faultToast" onclick="event.stopPropagation()"></div>

            <!-- Bottom Dock -->
            <div class="bottom-dock" id="bottomDock" onclick="event.stopPropagation()">
                <div class="dock-header">
                    <span id="dockTitle" style="display:flex;align-items:center;gap:6px;">المساعد الهندسي الذكي</span>
                    <button onclick="closeDock()" style="background:none;border:none;color:#9ca3af;cursor:pointer;padding:2px 6px;display:flex;align-items:center;">
                        <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="dock-content" id="dockBody"></div>
            </div>
        </main>
    </div>

    <!-- Bottom Mode Bar with Clean SVG Icons -->
    <footer class="bottom-bar">
        <div style="display:flex;gap:6px;">
            <button class="dock-trigger" id="trig-ai" onclick="openDock('ai')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
                <span>الذكاء الاصطناعي</span>
            </button>
            <button class="dock-trigger" id="trig-process" onclick="openDock('process')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                <span>خزان المياه ومحطة الصرف</span>
            </button>
            <button class="dock-trigger" id="trig-plc" onclick="openDock('plc')">
                <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="15" x2="17" y2="15"/></svg>
                <span>محرر PLC Ladder</span>
            </button>
            <button class="dock-trigger" id="trig-arduino" onclick="openDock('arduino')">

        /* =========================================================
           2. WORKSPACE STATE, PALETTE BUILDER & ORTHOGONAL WIRING

        let nodes = [];
        let wires = [];
        let nodeSeq = 0;
        let pendingPort = null;
        let currentWireColor = '#ef4444';
        let isRunning = false;
        let simInterval = null;

        let tankLevel = 49;
        let outletOpen = true;
        let sewageLevel = 58;
        let activeSewagePumps = 0;

        let plcAutoLatch = false;
        let customLadderRungs = [];
        let arduinoCode = `// مشروع أردوينو للتحكم الأوتوماتيكي بالمضخة والسيرفو
#include <Servo.h>
Servo valveServo;

const int sensorPin = A0;  // حساس المستوى / مقاومة متغيرة
const int relayPin  = 7;   // مخرج الريليه 5V (D7)
const int servoPin  = 9;   // مخرج محرك السيرفو (D9)

void setup() {
  pinMode(relayPin, OUTPUT);
  valveServo.attach(servoPin);
  Serial.begin(9600);
}

void loop() {
  int level = analogRead(sensorPin);
  if (level < 40) {
    digitalWrite(relayPin, HIGH); // تشغيل المضخة
    valveServo.write(90);         // فتح الصمام
  } else if (level >= 85) {
    digitalWrite(relayPin, LOW);  // إيقاف المضخة
    valveServo.write(0);          // إغلاق الصمام
  }
  delay(200);
}`;

        function goBackToVoltAI() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                alert('أنت الآن في تطبيق المحاكي المستقل VoltAI Studio Pro.');

        }

        function buildPalette() {
            const container = document.getElementById('paletteContainer');
            if (!container) return;
            container.innerHTML = '';
            CATEGORIES.forEach((cat, idx) => {
                const grp = document.createElement('div');
                grp.className = 'cat-group';
                grp.innerHTML = `
                    <div class="cat-header" onclick="this.nextElementSibling.classList.toggle('closed')">
                        <span><span class="cat-dot" style="background:${cat.color};"></span>${cat.name}</span>
                        <span style="color:#9ca3af;font-size:0.74rem;display:inline-flex;align-items:center;gap:4px;">
                            ${cat.items.length}
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
                        </span>
                    </div>
                    <div class="cat-items ${idx > 3 ? 'closed' : ''}">
                        ${cat.items.map(it => `
                            <div class="palette-item" data-label="${it.label}" onclick="spawnFromPalette('${it.type}')">
                                <div class="palette-thumb">${it.render({ id: 'prev' })}</div>
                                <span>${it.label}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(grp);
            });
        }

        function spawnFromPalette(type) {
            spawnComponent(type);
            if (window.innerWidth <= 768) {
                document.getElementById('compSidebar').classList.add('collapsed');
            }
        }

        function filterPalette() {
            const q = document.getElementById('compSearch').value.trim().toLowerCase();
            document.querySelectorAll('.cat-items').forEach(list => {
                if (q.length > 0) list.classList.remove('closed');
            });
            document.querySelectorAll('.palette-item').forEach(el => {
                const match = el.getAttribute('data-label').toLowerCase().includes(q);
                el.style.display = match ? 'flex' : 'none';
            });
        }

        function toggleSidebar() {
            const sb = document.getElementById('compSidebar');
            if (sb) sb.classList.toggle('collapsed');
        }

        function setWireColor(hex, dot) {
            currentWireColor = hex;
            document.querySelectorAll('.w-color-dot').forEach(d => d.classList.remove('active'));
            if (dot) dot.classList.add('active');
        }

        function getCompDef(type) {
            for (const c of CATEGORIES) {
                const found = c.items.find(i => i.type === type);
                if (found) return found;
            }
            return null;
        }

        function spawnComponent(type, customX, customY, customTag) {
            const def = getCompDef(type);
            if (!def) return null;
            nodeSeq++;
            const id = 'node_' + nodeSeq;
            const area = document.getElementById('canvasArea');
            const maxW = Math.max(140, (area.clientWidth || 360) - 130);
            const maxH = Math.max(140, (area.clientHeight || 500) - 160);
            const x = customX !== undefined ? customX : 35 + ((nodeSeq * 36) % maxW);
            const y = customY !== undefined ? customY : 58 + ((nodeSeq * 34) % maxH);

            const node = {
                id, type, x, y,
                tag: customTag || (type.split('_')[0] + '-' + nodeSeq),
                pressed: false, swState: false, selPos: 0, analogVal: 50,
                timerSec: 5.0, timerDone: false, energized: false, running: false,
                tripped: false, sdMode: '3~ MOT', reading: '0.00 A', voltVal: '398 V',
                ampVal: '0.0 A', q0: false, q1: false, d7: false, servoOn: false, lcdText: 'VoltAI Ready'
            };
            nodes.push(node);
            renderAllNodes();
            return node;
        }

        function renderAllNodes() {
            const area = document.getElementById('canvasArea');
            area.querySelectorAll('.sim-node').forEach(el => el.remove());

            nodes.forEach(node => {
                const def = getCompDef(node.type);
                if (!def) return;
                const el = document.createElement('div');
                el.className = 'sim-node';
                el.id = node.id;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';

                const portsHtml = def.ports.map(p => {
                    const isTop = p.y < 50;
                    return `
                        <div class="term-port" style="left:${p.x}px;top:${p.y}px;"
                             onclick="handlePortClick(event, '${node.id}', '${p.id}')">
                            <span class="term-lbl" style="${isTop ? 'top:-13px;' : 'bottom:-13px;'}">${p.id}</span>
                        </div>
                    `;
                }).join('');

                el.innerHTML = `
                    <div class="node-body">
                        <button class="node-del" onclick="deleteNode(event, '${node.id}')" title="حذف">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                        <div class="node-tag">${node.tag}</div>
                        ${def.render(node)}
                        ${portsHtml}
                    </div>
                `;

                enableDrag(el, node);
                area.appendChild(el);
            });
            drawWires();
        }

        function enableDrag(el, node) {
            let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
            el.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.term-port') ||
                    e.target.closest('.push-actuator') ||
                    e.target.closest('.toggle-pill') ||
                    e.target.tagName === 'INPUT' ||
                    e.target.tagName === 'BUTTON') return;
                dragging = true;
                sx = e.clientX; sy = e.clientY;
                ox = node.x; oy = node.y;
                try { el.setPointerCapture(e.pointerId); } catch (err) {}
            });
            el.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                node.x = Math.max(10, ox + (e.clientX - sx));
                node.y = Math.max(46, oy + (e.clientY - sy));
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                drawWires();
            });
            el.addEventListener('pointerup', (e) => {
                if (dragging) {
                    dragging = false;
                    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
                }
            });
        }

        function deleteNode(ev, id) {
            ev.stopPropagation();
            nodes = nodes.filter(n => n.id !== id);
            wires = wires.filter(w => w.fromNode !== id && w.toNode !== id);
            cancelWiring();
            renderAllNodes();
        }

        function handlePortClick(ev, nodeId, portId) {
            ev.stopPropagation();
            if (!pendingPort) {
                pendingPort = { nodeId, portId };
                ev.currentTarget.classList.add('active-pin');
                document.getElementById('wiringHint').textContent = `اختر الطرف الثاني من [${portId}]...`;
                return;
            }
            if (pendingPort.nodeId === nodeId && pendingPort.portId === portId) {
                cancelWiring();
                return;
            }
            connectPorts(pendingPort.nodeId, pendingPort.portId, nodeId, portId, currentWireColor);
            cancelWiring();
        }

        function connectPorts(fromNode, fromPort, toNode, toPort, color) {
            const dup = wires.some(w =>
                (w.fromNode === fromNode && w.fromPort === fromPort && w.toNode === toNode && w.toPort === toPort) ||
                (w.fromNode === toNode && w.fromPort === toPort && w.toNode === fromNode && w.toPort === fromPort)
            );
            if (!dup) {
                wires.push({
                    id: 'w_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    fromNode, fromPort, toNode, toPort,
                    color: color || '#ef4444', live: false, shorted: false
                });
                drawWires();
            }
        }

        function cancelWiring() {
            pendingPort = null;
            document.querySelectorAll('.term-port.active-pin').forEach(p => p.classList.remove('active-pin'));
            document.getElementById('wiringHint').textContent = '';
        }

        function getPortXY(nodeId, portId) {
            const node = nodes.find(n => n.id === nodeId);
            if (!node) return null;
            const def = getCompDef(node.type);
            if (!def) return null;
            const port = def.ports.find(p => p.id === portId);
            if (!port) return null;
            return { x: node.x + port.x, y: node.y + port.y };
        }

        function drawWires() {
            const svg = document.getElementById('wiresSvg');
            if (!svg) return;
            svg.innerHTML = '';
            wires.forEach(w => {
                const p1 = getPortXY(w.fromNode, w.fromPort);
                const p2 = getPortXY(w.toNode, w.toPort);
                if (!p1 || !p2) return;

                const midY = Math.round((p1.y + p2.y) / 2);
                const d = `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', d);
                path.setAttribute('stroke', w.color);
                path.setAttribute('stroke-width', '3.1');
                path.classList.add('wire-stroke');
                if (w.live) path.classList.add('wire-energized');
                if (w.shorted) path.classList.add('wire-shorted');
                path.onclick = (e) => {
                    e.stopPropagation();
                    wires = wires.filter(item => item.id !== w.id);
                    drawWires();
                };
                svg.appendChild(path);
            });
        }

        /* =========================================================
           3. INTERACTIVE CONTROLS, FAULT DETECTOR & LIVE LOGIC ENGINE
           ========================================================= */
        function pressButton(nodeId, state) {
            const n = nodes.find(x => x.id === nodeId);
            if (!n) return;
            n.pressed = state;
            if (isRunning) evaluateCircuitStep();
            renderAllNodes();
        }

        function toggleSwitchState(nodeId) {
            const n = nodes.find(x => x.id === nodeId);
            if (!n) return;
            n.swState = !n.swState;
            if (isRunning) evaluateCircuitStep();
            renderAllNodes();
        }

        function cycleSelector(nodeId, maxSteps) {
            const n = nodes.find(x => x.id === nodeId);
            if (!n) return;
            n.selPos = ((n.selPos || 0) + 1) % maxSteps;
            if (isRunning) evaluateCircuitStep();
            renderAllNodes();
        }

        function setAnalogVal(nodeId, val) {
            const n = nodes.find(x => x.id === nodeId);
            if (!n) return;
            n.analogVal = parseInt(val, 10) || 0;
            tankLevel = n.analogVal;

        function toggleSimulation() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btnRunSim').classList.add('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: المحاكاة الحية تعمل (Online)';
            runFaultDiagnostics();
            simInterval = setInterval(evaluateCircuitStep, 250);
        }

        function stopSimulation() {
            isRunning = false;
            clearInterval(simInterval);
            plcAutoLatch = false;
            document.getElementById('btnRunSim').classList.remove('run-active');
            document.getElementById('simStatusText').textContent = 'الوضع: متوقف | 77 عنصر جاهز';
            document.getElementById('faultToast').style.display = 'none';
            nodes.forEach(n => {
                n.energized = false; n.running = false; n.tripped = false;
                n.timerSec = 5.0; n.timerDone = false; n.sdMode = '3~ MOT';
                n.q0 = false; n.q1 = false; n.d7 = false; n.servoOn = false;
                n.reading = '0.00 A'; n.ampVal = '0.0 A';
            });
            wires.forEach(w => { w.live = false; w.shorted = false; });
            renderAllNodes();
        }

        function runFaultDiagnostics() {
            const toast = document.getElementById('faultToast');
            let faults = [];

            const hotNames = ['L1', 'L2', 'L3', '1', '3', '5', 'L'];
            const neutralNames = ['N', 'N1', 'N2', 'GND', '0V'];
            wires.forEach(w => {
                w.shorted = false;
                if ((hotNames.includes(w.fromPort) && neutralNames.includes(w.toPort)) ||
                    (neutralNames.includes(w.fromPort) && hotNames.includes(w.toPort))) {
                    w.shorted = true;
                    faults.push('<strong>قصر كهربائي مباشر (Short Circuit):</strong> تم ربط خط فاز مباشرة مع النيوترال/الأرضي! تم فصل القاطع للحماية.');
                }
            });

            nodes.filter(n => n.type === 'MOTOR_SD' || n.type === 'MOTOR_PTC').forEach(m => {
                const fedU = wires.some(w => (w.fromNode === m.id && w.fromPort === 'U1') || (w.toNode === m.id && w.toPort === 'U1'));
                const fedV = wires.some(w => (w.fromNode === m.id && w.fromPort === 'V1') || (w.toNode === m.id && w.toPort === 'V1'));
                const fedW = wires.some(w => (w.fromNode === m.id && w.fromPort === 'W1') || (w.toNode === m.id && w.toPort === 'W1'));
                const count = [fedU, fedV, fedW].filter(Boolean).length;
                if (count > 0 && count < 3) {
                    faults.push(`<strong>فقدان فاز (Phase Loss) على ${m.tag}:</strong> المحرك موصول بـ ${count} من أصل 3 فازات فقط!`);
                }
            });

            nodes.filter(n => n.type.startsWith('KM_3P')).forEach(km => {
                const hasA1 = wires.some(w => (w.fromNode === km.id && w.fromPort === 'A1') || (w.toNode === km.id && w.toPort === 'A1'));
                const hasA2 = wires.some(w => (w.fromNode === km.id && w.fromPort === 'A2') || (w.toNode === km.id && w.toPort === 'A2'));
                if (hasA1 && !hasA2) {
                    faults.push(`<strong>دائرة ملف مفتوحة (${km.tag}):</strong> الطرف A1 موصول ولكن الطرف A2 غير متصل بالنيوترال (N).`);
                }
            });

            nodes.filter(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type)).forEach(ard => {
                const dangerWire = wires.some(w =>
                    (w.fromNode === ard.id && ['L1', 'L2', 'L3', '2', '4', '6'].includes(w.toPort)) ||
                    (w.toNode === ard.id && ['L1', 'L2', 'L3', '2', '4', '6'].includes(w.fromPort))
                );
                if (dangerWire) {
                    faults.push(`<strong>خطر تلف المتحكم (${ard.tag}):</strong> تم توصيل جهد 220V/380V مباشرة بأطراف 5V/3.3V! استخدم وحدة <code>5V RELAY</code> للعزل.`);
                }
            });

            if (faults.length > 0) {
                nodes.filter(n => n.type.startsWith('MCB') || n.type === 'MPCB').forEach(b => b.tripped = true);
                toast.innerHTML = faults.join('<br>');
                toast.style.display = 'block';
            } else {
                toast.style.display = 'none';
            }
            renderAllNodes();
        }

        function evaluateCircuitStep() {
            if (wires.some(w => w.shorted)) return;

            const startBtns = nodes.filter(n => n.type === 'BTN_START' || n.type === 'BTN_DUAL');
            const stopBtn = nodes.find(n => n.type === 'BTN_STOP');
            const eStop = nodes.find(n => n.type === 'E_STOP');
            const swOn = nodes.find(n => ['SW_0_1', 'FLOAT_SW', 'LIMIT_SW', 'PROX_PNP', 'THERMOSTAT'].includes(n.type));

            const isStopped = (stopBtn && stopBtn.pressed) || (eStop && eStop.swState);
            const anyStartPressed = startBtns.some(b => b.pressed);
            const triggerActive = anyStartPressed || (swOn && swOn.swState);

            const contactors = nodes.filter(n => n.type.startsWith('KM_') || n.type.startsWith('RELAY_2') || n.type.startsWith('RELAY_4'));
            contactors.forEach((km, idx) => {
                const wired = wires.some(w => w.fromNode === km.id || w.toNode === km.id);
                if (!wired) return;
                if (isStopped) {
                    km.energized = false;
                } else if (startBtns.length > 1) {
                    const pairedBtn = startBtns[idx] || startBtns[0];
                    if (pairedBtn && pairedBtn.pressed) {
                        contactors.forEach(other => other.energized = false);
                        km.energized = true;
                    }
                } else if (triggerActive) {
                    km.energized = true;
                } else if (startBtns.length === 0 && !swOn && wires.length >= 2) {
                    km.energized = true;
                }
            });

            const anyKmEnergized = contactors.some(k => k.energized);
            nodes.filter(n => n.type === 'TIMER_RELAY').forEach(tm => {
                if (anyKmEnergized && !isStopped) {
                    if (tm.timerSec > 0) {
                        tm.timerSec = Math.max(0, tm.timerSec - 0.25);
                        tm.timerDone = (tm.timerSec === 0);
                    }
                } else {
                    tm.timerSec = 5.0;
                    tm.timerDone = false;
                }
            });

            nodes.filter(n => n.type.startsWith('PLC_')).forEach(plc => {
                if (isStopped) plcAutoLatch = false;
                if (triggerActive) plcAutoLatch = true;
                if (startBtns.length === 0 && !swOn && wires.length > 0) plcAutoLatch = true;

                if (plcAutoLatch) {
                    if (tankLevel < 40) plc.q0 = true;
                    if (tankLevel >= 90) plc.q0 = false;
                    plc.q1 = (sewageLevel > 70);
                } else {
                    plc.q0 = false;
                    plc.q1 = false;
                }
                nodes.filter(n => n.type.startsWith('RELAY_2')).forEach(r => {
                    if (wires.some(w => (w.fromNode === plc.id && w.toNode === r.id) || (w.toNode === plc.id && w.fromNode === r.id))) {
                        r.energized = plc.q0;
                    }
                });
            });

            nodes.filter(n => ['ARDUINO_UNO', 'ARDUINO_MEGA', 'ESP32_BOARD'].includes(n.type)).forEach(ard => {
                if (tankLevel < 40) ard.d7 = true;
                if (tankLevel >= 85) ard.d7 = false;
                nodes.filter(n => n.type === 'RELAY_5V').forEach(r => r.energized = ard.d7);
                nodes.filter(n => n.type === 'SERVO_MOTOR').forEach(s => s.servoOn = ard.d7);
                nodes.filter(n => n.type === 'LCD_I2C').forEach(l => l.lcdText = `Lvl:${Math.round(tankLevel)}% ${ard.d7 ? 'ON' : 'OFF'}`);
            });

            const powerActive = anyKmEnergized ||
                                nodes.some(n => n.type === 'RELAY_5V' && n.energized) ||
                                nodes.some(n => n.type.startsWith('PLC_') && n.q0);

            const timerNode = nodes.find(n => n.type === 'TIMER_RELAY');

            nodes.filter(n => ['MOTOR_SD', 'MOTOR_PTC', 'MOTOR_DC24', 'VFD_400V', 'SOFT_STARTER'].includes(n.type)).forEach(m => {
                const wired = wires.some(w => w.fromNode === m.id || w.toNode === m.id);
                m.running = wired && powerActive;
                if (m.type === 'MOTOR_SD') {
                    if (!m.running) m.sdMode = '3~ MOT';
                    else if (contactors.length === 2 && !timerNode) m.sdMode = contactors[1].energized ? 'REV' : 'FWD';
                    else m.sdMode = (timerNode && timerNode.timerDone) ? 'DELTA Δ' : 'STAR Y';
                }
            });

            nodes.filter(n => n.type === 'PUMP_1P').forEach(p => {
                const wired = wires.some(w => w.fromNode === p.id || w.toNode === p.id);
                p.running = wired && powerActive;
                if (p.running) tankLevel = Math.min(100, tankLevel + 1.5);
            });

            if (outletOpen && tankLevel > 5) {
                tankLevel = Math.max(5, tankLevel - 0.6);
            }
            activeSewagePumps = powerActive ? Math.min(4, Math.ceil(sewageLevel / 25)) : 0;

            nodes.filter(n => ['LAMP_GREEN', 'BUZZER', 'LED_220'].includes(n.type)).forEach(l => {
                const wired = wires.some(w => w.fromNode === l.id || w.toNode === l.id);
                l.energized = wired && powerActive;
            });
            nodes.filter(n => n.type === 'LAMP_RED').forEach(l => {
                const wired = wires.some(w => w.fromNode === l.id || w.toNode === l.id);
                l.energized = wired && !powerActive;
            });

            const anyMotorOn = nodes.some(n => n.running);
            nodes.filter(n => n.type === 'MULTIMETER').forEach(mm => {
                mm.reading = anyMotorOn ? (timerNode && !timerNode.timerDone ? '11.40 A' : '20.12 A') : '0.00 A';
            });
            nodes.filter(n => n.type === 'AMMETER').forEach(am => {
                am.ampVal = anyMotorOn ? '20.1 A' : '0.0 A';
            });

            wires.forEach(w => {
                w.live = powerActive || w.color === '#ef4444';
            });

            renderAllNodes();
            if (activeDock === 'process') renderProcessTank();
            if (activeDock === 'plc') renderPlcLadder();
        }

                <div style="display:flex;gap:8px;">
                    <input type="text" id="aiCircuitPrompt" placeholder="اكتب فكرة المشروع (مثال: عكس حركة محرك، تحويل تلقائي ATS، ستار دلتا، أردوينو، خزان PLC)..." style="flex:1;background:#090b0f;border:1px solid #2c3545;color:#fff;padding:9px 12px;border-radius:8px;">
                    <button class="t-btn ai-magic" onclick="handleAiBuildPrompt()">ابنِ الدائرة</button>
                </div>
                <div id="aiGuideOutput" style="margin-top:10px;background:#090b0f;border:1px solid #232a36;border-radius:8px;padding:10px;line-height:1.7;display:none;"></div>
            `;
        }

        function handleAiBuildPrompt() {
            const q = document.getElementById('aiCircuitPrompt').value.trim().toLowerCase();
            if (!q) {
                alert('اكتب وصف المشروع أو اختر أحد الأمثلة الجاهزة أعلاه.');
                return;
            }
            if (q.includes('عكس') || q.includes('يمين') || q.includes('يسار') || q.includes('reverse') || q.includes('forward')) {
                buildPresetCircuit('rev_motor');
            } else if (q.includes('ats') || q.includes('تحويل') || q.includes('مولد') || q.includes('وطني')) {
                buildPresetCircuit('ats_gen');
            } else if (q.includes('أردوينو') || q.includes('ردوينو') || q.includes('arduino') || q.includes('سيرفو') || q.includes('حساس')) {
                buildPresetCircuit('arduino_pump');
            } else if (q.includes('plc') || q.includes('بلسي') || q.includes('خزان') || q.includes('مضخ') || q.includes('صرف')) {
                buildPresetCircuit('plc_tank');
            } else if (q.includes('ستار') || q.includes('دلتا') || q.includes('star') || q.includes('delta') || q.includes('نجمة')) {
                buildPresetCircuit('star_delta');
            } else {
                buildPresetCircuit('dol');
            }
        }

        function buildPresetCircuit(presetKey) {
            stopSimulation();
            nodes = [];
            wires = [];
            nodeSeq = 0;

            if (window.innerWidth <= 768) {
                document.getElementById('compSidebar').classList.add('collapsed');
            }

            const guideBox = document.getElementById('aiGuideOutput');
            let guideHtml = '';

            if (presetKey === 'dol') {
                const sup = spawnComponent('SUPPLY_3P', 50, 55, '3P+N');
                const mcb = spawnComponent('MCB_3P', 50, 165, 'Q1-MCB');
                const km = spawnComponent('KM_3P_38A', 50, 285, 'KM1-MAIN');
                const mot = spawnComponent('MOTOR_SD', 60, 410, 'M1-3~');
                const stopB = spawnComponent('BTN_STOP', 210, 175, 'S0-STOP');
                const startB = spawnComponent('BTN_START', 210, 290, 'S1-START');
                const lamp = spawnComponent('LAMP_GREEN', 330, 290, 'H1-RUN');
                const mm = spawnComponent('MULTIMETER', 210, 410, 'CLAMP-A');

                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444');
                connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308');
                connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6');
                connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8');
                connectPorts(mcb.id, '2', km.id, 'L1', '#ef4444');
                connectPorts(mcb.id, '4', km.id, 'L2', '#eab308');
                connectPorts(mcb.id, '6', km.id, 'L3', '#3b82f6');
                connectPorts(km.id, 'T1', mot.id, 'U1', '#ef4444');
                connectPorts(km.id, 'T2', mot.id, 'V1', '#eab308');
                connectPorts(km.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(mcb.id, '2', stopB.id, '1', '#ef4444');
                connectPorts(stopB.id, '2', startB.id, '3', '#ef4444');
                connectPorts(startB.id, '4', km.id, 'A1', '#ef4444');
                connectPorts(mcb.id, 'N2', km.id, 'A2', '#38bdf8');
                connectPorts(km.id, 'A1', lamp.id, 'X1', '#10b981');
                connectPorts(mcb.id, 'N2', lamp.id, 'X2', '#38bdf8');
                connectPorts(km.id, 'T3', mm.id, 'V+', '#f59e0b');

                guideHtml = `<strong style="color:#10b981;">دائرة التشغيل المباشر (DOL):</strong> اضغط على الزر الأخضر <strong>S1-START</strong> لتشغيل المحرك ومشاهدة قراءة الأمبير <code>20.12 A</code>.`;
            } else if (presetKey === 'star_delta') {
                const sup = spawnComponent('SUPPLY_3P', 45, 55, '3P+N');
                const mcb = spawnComponent('MCB_3P', 45, 160, 'Q1-MCB');
                const kmMain = spawnComponent('KM_3P_38A', 45, 275, 'KM1-MAIN');
                const kmDelta = spawnComponent('KM_3P_38A', 180, 275, 'KM3-DELTA');
                const kmStar = spawnComponent('KM_3P_12A', 315, 275, 'KM2-STAR');
                const timer = spawnComponent('TIMER_RELAY', 325, 160, 'KT1-5s');
                const startB = spawnComponent('BTN_START', 195, 160, 'S1-START');
                const mot = spawnComponent('MOTOR_SD', 120, 405, 'M1 Y/Δ');
                const mm = spawnComponent('MULTIMETER', 315, 405, 'CLAMP-A');

                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444');
                connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308');
                connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6');
                connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8');
                connectPorts(mcb.id, '2', kmMain.id, 'L1', '#ef4444');
                connectPorts(mcb.id, '4', kmMain.id, 'L2', '#eab308');
                connectPorts(mcb.id, '6', kmMain.id, 'L3', '#3b82f6');
                connectPorts(kmMain.id, 'T1', mot.id, 'U1', '#ef4444');
                connectPorts(kmMain.id, 'T2', mot.id, 'V1', '#eab308');
                connectPorts(kmMain.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(kmDelta.id, 'T1', mot.id, 'W2', '#ef4444');
                connectPorts(kmDelta.id, 'T2', mot.id, 'U2', '#eab308');
                connectPorts(kmDelta.id, 'T3', mot.id, 'V2', '#3b82f6');
                connectPorts(kmStar.id, 'T1', mot.id, 'W2', '#10b981');
                connectPorts(kmStar.id, 'T2', mot.id, 'U2', '#10b981');
                connectPorts(kmStar.id, 'T3', mot.id, 'V2', '#10b981');
                connectPorts(mcb.id, '2', startB.id, '3', '#ef4444');
                connectPorts(startB.id, '4', kmMain.id, 'A1', '#ef4444');
                connectPorts(startB.id, '4', timer.id, 'A1', '#f59e0b');
                connectPorts(timer.id, '16', kmStar.id, 'A1', '#10b981');
                connectPorts(timer.id, '28', kmDelta.id, 'A1', '#3b82f6');
                connectPorts(mcb.id, 'N2', kmMain.id, 'A2', '#38bdf8');
                connectPorts(mcb.id, 'N2', kmDelta.id, 'A2', '#38bdf8');
                connectPorts(mcb.id, 'N2', kmStar.id, 'A2', '#38bdf8');
                connectPorts(mcb.id, 'N2', timer.id, 'A2', '#38bdf8');
                connectPorts(kmMain.id, 'T3', mm.id, 'V+', '#f59e0b');

                guideHtml = `<strong style="color:#f59e0b;">دائرة نجمة / دلتا (Star-Delta):</strong> اضغط <strong>S1-START</strong> ليبدأ المحرك بوضع <strong>STAR Y</strong> ثم يتحول تلقائياً إلى <strong>DELTA Δ</strong> بعد 5 ثوانٍ.`;
            } else if (presetKey === 'rev_motor') {
                const sup = spawnComponent('SUPPLY_3P', 50, 55, '3P+N');
                const mcb = spawnComponent('MCB_3P', 50, 160, 'Q1-MCB');
                const kmFwd = spawnComponent('KM_3P_38A', 50, 280, 'KM1-FWD');
                const kmRev = spawnComponent('KM_3P_38A', 195, 280, 'KM2-REV');
                const btnFwd = spawnComponent('BTN_START', 195, 160, 'S1-FWD');
                const btnRev = spawnComponent('BTN_START', 320, 160, 'S2-REV');
                const btnStop = spawnComponent('BTN_STOP', 320, 280, 'S0-STOP');
                const mot = spawnComponent('MOTOR_SD', 125, 405, 'M1 FWD/REV');

                connectPorts(sup.id, 'L1', mcb.id, '1', '#ef4444');
                connectPorts(sup.id, 'L2', mcb.id, '3', '#eab308');
                connectPorts(sup.id, 'L3', mcb.id, '5', '#3b82f6');
                connectPorts(sup.id, 'N', mcb.id, 'N1', '#38bdf8');
                connectPorts(mcb.id, '2', kmFwd.id, 'L1', '#ef4444');
                connectPorts(mcb.id, '4', kmFwd.id, 'L2', '#eab308');
                connectPorts(mcb.id, '6', kmFwd.id, 'L3', '#3b82f6');
                connectPorts(mcb.id, '2', kmRev.id, 'L3', '#ef4444');
                connectPorts(mcb.id, '4', kmRev.id, 'L2', '#eab308');
                connectPorts(mcb.id, '6', kmRev.id, 'L1', '#3b82f6');
                connectPorts(kmFwd.id, 'T1', mot.id, 'U1', '#ef4444');
                connectPorts(kmFwd.id, 'T2', mot.id, 'V1', '#eab308');
                connectPorts(kmFwd.id, 'T3', mot.id, 'W1', '#3b82f6');
                connectPorts(kmRev.id, 'T1', mot.id, 'U1', '#3b82f6');
                connectPorts(kmRev.id, 'T2', mot.id, 'V1', '#eab308');
                connectPorts(kmRev.id, 'T3', mot.id, 'W1', '#ef4444');
                connectPorts(btnFwd.id, '4', kmFwd.id, 'A1', '#10b981');
                connectPorts(btnRev.id, '4', kmRev.id, 'A1', '#f59e0b');
                connectPorts(mcb.id, 'N2', kmFwd.id, 'A2', '#38bdf8');
                connectPorts(mcb.id, 'N2', kmRev.id, 'A2', '#38bdf8');
                connectPorts(mcb.id, '2', btnStop.id, '1', '#ef4444');

                guideHtml = `<strong style="color:#38bdf8;">دائرة عكس حركة محرك 3 فاز (Forward / Reverse):</strong> اضغط <strong>S1-FWD</strong> للدوران يميناً أو <strong>S2-REV</strong> لعكس الاتجاه فوراً.`;
            } else if (presetKey === 'ats_gen') {
                const grid = spawnComponent('SUPPLY_3P', 45, 55, 'GRID-3P');
                const gen = spawnComponent('SUPPLY_3P', 225, 55, 'GEN-3P');
                const kmGrid = spawnComponent('KM_4P_40A', 45, 185, 'KM1-GRID');
                const kmGen = spawnComponent('KM_4P_40A', 225, 185, 'KM2-GEN');
                const phaseR = spawnComponent('PHASE_RELAY', 135, 305, 'PHASE-MON');
                const timer = spawnComponent('TIMER_RELAY', 285, 305, 'ATS-DELAY');
                const loadM = spawnComponent('MOTOR_SD', 135, 415, 'MAIN-LOAD');

                connectPorts(grid.id, 'L1', kmGrid.id, '1', '#ef4444');
                connectPorts(grid.id, 'L2', kmGrid.id, '3', '#eab308');
                connectPorts(grid.id, 'L3', kmGrid.id, '5', '#3b82f6');
                connectPorts(grid.id, 'N', kmGrid.id, '7', '#38bdf8');
                connectPorts(gen.id, 'L1', kmGen.id, '1', '#ef4444');
                connectPorts(gen.id, 'L2', kmGen.id, '3', '#eab308');
                connectPorts(gen.id, 'L3', kmGen.id, '5', '#3b82f6');
                connectPorts(gen.id, 'N', kmGen.id, '7', '#38bdf8');
                connectPorts(kmGrid.id, '2', loadM.id, 'U1', '#ef4444');
                connectPorts(kmGrid.id, '4', loadM.id, 'V1', '#eab308');
                connectPorts(kmGrid.id, '6', loadM.id, 'W1', '#3b82f6');
                connectPorts(kmGen.id, '2', loadM.id, 'U1', '#ef4444');
                connectPorts(kmGen.id, '4', loadM.id, 'V1', '#eab308');
                connectPorts(kmGen.id, '6', loadM.id, 'W1', '#3b82f6');
                connectPorts(grid.id, 'L1', phaseR.id, 'L1', '#ef4444');
                connectPorts(phaseR.id, '18', timer.id, 'A1', '#10b981');

                guideHtml = `<strong style="color:#eab308;">لوحة التحويل التلقائي (ATS — وطنية / مولد):</strong> مجهزة بمرحل مراقبة الفازات <code>PHASE-MON</code> ومؤقت التحويل <code>ATS-DELAY</code> وكونتاكتورين 4 أقطاب.`;
            } else if (presetKey === 'plc_tank') {
                const startB = spawnComponent('BTN_START', 35, 55, 'I0.0-START');
                const stopB  = spawnComponent('BTN_STOP', 155, 55, 'I0.1-STOP');
                const lt     = spawnComponent('TX_LEVEL_420', 275, 55, 'LT1-420mA');
                const plc    = spawnComponent('PLC_14IO', 135, 205, 'PLC-14IO');
                const rly    = spawnComponent('RELAY_2CO', 65, 355, 'K1-RELAY');
                const pump   = spawnComponent('PUMP_1P', 235, 355, 'P1-PUMP');

                connectPorts(startB.id, '4', plc.id, 'I0.0', '#10b981');
                connectPorts(stopB.id, '2', plc.id, 'I0.1', '#ef4444');
                connectPorts(lt.id, 'OUT', plc.id, 'IW64', '#06b6d4');
                connectPorts(plc.id, 'Q0.0', rly.id, 'A1', '#eab308');
                connectPorts(plc.id, '0V', rly.id, 'A2', '#38bdf8');
                connectPorts(rly.id, '14', pump.id, 'L', '#f59e0b');
                connectPorts(plc.id, '0V', pump.id, 'N', '#38bdf8');

                guideHtml = `<strong style="color:#38bdf8;">منظومة PLC الواقعية (مداخل علوية + Siemens S7-1212C + مرحل حماية + مضخة):</strong> اضغط على الزر الأخضر <strong>I0.0-START</strong> لتشغيل المضخة ومراقبة الخزان.`;
            } else if (presetKey === 'arduino_pump') {
                const ard = spawnComponent('ARDUINO_UNO', 55, 75, 'ARD-UNO');
                const pot = spawnComponent('POT_CTRL', 215, 75, 'LEVEL-SIM');
                const lcd = spawnComponent('LCD_I2C', 345, 75, 'LCD-16x2');
                const rel = spawnComponent('RELAY_5V', 55, 235, 'RLY-5V');
                const servo = spawnComponent('SERVO_MOTOR', 205, 235, 'VALVE-SRV');
                const pump = spawnComponent('PUMP_1P', 345, 235, 'PUMP-P1');

                connectPorts(ard.id, '5V', rel.id, 'VCC', '#ef4444');
                connectPorts(ard.id, 'GND', rel.id, 'GND', '#38bdf8');
                connectPorts(ard.id, 'D7', rel.id, 'IN', '#eab308');
                connectPorts(pot.id, 'W', ard.id, 'A0', '#06b6d4');
                connectPorts(ard.id, 'D9', servo.id, 'PWM', '#a855f7');
                connectPorts(ard.id, '5V', lcd.id, 'VCC', '#ef4444');
                connectPorts(rel.id, 'NO', pump.id, 'L', '#10b981');

                guideHtml = `<strong style="color:#a855f7;">مشروع الأردوينو المتكامل (Arduino Uno + 5V Relay + Servo + LCD 16x2):</strong> حرّك شريط المقاومة المتغيرة <strong>LEVEL-SIM</strong> لمحاكاة تغير مستوى الخزان ومشاهدة استجابة الريليه والسيرفو والشاشة فوراً!`;
            }

            if (guideBox) {
                guideBox.innerHTML = guideHtml;
                guideBox.style.display = 'block';
            }
            toggleSimulation();
        }

        function clearWorkspace() {
            stopSimulation();
            nodes = [];
            wires = [];
            nodeSeq = 0;
            renderAllNodes();
        }

        window.addEventListener('DOMContentLoaded', () => {
            buildPalette();
            openDock('ai');
        });
    </script>
</body>
</html>
